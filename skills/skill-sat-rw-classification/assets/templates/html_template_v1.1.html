<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__SECTION_TITLE__</title>
  <style>
    .reset-confirm[hidden] { display: none; }
    .reset-confirm { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 20px; background: rgba(0, 0, 0, .32); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .reset-confirm-card { width: min(400px, 100%); padding: 26px 24px 20px; background: #fff; border-radius: 22px; box-shadow: 0 24px 80px rgba(0, 0, 0, .24); text-align: center; }
    .reset-confirm-card h2 { margin: 0 0 10px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .reset-confirm-card p { margin: 0; color: #6e6e73; font-size: 14px; line-height: 1.6; }
    .reset-confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
    .reset-confirm-actions button { min-height: 44px; font-weight: 600; }
    #resetConfirmApply { background: #fdeeee; color: #c4281c; }
    #resetConfirmApply:hover { background: #fbdcdc; }
    .legacy-backup-notice[hidden] { display: none; }
    .legacy-backup-notice { margin: 12px 20px; padding: 14px 18px; border: 0; border-radius: 16px; background: #fff6e0; color: #5c4400; font-size: 13px; line-height: 1.6; }
    .legacy-backup-notice p { margin: 6px 0; }
    :root {
      --sat-bg-page: #f5f5f7;
      --sat-bg-shell: #f5f5f7;
      --sat-bg-panel: #ffffff;
      --sat-bg-subtle: #f5f5f7;
      --sat-bg-control: rgba(118, 118, 128, .12);
      --sat-bg-control-hover: rgba(118, 118, 128, .2);

      --sat-text-main: #1d1d1f;
      --sat-text-muted: #6e6e73;
      --sat-text-soft: #6e6e73;
      --sat-text-inverse: #ffffff;

      --sat-border-light: #d2d2d7;
      --sat-border-medium: #c7c7cc;
      --sat-border-strong: #6e6e73;
      --sat-divider: #86868b;
      --sat-hairline: rgba(0, 0, 0, .08);

      --sat-blue: #0071e3;
      --sat-blue-hover: #0068d1;
      --sat-blue-text: #0066cc;
      --sat-blue-muted: #e8f2ff;
      --sat-blue-border: #7ab8f5;

      --sat-choice-bg: #ffffff;
      --sat-choice-border: #d2d2d7;
      --sat-choice-hover-bg: #fafafc;
      --sat-choice-selected-border: #0071e3;
      --sat-choice-selected-bg: #f2f8ff;
      --sat-choice-disabled-bg: #f5f5f7;
      --sat-choice-disabled-text: #6e6e73;

      --sat-correct-bg: #e9f7ec;
      --sat-correct-border: #2f9e4a;
      --sat-correct-text: #1d7a34;
      --sat-incorrect-bg: #fdeeee;
      --sat-incorrect-border: #e5484d;
      --sat-incorrect-text: #c4281c;

      --sat-explanation-bg: #f5f5f7;
      --sat-explanation-border: #e5e5ea;
      --sat-explanation-accent: #e8e8ed;

      --sat-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Segoe UI", Roboto, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      --sat-font-reading: "Times New Roman", Times, serif;

      --sat-font-size-ui-xs: 12px;
      --sat-font-size-ui-sm: 13px;
      --sat-font-size-ui: 14px;
      --sat-font-size-body: 17px;
      --sat-font-size-question: 17px;
      --sat-font-size-choice: 16px;
      --sat-font-size-table: 15.5px;

      --sat-line-height-ui: 1.35;
      --sat-line-height-reading: 1.42;
      --sat-line-height-question: 1.47;
      --sat-line-height-choice: 1.38;
      --sat-line-height-table: 1.32;

      --sat-space-1: 4px;
      --sat-space-2: 8px;
      --sat-space-3: 12px;
      --sat-space-4: 16px;
      --sat-space-5: 20px;
      --sat-space-6: 24px;
      --sat-space-7: 32px;
      --sat-space-8: 40px;

      --sat-panel-padding-x: clamp(24px, 4vw, 64px);
      --sat-panel-padding-y: clamp(24px, 4vh, 44px);
      --sat-passage-max-width: 680px;
      --sat-question-max-width: 720px;
      --sat-table-max-width: 680px;

      --sat-radius-choice: 14px;
      --sat-radius-panel: 18px;
      --sat-radius-control: 12px;
      --sat-radius-card: 22px;
      --sat-radius-pill: 980px;

      --sat-shadow-none: none;
      --sat-shadow-card: 0 1px 2px rgba(0, 0, 0, .04), 0 6px 24px rgba(0, 0, 0, .05);
      --sat-shadow-popover: 0 20px 60px rgba(0, 0, 0, .18);
      --sat-focus-ring: 0 0 0 4px rgba(0, 113, 227, .28);
      --sat-glass: saturate(180%) blur(20px);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: var(--sat-font-ui);
      background: var(--sat-bg-panel);
      color: var(--sat-text-main);
      -webkit-font-smoothing: antialiased;
    }
    button {
      min-height: 40px;
      border: 1px solid transparent;
      background: var(--sat-bg-control);
      color: var(--sat-text-main);
      border-radius: var(--sat-radius-pill);
      padding: 8px 16px;
      font: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease, transform .15s ease, opacity .15s ease;
    }
    button:hover { background: var(--sat-bg-control-hover); }
    button:active { transform: scale(.97); }
    button:focus-visible, a:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid rgba(0, 113, 227, .5); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    button:disabled:hover { background: var(--sat-bg-control); }
    button.primary, #checkCurrentBtn { background: var(--sat-blue); color: var(--sat-text-inverse); font-weight: 600; }
    button.primary:hover, #checkCurrentBtn:hover { background: var(--sat-blue-hover); }
    button.primary:disabled, #checkCurrentBtn:disabled,
    button.primary:disabled:hover, #checkCurrentBtn:disabled:hover { background: var(--sat-bg-control); color: var(--sat-text-muted); opacity: .7; }
    #revealBtn:disabled { display: none; }
    button.danger { background: var(--sat-incorrect-bg); color: var(--sat-incorrect-text); }
    button.danger:hover { background: #fbdcdc; }
    button.ghost { background: transparent; }
    button.ghost:hover { background: var(--sat-bg-control); }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 62px;
      padding: 8px 24px;
      background: rgba(255, 255, 255, .88);
      -webkit-backdrop-filter: var(--sat-glass);
      backdrop-filter: var(--sat-glass);
      border-bottom: 1px solid var(--sat-hairline);
    }
    .topbar-main { flex: 1 1 0; min-width: 0; display: grid; gap: 1px; }
    .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 17px; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; color: var(--sat-text-main); white-space: nowrap; }
    .progress { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
    .toolbar > button, .more-menu > summary {
      min-height: 36px;
      padding: 6px 14px;
      border: 1px solid transparent;
      border-radius: var(--sat-radius-pill);
      background: var(--sat-bg-control);
      color: var(--sat-text-main);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }
    .more-menu { position: relative; }
    .more-menu > summary { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; list-style: none; user-select: none; transition: background-color .15s ease; }
    .more-menu > summary::-webkit-details-marker { display: none; }
    .more-menu > summary::after { content: ""; width: 6px; height: 6px; margin-top: -3px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
    .more-menu > summary:hover, .more-menu[open] > summary { background: var(--sat-bg-control-hover); }
    .more-menu > summary:focus-visible { outline: 3px solid rgba(0, 113, 227, .5); outline-offset: 2px; }
    .more-panel {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 25;
      display: grid;
      gap: 2px;
      width: 236px;
      padding: 8px;
      border: 1px solid var(--sat-hairline);
      border-radius: 16px;
      background: #ffffff;
      box-shadow: var(--sat-shadow-popover);
    }
    .tools-group { display: grid; gap: 2px; }
    .more-panel button { width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px; background: transparent; font-size: 15px; font-weight: 400; text-align: left; }
    .more-panel button:hover { background: var(--sat-bg-control); }
    .export-label { padding: 8px 12px 2px; color: var(--sat-text-soft); font-size: var(--sat-font-size-ui-xs); }
    .export-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 4px 6px; }
    .more-panel .export-group button { min-height: 38px; background: var(--sat-bg-control); font-size: 14px; font-weight: 500; text-align: center; }
    .more-panel .export-group button:hover { background: var(--sat-bg-control-hover); }
    #resetBtn { color: var(--sat-incorrect-text); }
    #resetBtn:hover { background: var(--sat-incorrect-bg); }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
      margin: 0 0 76px;
      padding: 0;
      background: var(--sat-bg-panel);
      position: relative;
    }
    .layout::before { content: none; }
    .pane {
      min-width: 0;
      background: var(--sat-bg-panel);
      padding: 32px clamp(24px, 3.2vw, 48px) 44px;
      border: 0;
    }
    .stimulus-pane { border-right: 3px solid var(--sat-explanation-accent); }
    .stimulus, .pane-footnote { max-width: var(--sat-passage-max-width); margin-inline: auto; }
    .question-pane > * { max-width: var(--sat-question-max-width); margin-inline: auto; }
    .pane-footnote { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--sat-hairline); color: var(--sat-text-muted); font-size: 12px; line-height: 1.6; }
    .pane-footnote + .pane-footnote { margin-top: 10px; padding-top: 0; border-top: 0; }
    @media (min-width: 821px) {
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; overflow: hidden; }
      .mode-banner, .legacy-backup-notice { flex: 0 0 auto; }
      #practiceLayout { flex: 1 1 0; min-height: 0; margin: 0; grid-template-rows: minmax(0, 1fr); }
      #practiceLayout > .pane { overflow: auto; overscroll-behavior: contain; }
      /* By id: the general .nav rule further down makes the bar fixed for narrow screens and would
         otherwise win here too, leaving the bar on top of the last lines of both panes. */
      #practiceNav { position: static; flex: 0 0 auto; }
      .exam-shell.visible { flex: 1 1 0; min-height: 0; width: 100%; margin-bottom: 0; overflow: auto; }
    }
    .stimulus {
      font-family: var(--sat-font-reading);
      font-size: var(--sat-font-size-body);
      line-height: 1.65;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .stimulus p { margin: 0 0 16px; }
    .stimulus p:last-child { margin-bottom: 0; }
    .stimulus .text-heading {
      margin: 18px 0 8px;
      font-weight: 700;
    }
    .stimulus ul {
      margin: 0 0 16px 22px;
      padding: 0;
    }
    .stimulus li { margin: 5px 0; }
    .chart-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 12px 0 4px;
      cursor: zoom-in;
    }
    .chart-image-wrap {
      width: 100%;
    }
    .chart-size-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-family: var(--sat-font-ui);
      font-size: 0.8rem;
      margin: 4px 0 8px;
      color: var(--sat-text-muted);
    }
    .chart-size-btn {
      min-height: 0;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      line-height: 1.35;
      color: var(--sat-text-muted);
      background: var(--sat-bg-control);
    }
    .chart-size-btn.active {
      background: var(--sat-blue-muted);
      color: var(--sat-blue-text);
      font-weight: 700;
    }
    .chart-open-button {
      display: inline;
      min-height: 0;
      margin: -2px 0 16px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--sat-blue-text);
      font: inherit;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .chart-open-button:hover,
    .chart-open-button:focus-visible {
      background: transparent;
      text-decoration: underline;
    }
    body.chart-question .layout {
      grid-template-columns: minmax(0, var(--chart-left-pct, 55%)) minmax(0, 1fr);
    }
    .chart-lightbox {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 5vh 2.5vw;
      background: rgba(0, 0, 0, 0.78);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .chart-lightbox.visible { display: flex; }
    .chart-lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    }
    .chart-lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 44px;
      height: 44px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      border-color: transparent;
      background: rgba(255, 255, 255, 0.18);
      color: white;
      font-size: 28px;
      line-height: 1;
    }
    .chart-lightbox-close:hover { background: rgba(255, 255, 255, 0.3); }
    .blank {
      color: var(--sat-blue);
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--sat-blue);
    }
    .underline {
      text-decoration: underline;
      text-underline-offset: 0.12em;
    }
    .italic { font-style: italic; }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 16px;
      font-size: var(--sat-font-size-table);
      line-height: var(--sat-line-height-table);
    }
    .data-table th,
    .data-table td {
      border: 1px solid var(--sat-border-light);
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
    }
    .data-table th { background: var(--sat-bg-subtle); }
    .data-table caption {
      margin-bottom: 8px;
      color: var(--sat-text-main);
      font-weight: 700;
      text-align: left;
    }
    .visual-render-error {
      margin: 12px 0;
      padding: 12px 14px;
      border: 0;
      border-radius: var(--sat-radius-control);
      background: var(--sat-incorrect-bg);
      color: var(--sat-incorrect-text);
      font-family: var(--sat-font-ui);
      font-size: var(--sat-font-size-ui-sm);
    }
    .empty-stimulus {
      color: var(--sat-text-muted);
      border: 0;
      border-radius: var(--sat-radius-choice);
      background: var(--sat-bg-subtle);
      padding: 18px;
    }
    .question-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      padding: 5px;
      border-radius: 12px;
      background: var(--sat-bg-subtle);
    }
    #starBtn {
      min-height: 34px;
      padding: 5px 12px;
      background: transparent;
      color: var(--sat-text-main);
      font-size: 14px;
      white-space: nowrap;
    }
    #starBtn:hover { background: var(--sat-bg-control); }
    .question-timer { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; padding-left: 8px; }
    .question-timer[hidden] { display: none; }
    .question-timer-value { min-width: 46px; color: var(--sat-text-main); font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .question-timer.paused .question-timer-value { color: var(--sat-text-muted); }
    .question-timer.done { padding-right: 8px; }
    .question-timer.done .question-timer-value { color: var(--sat-text-muted); font-weight: 500; }
    #questionTimerToggle { min-height: 34px; padding: 5px 12px; background: transparent; color: var(--sat-text-main); font-size: 14px; white-space: nowrap; }
    #questionTimerToggle:hover { background: var(--sat-bg-control); }
    #questionTimerToggle[aria-pressed="true"] { background: var(--sat-blue-muted); color: var(--sat-blue-text); }
    .question-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .question-number { display: grid; place-items: center; min-width: 34px; height: 34px; margin: 0; padding: 0 9px; border-radius: 8px; background: var(--sat-text-main); color: #fff; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .question-number:empty { display: none; }
    .prompt {
      font-family: var(--sat-font-reading);
      font-size: var(--sat-font-size-question);
      line-height: var(--sat-line-height-question);
      margin: 0 0 18px;
      white-space: pre-wrap;
    }
    .choices { display: grid; gap: 10px; }
    .choice {
      display: grid;
      grid-template-columns: 30px 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 54px;
      text-align: left;
      padding: 12px 16px;
      border: 1px solid var(--sat-choice-border);
      border-radius: var(--sat-radius-choice);
      background: var(--sat-choice-bg);
      color: var(--sat-text-main);
      font-size: var(--sat-font-size-choice);
      font-weight: 400;
      line-height: var(--sat-line-height-choice);
    }
    .choice:hover { background: var(--sat-choice-hover-bg); border-color: var(--sat-border-medium); }
    .choice:active { transform: scale(.995); }
    .choice:disabled, .choice:disabled:hover { opacity: 1; background: var(--sat-choice-disabled-bg); border-color: transparent; color: var(--sat-choice-disabled-text); }
    .choice.selected, .choice.selected:hover { border-color: var(--sat-choice-selected-border); background: var(--sat-choice-selected-bg); box-shadow: inset 0 0 0 1px var(--sat-choice-selected-border); color: var(--sat-text-main); }
    .choice.correct, .choice.correct:hover { border-color: var(--sat-correct-border); background: var(--sat-correct-bg); box-shadow: inset 0 0 0 1px var(--sat-correct-border); color: var(--sat-text-main); }
    .choice.incorrect, .choice.incorrect:hover { border-color: var(--sat-incorrect-border); background: var(--sat-incorrect-bg); box-shadow: inset 0 0 0 1px var(--sat-incorrect-border); color: var(--sat-text-main); }
    .label {
      display: inline-grid; place-items: center; width: 28px; height: 28px;
      border: 1.5px solid var(--sat-border-medium); border-radius: 50%;
      font-family: var(--sat-font-ui); font-size: 13px; font-weight: 600;
      color: var(--sat-text-soft); background: transparent;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .choice.selected .label { border-color: var(--sat-blue); background: var(--sat-blue); color: #fff; }
    .choice.correct .label { border-color: var(--sat-correct-text); background: var(--sat-correct-text); color: #fff; }
    .choice.incorrect .label { border-color: var(--sat-incorrect-text); background: var(--sat-incorrect-text); color: #fff; }
    .choice-text { font-family: var(--sat-font-reading); font-size: 17px; }
    .feedback {
      min-height: 0; margin: 14px 0 0; padding: 0;
      font-family: var(--sat-font-ui); font-size: var(--sat-font-size-ui-sm); line-height: 1.45;
      border: 0; color: var(--sat-text-muted); background: transparent;
    }
    .feedback:empty, .review-hint:empty, .sync-status:empty { display: none; }
    .feedback.correct, .feedback.incorrect { padding: 12px 16px; border-radius: var(--sat-radius-control); font-size: var(--sat-font-size-ui); font-weight: 600; }
    .feedback.correct { color: var(--sat-correct-text); background: var(--sat-correct-bg); }
    .feedback.incorrect { color: var(--sat-incorrect-text); background: var(--sat-incorrect-bg); }
    .source-line { margin: 12px 0 0; color: var(--sat-text-muted); font-size: 13px; line-height: 1.6; }
    .source-line span { display: inline-block; margin-left: 8px; padding: 0 9px; border-radius: var(--sat-radius-pill); background: var(--sat-bg-control); font-size: 12px; white-space: nowrap; }
    .explanation {
      display: none; margin-top: 16px;
      border: 1px solid var(--sat-explanation-border); border-radius: var(--sat-radius-panel);
      background: var(--sat-explanation-bg); line-height: 1.55; overflow: hidden;
    }
    .explanation.visible { display: block; }

    /* 词汇解释：正文里的难词可以点开，提交后在“本题词汇”里逐条展开 */
    .gloss {
      text-decoration: underline dotted var(--sat-blue-border); text-decoration-thickness: 1.5px; text-underline-offset: 3px;
      border-radius: 4px; cursor: pointer; transition: background .15s ease;
    }
    .gloss:hover, .gloss[aria-expanded="true"] { background: var(--sat-blue-muted); }
    .gloss:focus-visible { outline: none; box-shadow: var(--sat-focus-ring); }
    .gloss.is-saved { background: rgba(255, 204, 0, .24); }
    .gloss-popover {
      position: fixed; z-index: 40; width: min(340px, calc(100vw - 24px)); max-height: min(70vh, 460px); overflow: auto;
      padding: 14px 16px 16px; border: 1px solid var(--sat-hairline); border-radius: var(--sat-radius-panel);
      background: var(--sat-bg-panel); box-shadow: var(--sat-shadow-popover);

      nextBtn: document.getElementById("nextBtn"),
      chartLightbox: document.getElementById("chartLightbox"),
      chartLightboxImage: document.getElementById("chartLightboxImage"),
      chartLightboxClose: document.getElementById("chartLightboxClose")
    };

    function defaultQuestionState() {
      return {
        selected: "", checked: false, submitted: false, correct: false,
        starred: false, revealed: false, revealedAt: null, confidence: "",
        errorTags: [], note: "", highlights: [], updatedAt: null,
        submittedAt: null, firstWrongAt: null, lastAttemptAt: null,
        lastRedoCorrect: null, attemptCount: 0, redoCount: 0,
        reviewStage: 0, nextDueAt: null, mastered: false, masteredAt: null
      };
    }

    function satPageId() {
      const marker = "/sat-practice/";
      const pathname = location.pathname;
      const relative = pathname.includes(marker)
        ? pathname.slice(pathname.indexOf(marker) + marker.length)
        : pathname.split("/").slice(-2).join("/");
      return decodeURIComponent(relative).replace(/^\/+/, "").replace(/\.html$/, "") || "index";
    }

    function nowIso() { return new Date().toISOString(); }
    function timeOf(value) {
      const time = value ? new Date(value).getTime() : 0;
      return Number.isFinite(time) ? time : 0;
    }
    function asRecord(value) { return value && typeof value === "object" && !Array.isArray(value) ? value : {}; }
    function uniqueStrings(value) { return [...new Set((Array.isArray(value) ? value : []).map(String).filter(Boolean))]; }

    /*
     * Formal exam metadata is deliberately fail-closed. Only this shape is read:
     * {
     *   "examEligible": true,
     *   "moduleSpec": {
     *     "m1": {"label":"Module 1","durationSeconds":1920,"questionIds":["..."]},
     *     "m2_easy": {"label":"Module 2 · Easy","durationSeconds":1920,"questionIds":["..."]},
     *     "m2_hard": {"label":"Module 2 · Hard","durationSeconds":1920,"questionIds":["..."]}
     *   },
     *   "examVariants": [
     *     {"id":"fixed-easy","label":"Fixed Easy","branch":"easy","modules":["m1","m2_easy"]},
     *     {"id":"fixed-hard","label":"Fixed Hard","branch":"hard","modules":["m1","m2_hard"]}
     *   ]
     * }
     * examVariants may contain one explicit fixed branch (including Hard-only
     * source sets) or both Easy and Hard. Unknown fields are ignored; a
     * missing/invalid field disables exam mode.
     */
    function readPageMeta() {
      const node = document.getElementById("satPageMeta");
      const raw = node ? String(node.textContent || "").trim() : "";
      const unresolvedPlaceholder = "__PAGE_" + "META_JSON__";
      if (!raw || raw === unresolvedPlaceholder) return {};
      try { return asRecord(JSON.parse(raw)); }
      catch (error) {
        console.warn("[sat exam] PAGE_META ignored because it is not valid JSON", error);
        return {};
      }
    }

    function safeExamToken(value) {
      const token = typeof value === "string" ? value.trim() : "";
      return token && token.length <= 80 && /^[A-Za-z0-9_.:-]+$/.test(token) ? token : "";
    }

    function safeExamLabel(value, fallback) {
      const label = typeof value === "string" ? value.trim() : "";
      return (label || fallback || "").slice(0, 120);
    }

    function normalizeExamConfig(value) {
      const meta = asRecord(value);
      if (meta.examEligible !== true || !QUESTIONS.length) return null;
      const questionById = new Map();
      for (const question of QUESTIONS) {
        const questionId = safeExamToken(question && question.question_id);
        const labels = new Set((Array.isArray(question && question.choices) ? question.choices : []).map(choice => String(choice.label || "")));
        if (!questionId || questionById.has(questionId) || !labels.size || !labels.has(String(question.correct_answer || ""))) return null;
        if (question.table_data && !normalizeTableDataForDisplay(question.table_data)) return null;
        questionById.set(questionId, question);
      }

      const rawModules = asRecord(meta.moduleSpec);
      const modules = {};
      for (const [rawKey, rawModule] of Object.entries(rawModules)) {
        const key = safeExamToken(rawKey);
        const spec = asRecord(rawModule);
        const durationSeconds = Number(spec.durationSeconds);
        const questionIds = Array.isArray(spec.questionIds) ? spec.questionIds.map(safeExamToken) : [];
        if (!key || modules[key] || !Number.isInteger(durationSeconds) || durationSeconds < 60 || durationSeconds > 10800) return null;
        if (!questionIds.length || questionIds.some(questionId => !questionId || !questionById.has(questionId))) return null;
        if (new Set(questionIds).size !== questionIds.length) return null;
        modules[key] = {
          key,
          label: safeExamLabel(spec.label, key),
          durationSeconds,
          questionIds
        };
      }

      const rawVariants = Array.isArray(meta.examVariants) ? meta.examVariants : [];
      const variants = [];
      const seenVariantIds = new Set();
      for (const rawVariant of rawVariants) {
        const variant = asRecord(rawVariant);
        const id = safeExamToken(variant.id);
        const branch = variant.branch === "easy" || variant.branch === "hard" ? variant.branch : "";
        const moduleKeys = Array.isArray(variant.modules) ? variant.modules.map(safeExamToken) : [];
        if (!id || seenVariantIds.has(id) || !branch || moduleKeys.length !== 2 || moduleKeys.some(key => !modules[key])) return null;
        if (moduleKeys[0] === moduleKeys[1]) return null;
        const firstIds = new Set(modules[moduleKeys[0]].questionIds);
        if (modules[moduleKeys[1]].questionIds.some(questionId => firstIds.has(questionId))) return null;
        seenVariantIds.add(id);
        variants.push({
          id,
          label: safeExamLabel(variant.label, `M1 + ${branch === "easy" ? "Easy" : "Hard"}`),
          branch,
          moduleKeys
        });
      }

      const easy = variants.filter(variant => variant.branch === "easy");
      const hard = variants.filter(variant => variant.branch === "hard");
      if (variants.length < 1 || variants.length > 2 || easy.length > 1 || hard.length > 1) return null;
      if (variants.length === 2) {
        if (easy.length !== 1 || hard.length !== 1) return null;
        if (easy[0].moduleKeys[0] !== hard[0].moduleKeys[0]) return null;
        if (easy[0].moduleKeys[1] === hard[0].moduleKeys[1]) return null;
      }

      const config = {
        examEligible: true,
        modules,
        variants: variants.length === 2 ? [easy[0], hard[0]] : [variants[0]]
      };
      config.signature = JSON.stringify(config);
      return config;
    }

    function examVariantById(variantId) {
      return EXAM_CONFIG ? EXAM_CONFIG.variants.find(variant => variant.id === variantId) || null : null;
    }

    function examQuestionById(questionId) {
      return QUESTIONS.find(question => question.question_id === questionId) || null;
    }

    function blankExamModuleState() {
      return { answers: {}, marked: [], current: 0, startedAt: null, deadlineAt: null, submittedAt: null, submitReason: "" };
    }

    function normalizeExamModuleState(value, moduleSpec) {
      const source = asRecord(value);
      const answers = {};
      const sourceAnswers = asRecord(source.answers);
      for (const questionId of moduleSpec.questionIds) {
        const question = examQuestionById(questionId);
        const selected = typeof sourceAnswers[questionId] === "string" ? sourceAnswers[questionId] : "";
        if ((question.choices || []).some(choice => String(choice.label) === selected)) answers[questionId] = selected;
      }
      const maxIndex = Math.max(moduleSpec.questionIds.length - 1, 0);
      const currentIndex = Number.isInteger(source.current) ? Math.min(Math.max(source.current, 0), maxIndex) : 0;
      const timestamp = key => Number.isFinite(Number(source[key])) && Number(source[key]) > 0 ? Number(source[key]) : null;
      return {
        answers,
        marked: [...new Set(Array.isArray(source.marked) ? source.marked : [])].filter(questionId => moduleSpec.questionIds.includes(questionId)),
        current: currentIndex,
        startedAt: timestamp("startedAt"),
        deadlineAt: timestamp("deadlineAt"),
        submittedAt: timestamp("submittedAt"),
        submitReason: source.submitReason === "timeout" ? "timeout" : source.submitReason === "manual" ? "manual" : ""
      };
    }

    function normalizeExamSession(value) {
      const source = asRecord(value);
      if (source.version !== 1 || source.configSignature !== EXAM_CONFIG.signature) return null;
      const variant = examVariantById(source.variantId);
      if (!variant || !["m1", "m2", "complete", "review"].includes(source.phase)) return null;
      const modules = {};
      for (const moduleKey of variant.moduleKeys) {
        modules[moduleKey] = normalizeExamModuleState(asRecord(source.modules)[moduleKey], EXAM_CONFIG.modules[moduleKey]);
      }
      const first = modules[variant.moduleKeys[0]];
      const second = modules[variant.moduleKeys[1]];
      if (!first.startedAt || !first.deadlineAt) return null;
      if (["m2", "complete", "review"].includes(source.phase) && (!first.submittedAt || !second.startedAt || !second.deadlineAt)) return null;
      if (["complete", "review"].includes(source.phase) && !second.submittedAt) return null;
      const createdAt = Number(source.createdAt);
      return {
        version: 1,
        sessionId: safeExamToken(source.sessionId) || createExamSessionId(),
        configSignature: EXAM_CONFIG.signature,
        variantId: variant.id,
        phase: source.phase,
        modules,
        createdAt: Number.isFinite(createdAt) && createdAt > 0 ? createdAt : first.startedAt,
        completedAt: Number.isFinite(Number(source.completedAt)) ? Number(source.completedAt) : null,
        reviewEnteredAt: Number.isFinite(Number(source.reviewEnteredAt)) ? Number(source.reviewEnteredAt) : null,
        reviewIndex: Number.isInteger(source.reviewIndex) ? Math.max(source.reviewIndex, 0) : 0,
        revision: Number.isInteger(source.revision) && source.revision >= 0 ? source.revision : 0,
        writerId: safeExamToken(source.writerId),
        updatedAt: Number.isFinite(Number(source.updatedAt)) ? Number(source.updatedAt) : null
      };
    }

    function loadExamSession() {
      try {
        const raw = learningStorage.getItem(EXAM_STORAGE_KEY);
        if (!raw) return null;
        return normalizeExamSession(JSON.parse(raw));
      } catch (error) {
        console.warn("[sat exam] saved session ignored", error);
        return null;
      }
    }

    function examStorageProbe() {
      const key = `${EXAM_STORAGE_KEY}:probe:${EXAM_TAB_ID}`;
      const token = `${Date.now()}-${Math.random()}`;
      try {
        learningStorage.setItem(key, token);
        if (learningStorage.getItem(key) !== token) throw new Error("storage readback mismatch");
        learningStorage.removeItem(key);
        return true;
      } catch (error) {
        try { learningStorage.removeItem(key); } catch {}
        console.warn("[sat exam] persistence probe failed", error);
        return false;
      }
    }

    function markExamPersistenceIssue(message, block = true) {
      examPersistenceMessage = message;
      if (block) {
        examWriteBlocked = true;
        clearExamTimer();
      }
      syncExamPersistenceNotice();
    }

    function syncExamPersistenceNotice() {
      els.examShell.querySelector("#examPersistenceNotice")?.remove();
      if (!examPersistenceMessage) return;
      const notice = document.createElement("div");
      notice.id = "examPersistenceNotice";
      notice.className = "exam-persistence-alert";
      notice.setAttribute("role", "alert");
      notice.textContent = examPersistenceMessage;
      if (examWriteBlocked) {
        clearExamTimer();
        const reload = document.createElement("button");
        reload.type = "button";
        reload.textContent = "重新载入最新进度";
        reload.addEventListener("click", () => location.reload());
        notice.appendChild(reload);
        els.examShell.querySelectorAll("[data-exam-start], [data-exam-choice], [data-exam-index], #examPrev, #examNext, #examSubmitModule, #examMark, #examNavToggle, #examOpenCheck, #examCheckBack, #examStartM2, #examEnterReview, #examCompleteReset, #examReviewPrev, #examReviewNext, #examReviewResults, [data-exam-review-index]")
          .forEach(control => { control.disabled = true; });
      }
      els.examShell.prepend(notice);
    }

    function parseStoredExamEnvelope() {
      const raw = learningStorage.getItem(EXAM_STORAGE_KEY);
      if (!raw) return null;
      return asRecord(JSON.parse(raw));
    }

    function saveExamSession() {
      if (!examSession || examWriteBlocked) return false;
      try {
        const stored = parseStoredExamEnvelope();
        const localRevision = Number.isInteger(examSession.revision) ? examSession.revision : 0;
        const storedRevision = Number.isInteger(stored && stored.revision) ? stored.revision : 0;
        const changedElsewhere = stored && (
          (stored.sessionId && stored.sessionId !== examSession.sessionId)
          || (stored.sessionId === examSession.sessionId && stored.writerId !== EXAM_TAB_ID && storedRevision > localRevision)
        );
        if (changedElsewhere || (!stored && localRevision > 0)) {
          markExamPersistenceIssue("检测到另一个标签页已更新或重置本次模考。为避免覆盖答案，已停止本页保存。");
          return false;
        }
        const snapshot = {
          ...examSession,
          revision: localRevision + 1,
          writerId: EXAM_TAB_ID,
          updatedAt: Date.now()
        };
        const payload = JSON.stringify(snapshot);
        learningStorage.setItem(EXAM_STORAGE_KEY, payload);
        if (learningStorage.getItem(EXAM_STORAGE_KEY) !== payload) throw new Error("storage readback mismatch");
        examSession = snapshot;
        examPersistenceMessage = "";
        return true;
      } catch (error) {
        console.warn("[sat exam] session could not be persisted", error);
        markExamPersistenceIssue("本机存储不可用，模考进度无法安全保存。已停止继续作答，请重新载入后再试。");
        return false;
      }
    }

    function createExamSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
      return `exam-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function fixedBranchLabel(variant) {
      return `固定卷：${variant.label}`;
    }

    function formatExamDuration(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return remainder ? `${minutes} 分 ${remainder} 秒` : `${minutes} 分钟`;
    }

    function createExamSession(variantId) {
      if (examStartInProgress || examSession) return;
      const variant = examVariantById(variantId);
      if (!variant) return;
      if (!examStorageProbe()) {
        markExamPersistenceIssue("本机存储不可用，为避免刷新后丢失答案，未启动模考。", false);
        return;
      }
      try {
        const stored = parseStoredExamEnvelope();
        if (stored) {
          const restorable = normalizeExamSession(stored);
          if (restorable) {
            examSession = restorable;
            examPersistenceMessage = "检测到已有模考进度，已恢复原会话，未创建重复模考。";
            renderExam();
            return;
          }
          learningStorage.removeItem(EXAM_STORAGE_KEY);
          if (learningStorage.getItem(EXAM_STORAGE_KEY) !== null) throw new Error("stale session could not be cleared");
        }
      } catch (error) {
        console.warn("[sat exam] existing session could not be reconciled", error);
        markExamPersistenceIssue("无法校验或替换旧模考记录，未启动新模考。", false);
        return;
      }
      examStartInProgress = true;
      const startedAt = Date.now();
      const modules = {};
      for (const moduleKey of variant.moduleKeys) modules[moduleKey] = blankExamModuleState();
      const firstKey = variant.moduleKeys[0];
      modules[firstKey].startedAt = startedAt;
      modules[firstKey].deadlineAt = startedAt + EXAM_CONFIG.modules[firstKey].durationSeconds * 1000;
      examSession = {
        version: 1,
        sessionId: createExamSessionId(),
        configSignature: EXAM_CONFIG.signature,
        variantId: variant.id,
        phase: "m1",
        modules,
        createdAt: startedAt,
        completedAt: null,
        reviewEnteredAt: null,
        reviewIndex: 0,
        revision: 0,
        writerId: "",
        updatedAt: null
      };
      if (!saveExamSession()) examSession = null;
      examStartInProgress = false;
      renderExam();
    }

    function clearExamTimer() {
      if (examTimer) window.clearInterval(examTimer);
      examTimer = null;
    }

    function activeExamModule() {
      if (!examSession || !["m1", "m2"].includes(examSession.phase)) return null;
      const variant = examVariantById(examSession.variantId);
      const moduleIndex = examSession.phase === "m1" ? 0 : 1;
      const moduleKey = variant.moduleKeys[moduleIndex];
      return { variant, moduleIndex, moduleKey, spec: EXAM_CONFIG.modules[moduleKey], state: examSession.modules[moduleKey] };
    }

    function submitExamModule(reason) {
      const active = activeExamModule();
      if (!active || active.state.submittedAt) return;
      active.state.submittedAt = Date.now();
      active.state.submitReason = reason === "timeout" ? "timeout" : "manual";
      clearExamTimer();
      examCheckOpen = false;
      examNavigatorOpen = false;
      if (active.moduleIndex === 1) {
        examSession.phase = "complete";
        examSession.completedAt = active.state.submittedAt;
      }
      if (saveExamSession()) archiveExamSession();
      renderExam();
    }

    function startExamSecondModule() {
      const variant = examVariantById(examSession && examSession.variantId);
      if (!variant || examSession.phase !== "m1") return;
      const first = examSession.modules[variant.moduleKeys[0]];
      if (!first.submittedAt) return;
      const secondKey = variant.moduleKeys[1];
      const second = examSession.modules[secondKey];
      const startedAt = Date.now();
      second.startedAt = startedAt;
      second.deadlineAt = startedAt + EXAM_CONFIG.modules[secondKey].durationSeconds * 1000;
      examSession.phase = "m2";
      saveExamSession();
      renderExam();
    }

    function scoreExamAnswers(questionIds, answers) {
      let correct = 0;
      let incorrect = 0;
      let blank = 0;
      for (const questionId of questionIds) {
        const selected = answers[questionId] || "";
        if (!selected) blank += 1;
        else if (selected === examQuestionById(questionId).correct_answer) correct += 1;
        else incorrect += 1;
      }
      const total = questionIds.length;
      return { correct, incorrect, blank, total, accuracy: total ? Math.round(correct / total * 1000) / 10 : 0 };
    }

    function scoreExamModule(moduleKey) {
      return scoreExamAnswers(EXAM_CONFIG.modules[moduleKey].questionIds, examSession.modules[moduleKey].answers);
    }

    function loadExamHistory() {
      try {
        const raw = JSON.parse(learningStorage.getItem(EXAM_HISTORY_KEY) || "null");
        return (Array.isArray(raw && raw.records) ? raw.records : []).filter(item => item && typeof item === "object" && typeof item.id === "string");
      } catch (error) {
        return [];
      }
    }

    // 只归档已经完成的模考；同一场模考只存一次
    function archiveExamSession() {
      if (!examSession || !["complete", "review"].includes(examSession.phase)) return;
      const variant = examVariantById(examSession.variantId);
      if (!variant) return;
      try {
        const records = loadExamHistory();
        if (records.some(item => item.id === examSession.sessionId)) return;
        records.push({
          version: 1, id: examSession.sessionId, pageId: PAGE_ID, title: document.title,
          variantId: variant.id, variantLabel: variant.label, branch: variant.branch,
          createdAt: examSession.createdAt, completedAt: examSession.completedAt,
          modules: variant.moduleKeys.map(moduleKey => {
            const spec = EXAM_CONFIG.modules[moduleKey], moduleState = examSession.modules[moduleKey], score = scoreExamModule(moduleKey);
            return {
              key: moduleKey, label: spec.label, durationSeconds: spec.durationSeconds,
              startedAt: moduleState.startedAt, submittedAt: moduleState.submittedAt, submitReason: moduleState.submitReason,
              questionIds: [...spec.questionIds], answers: { ...moduleState.answers }, marked: [...moduleState.marked],
              score: { correct: score.correct, incorrect: score.incorrect, blank: score.blank, total: score.total },
              // 完成时每道题的评分版本：之后答案或解析改了，回看时能指出哪些题已不同
              revisions: Object.fromEntries(spec.questionIds.map(questionId => [questionId, String(examQuestionById(questionId)?.gradingRevision || "")]))
            };
          })
        });
        learningStorage.setItem(EXAM_HISTORY_KEY, JSON.stringify({ version: 1, records: records.slice(-50) }));
      } catch (error) {
        console.warn("[sat exam] history could not be saved", error);
      }
    }

    // 回看视图属于打开它的那个账号：token 不再是当前 owner 时一律作废，重新从当前 owner 的存储读
    function currentExamHistoryView() {
      if (examHistoryView && !learningStorage.isCurrent(examHistoryView.token)) examHistoryView = null;
      return examHistoryView;
    }

    function forgetExamHistoryView() {
      examHistoryView = null;
      examCheckOpen = false;
      examNavigatorOpen = false;
    }

    function loadExamHistoryView(recordId) {
      if (!learningStorage.ready()) return null;
      const token = learningStorage.token();
      const record = loadExamHistory().find(item => item.id === recordId && item.pageId === PAGE_ID);
      if (!record || !Array.isArray(record.modules)) return null;
      // 记录本身只读：不改写、不补字段。退休的题（当前页面已没有）不进重算，但会被数出来。
      const modules = record.modules.map(value => {
        const source = asRecord(value);
        const listed = (Array.isArray(source.questionIds) ? source.questionIds : []).filter(questionId => typeof questionId === "string");
        const questionIds = listed.filter(questionId => examQuestionById(questionId));
        const stored = asRecord(source.score), whole = number => Number.isInteger(number) && number >= 0;
        const revisions = source.revisions && typeof source.revisions === "object" && !Array.isArray(source.revisions) ? source.revisions : null;
        return {
          label: safeExamLabel(source.label, "Module"), questionIds, answers: asRecord(source.answers),
          startedAt: Number(source.startedAt) || null, submittedAt: Number(source.submittedAt) || null,
          durationSeconds: Number(source.durationSeconds) || null, submitReason: source.submitReason === "timeout" ? "timeout" : "",
          archivedScore: whole(stored.correct) && whole(stored.total) && stored.correct <= stored.total ? { correct: stored.correct, total: stored.total } : null,
          retired: listed.length - questionIds.length,
          // 没有版本标记的旧记录：无法判断答案是否改过（null）
          changed: revisions ? questionIds.filter(questionId => String(revisions[questionId] || "") !== String(examQuestionById(questionId).gradingRevision || "")).length : null
        };
      });
      const kept = modules.filter(item => item.questionIds.length);
      // 完成时成绩取自记录里每个模块存下的成绩；任何一个模块缺成绩就不显示，以免拼出不完整的数
      const archived = modules.every(item => item.archivedScore)
        ? modules.reduce((sum, item) => ({ correct: sum.correct + item.archivedScore.correct, total: sum.total + item.archivedScore.total }), { correct: 0, total: 0 })
        : null;
      const grading = {
        archived,
        retired: modules.reduce((sum, item) => sum + item.retired, 0),
        changed: modules.some(item => item.changed === null) ? null : modules.reduce((sum, item) => sum + item.changed, 0)
      };
      return kept.length ? { record, modules: kept, grading, phase: "result", index: 0, token } : null;
    }

    // 成绩页和解析页共用：既能读正在进行的这场模考，也能读历史记录
    function examResultSource() {
      if (currentExamHistoryView()) {
        return { history: true, title: `${formatExamDate(examHistoryView.record.completedAt)} 的模考记录`, modules: examHistoryView.modules, grading: examHistoryView.grading };
      }
      const variant = examVariantById(examSession.variantId);
      return {
        history: false, title: fixedBranchLabel(variant),
        modules: variant.moduleKeys.map(moduleKey => {
          const spec = EXAM_CONFIG.modules[moduleKey], moduleState = examSession.modules[moduleKey];
          return { label: spec.label, questionIds: spec.questionIds, answers: moduleState.answers, startedAt: moduleState.startedAt, submittedAt: moduleState.submittedAt, durationSeconds: spec.durationSeconds, submitReason: moduleState.submitReason };
        })
      };
    }

    function formatExamDate(value) {
      const date = new Date(Number(value) || 0);
      if (!Number(value) || Number.isNaN(date.getTime())) return "未知时间";
      const pad = number => String(number).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function exitToExamCenter() {
      location.assign("../index.html#exam");
    }

    function exitExamMode() {
      const url = new URL(location.href);
      url.searchParams.delete("mode");
      location.assign(url.toString());
    }

    function resetExamSession() {
      if (!confirm("重新开始会清除本次模考的答案和计时，是否继续？")) return;
      clearExamTimer();
      try { learningStorage.removeItem(EXAM_STORAGE_KEY); } catch (error) { console.warn("[sat exam] session could not be cleared", error); }
      examSession = null;
      renderExam();
    }

    function setExamChrome(active) {
      document.body.classList.toggle("exam-active", active);
      els.examShell.classList.toggle("visible", active);
      els.practiceLayout.hidden = active;
      els.practiceNav.hidden = active;
      els.overviewPanel.classList.remove("visible");
      if (active) els.overviewPanel.hidden = true;
      else els.overviewPanel.hidden = false;
      els.progressText.hidden = active;
      els.overviewBtn.hidden = active;
      els.checkAllBtn.hidden = active || redoMode;
      els.exportJsonBtn.closest(".export-group").hidden = active || redoMode;
      document.querySelector(".export-label").hidden = active || redoMode;
      els.resetBtn.hidden = active;
      els.syncStatus.hidden = active;
      els.examModeBtn.hidden = active || !EXAM_CONFIG || redoMode;
      els.vocabularyBtn.hidden = active || !FEATURES.wordExplanations;
      if (active) { closeGloss(); els.glossPanel.hidden = true; }
      if (!active) els.modeBanner.classList.remove("visible");
    }

        <div class="exam-card">

          <p>确认当前登录的账号之后，才会显示这个账号自己的模考记录。</p>

    function renderExamHistoryMissing() {

      els.examShell.innerHTML = `
        <div class="exam-card">
          <p class="exam-kicker">模考记录</p>
          ${examShellHeading("找不到这条模考记录")}
          <p>记录只保存在做这场模考的设备和账号里，也可能已经被清除。</p>
          <div class="exam-card-actions"><button class="primary" id="examHistoryMissingExit" type="button">返回模考中心</button></div>

    function renderExamStart() {
      applyChartLayout(null);
      const branchSummary = EXAM_CONFIG.variants.map(variant => variant.label).join(" / ");
      const variants = EXAM_CONFIG.variants.map(variant => {
        const first = EXAM_CONFIG.modules[variant.moduleKeys[0]];
        const second = EXAM_CONFIG.modules[variant.moduleKeys[1]];

          <button class="exam-variant" type="button" data-exam-start="${escapeHtml(variant.id)}">
            <span><strong>${escapeHtml(variant.label)}</strong><span>${first.questionIds.length} + ${second.questionIds.length} 题 · ${escapeHtml(formatExamDuration(first.durationSeconds))} + ${escapeHtml(formatExamDuration(second.durationSeconds))}</span></span>
            <strong>开始模考</strong>
          </button>`;
      }).join("");
      els.examShell.dataset.view = "card";
      els.examShell.innerHTML = `
        <div class="exam-card">
          <p class="exam-kicker">全真模考</p>
          ${examShellHeading(document.title)}

            <li>每次完成的模考都会存入模考记录，之后可以随时回看。</li>
          </ol>

          <div class="exam-card-actions"><button id="examStartExit" type="button">返回普通练习</button><a class="exam-link" href="../index.html#exam">模考中心</a></div>

    function renderExamStimulus(question) {
      const stimulusParts = [];
      if (question.passage) stimulusParts.push(question.passage);
      if (question.math_metadata && question.math_metadata.diagram_reference) stimulusParts.push("Diagram reference: " + question.math_metadata.diagram_reference);
      let html = renderChartImage(question) + renderVisualAssets(question) + renderStimulus(stimulusParts.join("\n\n"));
      html = html.replace(/\[vocab\]/g, '<span class="vocab">').replace(/\[\/vocab\]/g, "</span>");
      return html.trim() ? html : '<div class="empty-stimulus">No separate passage, diagram, or stimulus for this question.</div>';
    }

    function renderExamOverview(active, moduleState) {
      return active.spec.questionIds.map((questionId, index) => {
        const classes = ["qnav"], answered = Boolean(moduleState.answers[questionId]), marked = moduleState.marked.includes(questionId);
        if (index === moduleState.current) classes.push("current");
        if (answered) classes.push("answered");
        if (marked) classes.push("marked");
        return `<button type="button" class="${classes.join(" ")}" data-exam-index="${index}" aria-label="第 ${index + 1} 题${answered ? "，已作答" : "，未作答"}${marked ? "，已标记待查" : ""}">${index + 1}</button>`;
      }).join("");
    }

    function examHeaderHtml(active) {
      return `
        <header class="exam-header">
          <div class="exam-header-main"><strong>${escapeHtml(active.spec.label)}</strong><span>${escapeHtml(document.title)} · ${escapeHtml(fixedBranchLabel(active.variant))}</span></div>
          <div class="exam-clock${examTimerConcealed ? " concealed" : ""}" id="examClock">
            <div class="exam-timer" id="examTimer" role="timer" aria-live="off">--:--</div>
            <button id="examTimerToggle" type="button">${examTimerConcealed ? "显示计时" : "隐藏计时"}</button>
          </div>
          <div class="exam-header-actions"><button id="examQuit" type="button">保存并退出</button></div>
        </header>`;
    }

    function bindExamHeader() {
      document.getElementById("examTimerToggle").addEventListener("click", event => {
        examTimerConcealed = !examTimerConcealed;
        document.getElementById("examClock").classList.toggle("concealed", examTimerConcealed);
        event.currentTarget.textContent = examTimerConcealed ? "显示计时" : "隐藏计时";
      });
      document.getElementById("examQuit").addEventListener("click", exitExamMode);
    }

    function bindExamOverview(moduleState) {
      els.examShell.querySelectorAll("[data-exam-index]").forEach(button => {
        button.addEventListener("click", () => {
          moduleState.current = Number(button.dataset.examIndex);
          examCheckOpen = false;
          examNavigatorOpen = false;
          saveExamSession();
          renderExam();
        });
      });
    }

    function updateExamTimer(active) {
      const timer = document.getElementById("examTimer");
      if (!timer || active.state.submittedAt) return;
      const remainingMs = active.state.deadlineAt - Date.now();
      if (remainingMs <= 0) {
        submitExamModule("timeout");
        return;
      }
      const remainingSeconds = Math.ceil(remainingMs / 1000);
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timer.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      timer.classList.toggle("urgent", remainingSeconds <= 300);
      timer.setAttribute("aria-label", `剩余 ${minutes} 分 ${seconds} 秒`);
    }

    function startExamTimer(active) {
      clearExamTimer();
      updateExamTimer(active);
      if (!active.state.submittedAt && active.state.deadlineAt > Date.now()) {
        examTimer = window.setInterval(() => updateExamTimer(active), 250);
      }
    }

    function renderExamModule(active) {
      const moduleState = active.state;
      if (moduleState.deadlineAt <= Date.now()) {
        submitExamModule("timeout");
        return;
      }
      if (examCheckOpen) {
        renderExamCheck(active);
        return;
      }
      const total = active.spec.questionIds.length, isLast = moduleState.current === total - 1;
      const questionId = active.spec.questionIds[moduleState.current];
      const question = examQuestionById(questionId);
      const selected = moduleState.answers[questionId] || "";
      const marked = moduleState.marked.includes(questionId);
      applyChartLayout(question);
      const choices = (question.choices || []).map(choice => `
        <button type="button" class="choice${selected === String(choice.label) ? " selected" : ""}" data-exam-choice="${escapeHtml(choice.label)}" aria-pressed="${selected === String(choice.label)}">
          <span class="label">${escapeHtml(choice.label)}</span><span class="choice-text">${formatStimulusInline(choice.text || "")}</span>
        </button>`).join("");
      els.examShell.dataset.view = "stage";
      els.examShell.innerHTML = `
        ${examHeaderHtml(active)}
        <main class="layout exam-layout">
          <section class="pane stimulus-pane"><div class="stimulus">${renderExamStimulus(question)}</div></section>
          <section class="pane question-pane">
            <div class="question-meta">
              <h2 class="question-number" id="examHeading" tabindex="-1"><span class="exam-visually-hidden">${escapeHtml(active.spec.label)} 第 </span>${moduleState.current + 1}<span class="exam-visually-hidden"> 题，共 ${total} 题</span></h2>
              <button id="examMark" type="button" aria-pressed="${marked}">${marked ? "★ 已标记待查" : "☆ 标记待查"}</button>
            </div>
            <p class="prompt">${formatStimulusInline(question.prompt || "")}</p>
            <div class="choices">${choices}</div>
          </section>
        </main>
        <aside class="exam-navigator" id="examNavigator" aria-label="本模块题目导航"${examNavigatorOpen ? "" : " hidden"}>
          <h3>${escapeHtml(active.spec.label)}</h3>
          <div class="overview-legend" aria-hidden="true"><span class="legend-current">当前</span><span class="legend-selected">已作答</span><span class="legend-unanswered">未作答</span><span class="legend-star">标记待查</span></div>
          <div class="exam-overview">${renderExamOverview(active, moduleState)}</div>
          <div class="exam-navigator-foot"><button id="examOpenCheck" type="button">前往检查页</button></div>
        </aside>
        <footer class="exam-footer">
          <span class="exam-footer-title">${escapeHtml(document.title)}</span>
          <button class="exam-nav-toggle" id="examNavToggle" type="button" aria-controls="examNavigator" aria-expanded="${examNavigatorOpen}">第 ${moduleState.current + 1}/${total} 题</button>
          <div class="nav-buttons">
            <button id="examPrev" type="button"${moduleState.current === 0 ? " disabled" : ""}>上一题</button>
            <button id="examNext" type="button">${isLast ? "检查作答" : "下一题"}</button>
          </div>
        </footer>`;
      els.examShell.querySelectorAll("[data-exam-choice]").forEach(button => {
        button.addEventListener("click", () => {
          moduleState.answers[questionId] = button.dataset.examChoice;
          saveExamSession();
          els.examShell.querySelectorAll("[data-exam-choice]").forEach(item => {
            const isSelected = item === button;
            item.classList.toggle("selected", isSelected);
            item.setAttribute("aria-pressed", String(isSelected));
          });
          const nav = els.examShell.querySelector(`[data-exam-index="${moduleState.current}"]`);
          if (nav) {
            nav.classList.add("answered");
            nav.setAttribute("aria-label", `第 ${moduleState.current + 1} 题，已作答`);
          }
        });
      });
      document.getElementById("examMark").addEventListener("click", () => {
        moduleState.marked = moduleState.marked.includes(questionId) ? moduleState.marked.filter(item => item !== questionId) : [...moduleState.marked, questionId];
        saveExamSession();
        renderExam();
      });
      document.getElementById("examNavToggle").addEventListener("click", () => {
        examNavigatorOpen = !examNavigatorOpen;
        document.getElementById("examNavigator").hidden = !examNavigatorOpen;
        document.getElementById("examNavToggle").setAttribute("aria-expanded", String(examNavigatorOpen));
      });
      document.getElementById("examOpenCheck").addEventListener("click", () => {
        examCheckOpen = true;
        examNavigatorOpen = false;
        renderExam();
      });
      document.getElementById("examPrev").addEventListener("click", () => {
        moduleState.current = Math.max(0, moduleState.current - 1);
        examNavigatorOpen = false;
        saveExamSession();
        renderExam();
      });
      document.getElementById("examNext").addEventListener("click", () => {
        examNavigatorOpen = false;
        if (isLast) examCheckOpen = true;
        else moduleState.current = Math.min(total - 1, moduleState.current + 1);
        saveExamSession();
        renderExam();
      });
      bindExamOverview(moduleState);
      bindExamHeader();
      startExamTimer(active);
      focusExamHeading();
    }

    // 模块最后的检查页：看清哪些题没做、哪些标记了，再决定提交
    function renderExamCheck(active) {
      const moduleState = active.state, total = active.spec.questionIds.length;
      const answered = Object.keys(moduleState.answers).length;
      applyChartLayout(null);
      els.examShell.dataset.view = "stage";
      els.examShell.innerHTML = `
        ${examHeaderHtml(active)}
        <main class="exam-check">
          <div class="exam-card">
            <p class="exam-kicker">${escapeHtml(active.spec.label)}</p>
            ${examShellHeading("检查作答", 2)}
            <p>已作答 ${answered} 题，未作答 ${total - answered} 题，标记待查 ${moduleState.marked.length} 题。点题号可以回到那一题；提交后不能再返回本模块。</p>
            <div class="overview-legend" aria-hidden="true"><span class="legend-selected">已作答</span><span class="legend-unanswered">未作答</span><span class="legend-star">标记待查</span></div>
            <div class="exam-overview">${renderExamOverview(active, { ...moduleState, current: -1 })}</div>
          </div>
        </main>
        <footer class="exam-footer">
          <span class="exam-footer-title">${escapeHtml(document.title)}</span>
          <span></span>
          <div class="nav-buttons">
            <button id="examCheckBack" type="button">返回题目</button>
            <button id="examSubmitModule" type="button">提交本模块</button>
          </div>
        </footer>`;
      document.getElementById("examCheckBack").addEventListener("click", () => {
        examCheckOpen = false;
        renderExam();
      });
      document.getElementById("examSubmitModule").addEventListener("click", () => submitExamModule("manual"));
      bindExamOverview(moduleState);
      bindExamHeader();
      startExamTimer(active);
      focusExamHeading();
    }

    function renderExamModuleTransition(active) {
      applyChartLayout(null);
      const answered = Object.keys(active.state.answers).length;
      const unanswered = active.spec.questionIds.length - answered;
      els.examShell.dataset.view = "card";
      els.examShell.innerHTML = `
        <div class="exam-card">
          <p class="exam-kicker">模块间休息</p>
          ${examShellHeading(`${active.spec.label} 已提交`)}
          <p class="exam-note">现在不显示对错、答案或解析，两个模块都完成后再统一查看。休息时间不计时。</p>
          <div class="exam-summary-grid">
            <div class="exam-stat"><strong>${answered}</strong><span>已作答</span></div>
            <div class="exam-stat"><strong>${unanswered}</strong><span>未作答</span></div>
          </div>
          ${active.state.submitReason === "timeout" ? "<p><strong>本模块因计时结束已自动提交。</strong></p>" : ""}
          <div class="exam-card-actions"><button class="primary" id="examStartM2" type="button">开始 Module 2</button><button id="examTransitionExit" type="button">保存并退出</button></div>
        </div>`;
      document.getElementById("examStartM2").addEventListener("click", startExamSecondModule);
      document.getElementById("examTransitionExit").addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    // 模块内题号从 1 开始；错题和未作答分开列出，点题号可以直接看这道题的答案
    function examWrongNumbers(module) {
      const wrong = [], blank = [];
      module.questionIds.forEach((questionId, index) => {
        const selected = module.answers[questionId] || "";
        if (!selected) blank.push(index);
        else if (selected !== examQuestionById(questionId).correct_answer) wrong.push(index);
      });
      return { wrong, blank };
    }

    function examStatsHtml(module, offset) {
      const score = scoreExamAnswers(module.questionIds, module.answers);
      const used = module.startedAt && module.submittedAt ? Math.max(0, Math.round((module.submittedAt - module.startedAt) / 1000)) : null;
      const { wrong, blank } = examWrongNumbers(module);
      const numbers = (list, kind) => list.map(index =>
        `<button class="exam-number ${kind}" type="button" data-exam-review-index="${offset + index}" aria-label="${escapeHtml(module.label)} 第 ${index + 1} 题，查看答案">${index + 1}</button>`).join("");
      return `
        <article class="exam-summary-card">
          <h3>${escapeHtml(module.label)}</h3>
          <p>正确率 ${score.accuracy}% · ${score.correct} / ${score.total}${used === null ? "" : ` · 用时 ${escapeHtml(formatExamDuration(used))}`}${module.submitReason === "timeout" ? " · 计时结束自动提交" : ""}</p>
          <div class="exam-wrong">
            <span class="exam-wrong-label">错题题号</span>
            ${wrong.length ? `<div class="exam-numbers">${numbers(wrong, "wrong")}</div>` : '<p class="exam-wrong-none">没有错题</p>'}
            ${blank.length ? `<span class="exam-wrong-label">未作答</span><div class="exam-numbers">${numbers(blank, "blank")}</div>` : ""}
          </div>
        </article>`;
    }

    function renderExamComplete() {
      applyChartLayout(null);
      if (!examHistoryView) archiveExamSession();
      const source = examResultSource();
      const totals = source.modules.map(module => scoreExamAnswers(module.questionIds, module.answers))
        .reduce((sum, score) => ({ correct: sum.correct + score.correct, total: sum.total + score.total }), { correct: 0, total: 0 });
      const offsets = source.modules.map((module, index) => source.modules.slice(0, index).reduce((sum, item) => sum + item.questionIds.length, 0));
      const percent = score => score.total ? Math.round(score.correct / score.total * 1000) / 10 : 0;
      // 回看记录：大字是完成时成绩（和模考中心卡片同一口径），下面另列按当前题库重算的结果
      const archived = source.history && source.grading ? source.grading.archived : null;
      const headline = archived || totals;
      const scoreLabel = source.history ? (archived ? "完成时成绩" : "按当前题库重算") : "正确率";
      let gradingNote = "";
      if (source.history && source.grading) {
        const { retired, changed } = source.grading, notes = [];
        if (changed === null) notes.push("这条记录早于题目版本标记，无法判断之后答案或解析是否改过");
        else if (changed) notes.push(`其中 ${changed} 题的答案或解析在完成后有更新`);
        if (retired) notes.push(`${retired} 题已不在当前题库，没有计入重算`);
        const same = archived && archived.correct === totals.correct && archived.total === totals.total && !changed && !retired;
        gradingNote = archived
          ? `<p class="exam-note" id="examRescore">按当前题库重算：${totals.correct} / ${totals.total}（${percent(totals)}%）${same ? "，与完成时相同" : ""}${notes.length ? "。" + notes.join("；") : ""}。下面的分模块结果和错题题号按当前题库。</p>`
          : `<p class="exam-note" id="examRescore">这条记录没有完整的完成时成绩，以上按当前题库重算${notes.length ? "。" + notes.join("；") : ""}。</p>`;
      }
      els.examShell.dataset.view = "card";
      els.examShell.innerHTML = `
        <div class="exam-card">
          <p class="exam-kicker">${source.history ? "模考记录" : "模考完成"}</p>
          ${examShellHeading(document.title)}
          <p>${escapeHtml(source.title)}</p>
          <div class="exam-score" id="examScore"><strong>${percent(headline)}%</strong><span>${scoreLabel} · ${headline.correct} / ${headline.total} 题答对</span></div>
          ${gradingNote}
          <p class="exam-note">以下是原始正确率和错题题号，<strong>不是 SAT 换算分</strong>，也不代表自适应路由结果。</p>
          <div class="exam-summary-grid">${source.modules.map((module, index) => examStatsHtml(module, offsets[index])).join("")}</div>
          <div class="exam-card-actions">
            <button class="primary" id="examEnterReview" type="button">查看答案与解析</button>
            ${source.history
              ? '<button id="examHistoryExit" type="button">返回模考中心</button>'
              : '<button id="examCompleteReset" type="button">重新开始模考</button><button id="examCompleteExit" type="button">返回普通练习</button><a class="exam-link" href="../index.html#exam">模考中心</a>'}
          </div>
        </div>`;
      const enterReview = index => {
        if (examHistoryView) {
          examHistoryView.phase = "review";
          examHistoryView.index = index;
        } else {
          examSession.phase = "review";
          examSession.reviewEnteredAt = Date.now();
          examSession.reviewIndex = index;
          saveExamSession();
        }
        renderExam();
      };
      document.getElementById("examEnterReview").addEventListener("click", () => enterReview(0));
      els.examShell.querySelectorAll("[data-exam-review-index]").forEach(button =>
        button.addEventListener("click", () => enterReview(Number(button.dataset.examReviewIndex))));
      document.getElementById("examHistoryExit")?.addEventListener("click", exitToExamCenter);
      document.getElementById("examCompleteReset")?.addEventListener("click", resetExamSession);
      document.getElementById("examCompleteExit")?.addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    function examExplanationHtml(question, selected) {
      return `
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);background:var(--sat-bg-subtle);">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);">正确答案</span><strong style="color:var(--sat-correct-text);">${escapeHtml(question.correct_answer || "")}</strong></div>
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);">你的答案</span><strong>${escapeHtml(selected || "未作答")}</strong></div>
          </div>
        </div>
        ${explanationBodyHtml(question, { withEvidenceFirst: false })}`;
    }

    function reviewQuestionList(modules) {
      return modules.flatMap((module, moduleIndex) => module.questionIds.map((questionId, index) => ({ module, moduleIndex, index, questionId })));
    }

    function renderExamReview() {
      const source = examResultSource();
      const reviewQuestions = reviewQuestionList(source.modules);
      const holder = examHistoryView || examSession, indexKey = examHistoryView ? "index" : "reviewIndex";
      holder[indexKey] = Math.min(Math.max(holder[indexKey], 0), reviewQuestions.length - 1);
      const position = holder[indexKey], item = reviewQuestions[position];
      const question = examQuestionById(item.questionId);
      const selected = item.module.answers[item.questionId] || "";
      const outcome = !selected ? "blank" : selected === String(question.correct_answer) ? "correct" : "incorrect";
      applyChartLayout(question);
      const choices = (question.choices || []).map(choice => {
        const label = String(choice.label);
        const classes = ["choice"];
        if (label === selected) classes.push("selected");
        if (label === String(question.correct_answer)) classes.push("correct");
        else if (label === selected) classes.push("incorrect");
        return `<div class="${classes.join(" ")}" aria-label="${escapeHtml(label)}${label === String(question.correct_answer) ? "，正确答案" : label === selected ? "，你的错误答案" : ""}"><span class="label">${escapeHtml(label)}</span><span class="choice-text">${formatStimulusInline(choice.text || "")}</span></div>`;
      }).join("");
      const navigator = reviewQuestions.map((entry, index) => {
        const answer = entry.module.answers[entry.questionId] || "";
        const state = !answer ? "" : answer === String(examQuestionById(entry.questionId).correct_answer) ? " correct" : " incorrect";
        const first = entry.index === 0 ? `<h3 style="grid-column:1/-1;margin:${index ? "14px" : "0"} 0 2px;text-align:left;font-size:13px;color:var(--sat-text-muted)">${escapeHtml(entry.module.label)}</h3>` : "";
        return `${first}<button type="button" class="qnav${state}${index === position ? " current" : ""}" data-exam-review-index="${index}" aria-label="${escapeHtml(entry.module.label)} 第 ${entry.index + 1} 题，${!answer ? "未作答" : state === " correct" ? "答对" : "答错"}">${entry.index + 1}</button>`;
      }).join("");
      els.examShell.dataset.view = "stage";
      els.examShell.innerHTML = `
        <header class="exam-header">
          <div class="exam-header-main"><strong>答案与解析 · ${escapeHtml(item.module.label)}</strong><span>${escapeHtml(document.title)} · ${escapeHtml(source.title)}</span></div>
          <div></div>
          <div class="exam-header-actions"><button id="examReviewResults" type="button">返回成绩</button><button id="examReviewExit" type="button">${source.history ? "返回模考中心" : "退出到练习"}</button></div>
        </header>
        <main class="layout exam-layout">
          <section class="pane stimulus-pane"><div class="stimulus">${renderExamStimulus(question)}</div></section>
          <section class="pane question-pane">
            <div class="question-meta">
              <h2 class="question-number" id="examHeading" tabindex="-1"><span class="exam-visually-hidden">${escapeHtml(item.module.label)} 第 </span>${item.index + 1}<span class="exam-visually-hidden"> 题</span></h2>
            </div>
            <p class="prompt">${formatStimulusInline(question.prompt || "")}</p>
            <div class="choices exam-review-answer">${choices}</div>
            <p class="exam-review-result ${outcome}">${outcome === "correct" ? "回答正确" : outcome === "incorrect" ? "回答错误" : "未作答"}</p>
            <section class="explanation exam-review-explanation" aria-label="答案与解析">${examExplanationHtml(question, selected)}</section>
          </section>
        </main>
        <aside class="exam-navigator" id="examNavigator" aria-label="全部题目"${examNavigatorOpen ? "" : " hidden"}>
          <div class="overview-legend" aria-hidden="true"><span class="legend-current">当前</span><span class="legend-correct">答对</span><span class="legend-incorrect">答错</span><span class="legend-unanswered">未作答</span></div>
          <div class="exam-overview">${navigator}</div>
        </aside>
        <footer class="exam-footer">
          <span class="exam-footer-title">${escapeHtml(document.title)}</span>
          <button class="exam-nav-toggle" id="examNavToggle" type="button" aria-controls="examNavigator" aria-expanded="${examNavigatorOpen}">第 ${position + 1}/${reviewQuestions.length} 题</button>
          <div class="nav-buttons">
            <button id="examReviewPrev" type="button"${position === 0 ? " disabled" : ""}>上一题</button>
            <button id="examReviewNext" type="button"${position === reviewQuestions.length - 1 ? " disabled" : ""}>下一题</button>
          </div>
        </footer>`;
      const move = index => {
        holder[indexKey] = Math.min(reviewQuestions.length - 1, Math.max(0, index));
        examNavigatorOpen = false;
        if (!examHistoryView) saveExamSession();
        renderExam();
      };
      document.getElementById("examReviewPrev").addEventListener("click", () => move(position - 1));
      document.getElementById("examReviewNext").addEventListener("click", () => move(position + 1));
      els.examShell.querySelectorAll("[data-exam-review-index]").forEach(button => {
        button.addEventListener("click", () => move(Number(button.dataset.examReviewIndex)));
      });
      document.getElementById("examNavToggle").addEventListener("click", () => {
        examNavigatorOpen = !examNavigatorOpen;
        document.getElementById("examNavigator").hidden = !examNavigatorOpen;
        document.getElementById("examNavToggle").setAttribute("aria-expanded", String(examNavigatorOpen));
      });
      document.getElementById("examReviewResults").addEventListener("click", () => {
        examNavigatorOpen = false;
        if (examHistoryView) examHistoryView.phase = "result";
        else { examSession.phase = "complete"; saveExamSession(); }
        renderExam();
      });
      document.getElementById("examReviewExit").addEventListener("click", source.history ? exitToExamCenter : exitExamMode);
      focusExamHeading();
    }

    function renderExam() {
      clearExamTimer();
      setExamChrome(true);
      els.modeBanner.classList.remove("visible");
      if (requestedExamHistoryId && !FEATURES.fixedMockExams) {
        renderExamClosed();
        syncExamPersistenceNotice();
        return;
      }
      if (requestedExamHistoryId) {
        // 回看历史记录只需要题目本身，不要求这套题现在仍可模考；账号未确认时不读任何记录
        if (!currentExamHistoryView() && learningStorage.ready()) examHistoryView = loadExamHistoryView(requestedExamHistoryId);
        if (!learningStorage.ready()) renderExamHistoryPending();
        else if (!examHistoryView) renderExamHistoryMissing();
        else if (examHistoryView.phase === "review") renderExamReview();
        else renderExamComplete();
        syncExamPersistenceNotice();
        return;
      }
      if (!FEATURES.fixedMockExams) {
        renderExamClosed();
      } else if (!EXAM_CONFIG) {
        renderExamUnavailable();
      } else if (!examSession) {
        renderExamStart();
      } else {
        examSession = normalizeExamSession(examSession);
        if (!examSession) {
          renderExamStart();
        } else {
          const active = activeExamModule();
          if (active && active.state.submittedAt && active.moduleIndex === 0) {
            renderExamModuleTransition(active);
          } else if (active) {
            renderExamModule(active);
          } else if (examSession.phase === "complete") {
            renderExamComplete();
          } else {
            renderExamReview();
          }
        }
      }
      syncExamPersistenceNotice();
    }

    function normalizeQuestionState(raw, question = null) {
      const value = asRecord(raw);
      const submitted = Boolean(value.submitted || value.checked);
      const selected = typeof value.selected === "string" ? value.selected : "";
      const revealIsCurrent = Boolean(submitted && value.revealed && timeOf(value.revealedAt)
        && timeOf(value.revealedAt) >= timeOf(value.submittedAt));
      // Stored correctness can become stale after a reviewed answer correction.
      // Preserve the student's selection, notes and attempt history, but grade
      // the current item against its current answer whenever it is available.
      const correct = question && submitted
        ? selected === question.correct_answer
        : submitted && Boolean(value.correct);
      const lostMastery = Boolean(question && submitted && value.correct && !correct);
      return {
        ...defaultQuestionState(), ...value,
        selected,
        checked: Boolean(value.checked || value.submitted),
        submitted,
        correct, starred: Boolean(value.starred),
        revealed: revealIsCurrent,
        revealedAt: revealIsCurrent ? value.revealedAt : null,
        gradingRevision: question?.gradingRevision || value.gradingRevision || "",
        errorTags: uniqueStrings(value.errorTags), highlights: uniqueStrings(value.highlights),
        attemptCount: Math.max(0, Number(value.attemptCount || 0)),
        redoCount: Math.max(0, Number(value.redoCount || 0)),
        reviewStage: lostMastery ? 0 : Math.max(0, Number(value.reviewStage || 0)),
        mastered: lostMastery ? false : Boolean(value.mastered),
        masteredAt: lostMastery ? null : value.masteredAt || null,
        nextDueAt: lostMastery ? nowIso() : value.nextDueAt || null
      };
    }

    function canonicalQuestionId(questionId, pageId = PAGE_ID) {
      // Cloud IDs are canonical. Only loadState's exact storageKey migration
      // may interpret legacy aliases; applying them here can shift an ID twice.
      return String(questionId || "");
    }

    function mergeQuestionState(leftRaw, rightRaw) {
      const left = normalizeQuestionState(leftRaw);
      const right = normalizeQuestionState(rightRaw);
      const latest = timeOf(right.updatedAt) > timeOf(left.updatedAt)
        || (rightRaw && timeOf(right.updatedAt) === timeOf(left.updatedAt)) ? right : left;
      const sameOutcome = left.selected === right.selected && left.submitted === right.submitted && left.submittedAt === right.submittedAt;
      const gradeEvidence = sameOutcome ? (left.gradingRevision ? left : right.gradingRevision ? right : null) : null;
      return normalizeQuestionState({
        ...latest,
        ...(gradeEvidence && !latest.gradingRevision ? { gradingRevision: gradeEvidence.gradingRevision, correct: gradeEvidence.correct } : {}),
        revealed: Boolean(latest.submitted && latest.revealed),
        revealedAt: latest.submitted && latest.revealed ? latest.revealedAt || null : null,
        firstWrongAt: timeOf(left.firstWrongAt) && timeOf(right.firstWrongAt)
          ? (timeOf(left.firstWrongAt) <= timeOf(right.firstWrongAt) ? left.firstWrongAt : right.firstWrongAt)
          : left.firstWrongAt || right.firstWrongAt,
        attemptCount: Math.max(left.attemptCount, right.attemptCount),
        redoCount: Math.max(left.redoCount, right.redoCount)
      });
    }
