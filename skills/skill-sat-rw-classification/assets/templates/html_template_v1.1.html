        els.feedback.textContent = "本次会话不存在或不属于当前账号。";
        els.checkCurrentBtn.disabled = true;
        els.revealBtn.disabled = true;
        return;
      }
      if (!QUESTIONS.length) {
        applyChartLayout(null);
        els.progressText.textContent = "No questions available";
        els.stimulus.innerHTML = '<div class="empty-stimulus">No usable questions were included in this section.</div>';
        els.questionNumber.textContent = "";
        els.prompt.textContent = "";
        els.choices.innerHTML = "";
        return;
      }

      const question = currentQuestion();
      applyChartLayout(question);
      const qs = activeState(question);
      const session = loadTodaySession();
      const sessionIndex = session ? session.questions.findIndex(item => item.questionId === question.question_id) : -1;
      els.progressText.textContent = sessionIndex >= 0
        ? `今日练习 ${sessionIndex + 1}/${session.questions.length}`
        : `第 ${current + 1}/${QUESTIONS.length} 题`;
      els.questionNumber.textContent = `Question ${question.question_number ?? current + 1}`;
      els.starBtn.textContent = qs.starred ? "★ 已加入复习" : "☆ 加入复习";
      els.starBtn.hidden = redoMode;
      els.reflectionPanel.hidden = redoMode;
      els.highlightBtn.hidden = redoMode;
      els.overviewBtn.hidden = redoMode;
      els.checkAllBtn.hidden = redoMode;
      els.exportJsonBtn.closest(".export-group").hidden = redoMode;
      els.returnOriginalBtn.hidden = !redoMode || Boolean(practiceSession);
      els.modeBanner.classList.toggle("visible", redoMode || invalidRedoQuestionId || sessionIndex >= 0);
      els.modeBanner.textContent = practiceSession
        ? `今日空白练习 · ${sessionIndex + 1}/${session.questions.length} · 作答自动保存在本次会话`
        : invalidRedoQuestionId
        ? `无法定位重做题目 ${requestedRedoQuestionId}，已保留当前页面。请返回学习中心重新进入。`
        : redoMode
        ? "空白重做：旧选择、正确答案、解析、笔记和标注均已隐藏。"
        : sessionIndex >= 0 ? `今日专项练习 · ${sessionIndex + 1}/${session.questions.length}` : "";
      els.prompt.innerHTML = formatStimulusInline(question.prompt || "");

      const stimulusParts = [];
      if (question.passage) stimulusParts.push(question.passage);
      if (question.math_metadata && question.math_metadata.diagram_reference) {
        stimulusParts.push("Diagram reference: " + question.math_metadata.diagram_reference);
      }
      let stimulusHtml = renderChartImage(question) + renderVisualAssets(question) + renderStimulus(stimulusParts.join("\n\n"));
            // Convert [vocab] markers to highlighted spans
      stimulusHtml = stimulusHtml.replace(/\[vocab\]/g, '<span class="vocab">').replace(/\[\/vocab\]/g, '</span>');
      els.stimulus.innerHTML = stimulusHtml;
      if (!stimulusHtml.trim()) {
        els.stimulus.innerHTML = '<div class="empty-stimulus">No separate passage, diagram, or stimulus for this question.</div>';
      }
      const visualRenderBlocked = Boolean(els.stimulus.querySelector("[data-visual-error]"));
      if (!redoMode) applyHighlights(qs.highlights || []);

      els.choices.innerHTML = "";
      (question.choices || []).forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice" + (qs.selected === choice.label ? " selected" : "");
        button.dataset.choiceLabel = choice.label;
        button.setAttribute("aria-pressed", String(qs.selected === choice.label));
        if (qs.submitted && qs.revealed) {
          if (choice.label === question.correct_answer) button.classList.add("correct");
          else if (qs.selected === choice.label) button.classList.add("incorrect");
        }
        button.disabled = qs.submitted || visualRenderBlocked;
        button.innerHTML = `<span class="label"></span><span class="choice-text"></span>`;
        button.querySelector(".label").textContent = choice.label;
        button.querySelector(".choice-text").innerHTML = formatStimulusInline(choice.text || "");
        button.addEventListener("click", () => {
          // Sync may have replaced the answer object since these buttons were drawn.
          if (currentQuestion() !== question || visualRenderBlocked) return;
          const live = activeState(question);
          if (live.submitted) { render(); return; }
          live.selected = choice.label;
          live.updatedAt = nowIso();
          updateChoiceSelection(live);
          saveState({ deferGlobal: true, touchCurrent: false });
        });
        els.choices.appendChild(button);
      });

      renderFeedback(qs);
      if (visualRenderBlocked) {
        els.feedback.className = "feedback incorrect";
        els.feedback.textContent = "本题视觉材料校验失败，已禁止提交。";
      }
      renderExplanation(question, qs);
      renderReflection(qs);
      if (els.overviewPanel.classList.contains("visible")) renderOverview();
      els.checkCurrentBtn.disabled = visualRenderBlocked || qs.submitted || !qs.selected;
      els.revealBtn.disabled = !qs.submitted;
      els.revealBtn.textContent = explanationOpen[question.question_id] ? "收起答案与解析" : "查看答案与解析";
      els.retryBtn.hidden = !qs.submitted;
      els.retryBtn.textContent = redoMode ? "重新空白作答" : "空白再答一次";
      els.returnOriginalBtn.hidden = !redoMode || Boolean(practiceSession);
      els.prevBtn.disabled = sessionIndex >= 0 ? sessionIndex === 0 : current === 0;
      els.nextBtn.disabled = sessionIndex >= 0 ? sessionIndex === session.questions.length - 1 : current === QUESTIONS.length - 1;
    }

    function updateChoiceSelection(qs) {
      els.choices.querySelectorAll(".choice").forEach(button => {
        const selected = button.dataset.choiceLabel === qs.selected;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
      renderFeedback(qs);
      els.checkCurrentBtn.disabled = qs.submitted || !qs.selected;
      updateCurrentOverviewButton(qs);
    }

    function updateCurrentOverviewButton(qs) {
      const overviewButton = els.overviewGrid.querySelector(`[data-question-index="${current}"]`);
      if (overviewButton) {
        overviewButton.classList.toggle("selected", Boolean(qs.selected) && !qs.checked);
        overviewButton.classList.toggle("correct", Boolean(qs.checked && qs.correct));
        overviewButton.classList.toggle("incorrect", Boolean(qs.checked && !qs.correct));
        overviewButton.innerHTML = `${currentQuestion().question_number ?? current + 1}${qs.starred ? '<span class="star">★</span>' : ""}`;
        overviewButton.setAttribute("aria-label", overviewLabel(currentQuestion(), qs, current));
      }
    }

    function updateCurrentQuestionView(question, qs) {
      els.choices.querySelectorAll(".choice").forEach(button => {
        const label = button.dataset.choiceLabel;
        button.disabled = qs.submitted;
        button.classList.toggle("selected", label === qs.selected);
        button.setAttribute("aria-pressed", String(label === qs.selected));
        button.classList.toggle("correct", Boolean(qs.submitted && qs.revealed && label === question.correct_answer));
        button.classList.toggle("incorrect", Boolean(qs.submitted && qs.revealed && label === qs.selected && label !== question.correct_answer));
      });
      renderFeedback(qs);
      renderExplanation(question, qs);
      renderReflection(qs);
      updateCurrentOverviewButton(qs);
      els.starBtn.textContent = qs.starred ? "★ 已加入复习" : "☆ 加入复习";
      els.checkCurrentBtn.disabled = qs.submitted || !qs.selected;
      els.revealBtn.disabled = !qs.submitted;
      els.revealBtn.textContent = explanationOpen[question.question_id] ? "收起答案与解析" : "查看答案与解析";
      els.retryBtn.hidden = !qs.submitted;
      els.retryBtn.textContent = redoMode ? "重新空白作答" : "空白再答一次";
      els.returnOriginalBtn.hidden = !redoMode || Boolean(practiceSession);
    }

    function renderFeedback(qs) {
      els.feedback.className = "feedback";
      if (!qs.submitted) {
        els.feedback.textContent = qs.selected ? "已选择答案，准备好后提交。" : "请选择答案，准备好后提交。";
        return;
      }
      if (qs.correct) {
        els.feedback.classList.add("correct");
        els.feedback.textContent = "回答正确";
      } else {
        els.feedback.classList.add("incorrect");
        els.feedback.textContent = "回答错误";
      }
    }

    function detailedExplanationHtml(explanation, displayedReason) {
      const normalize = value => String(value || "").trim().replace(/\s+/g, " ");
      const detailed = normalize(explanation.detailed);
      if (!detailed || [displayedReason, explanation.key_evidence].some(value => normalize(value) === detailed)) return "";
      return `<details class="explanation-detail"><summary>展开完整解析</summary><p>${formatStimulusInline(explanation.detailed)}</p></details>`;
    }

    function renderExplanation(question, qs) {
      const isOpen = Boolean(qs.submitted && qs.revealed && explanationOpen[question.question_id]);
      els.explanation.className = "explanation" + (isOpen ? " visible" : "");
      if (!isOpen) {
        els.explanation.innerHTML = "";
        return;
      }
      const explanation = question.explanation || {};
      const choiceAnalysis = explanation.choice_analysis || {};
      const rows = Object.keys(choiceAnalysis).sort().map(label => {
        return `<p><strong>${escapeHtml(label)}.</strong> ${formatStimulusInline(choiceAnalysis[label])}</p>`;
      }).join("");
      els.explanation.innerHTML = `
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);background:var(--sat-bg-subtle);border-radius:var(--sat-radius-panel) var(--sat-radius-panel) 0 0;">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);margin-bottom:2px;font-family:var(--sat-font-ui);">正确答案</span><strong style="font-family:var(--sat-font-ui);color:var(--sat-correct-text);">${escapeHtml(question.correct_answer || "")}</strong></div>
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);margin-bottom:2px;font-family:var(--sat-font-ui);">你的答案</span><strong style="font-family:var(--sat-font-ui);">${escapeHtml(qs.selected || "未作答")}</strong></div>
          </div>
        </div>
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--sat-text-main);font-family:var(--sat-font-ui);">关键证据</div>
          <p style="font-family:var(--sat-font-reading);font-size:var(--sat-font-size-body);line-height:var(--sat-line-height-reading);color:var(--sat-text-main);margin:0;">${formatStimulusInline(explanation.key_evidence || explanation.short || "")}</p>
        </div>
        ${explanation.key_evidence && explanation.why_correct ? `
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--sat-text-main);font-family:var(--sat-font-ui);">正确思路</div>
          <p style="font-family:var(--sat-font-reading);font-size:var(--sat-font-size-body);line-height:var(--sat-line-height-reading);color:var(--sat-text-main);margin:0;">${formatStimulusInline(explanation.why_correct || "")}</p>
        </div>` : `
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px;color:var(--sat-text-main);font-family:var(--sat-font-ui);">正确思路</div>
          <p style="font-family:var(--sat-font-reading);font-size:var(--sat-font-size-body);line-height:var(--sat-line-height-reading);color:var(--sat-text-main);margin:0;">${formatStimulusInline(explanation.detailed || explanation.short || "")}</p>
        </div>`}
        ${detailedExplanationHtml(explanation, explanation.key_evidence && explanation.why_correct ? explanation.why_correct : explanation.detailed || explanation.short || "")}
        <div style="padding:14px 16px;">
          <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--sat-text-main);font-family:var(--sat-font-ui);">选项分析</div>
          <div class="choice-analysis" style="font-family:var(--sat-font-reading);font-size:var(--sat-font-size-choice);line-height:var(--sat-line-height-choice);">${rows}</div>
        </div>
        ${(question.skills_tested && question.skills_tested.length) ? `<div style="padding:10px 16px;border-top:1px solid var(--sat-explanation-border);"><div style="font-size:12px;font-weight:700;color:var(--sat-text-muted);font-family:var(--sat-font-ui);">Skills: ${escapeHtml(question.skills_tested.join(", "))}</div></div>` : ""}
      `;
    }

    function overviewLabel(question, qs, index) {
      const status = qs.checked ? (qs.correct ? "已答对" : "已答错") : qs.selected ? "已选择未提交" : "未作答";
      return `第 ${question.question_number ?? index + 1} 题，${status}${qs.starred ? "，已加入复习" : ""}`;
    }

    function scrollPracticeToStart() {
      window.scrollTo(0, 0);
    }

    function renderOverview() {
      els.overviewGrid.innerHTML = "";
      if (redoMode) return;
      QUESTIONS.forEach((question, index) => {
        const qs = state.answers[question.question_id]
          ? normalizeQuestionState(state.answers[question.question_id], question)
          : defaultQuestionState();
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.questionIndex = String(index);
        button.className = "qnav";
        if (index === current) button.classList.add("current");
        if (qs.checked) button.classList.add(qs.correct ? "correct" : "incorrect");
        else if (qs.selected) button.classList.add("selected");
        button.setAttribute("aria-label", overviewLabel(question, qs, index));
        if (index === current) button.setAttribute("aria-current", "true");
        button.innerHTML = `${question.question_number ?? index + 1}${qs.starred ? '<span class="star">★</span>' : ""}`;
        button.addEventListener("click", () => {
          current = index;
          saveState({ markQuestion: false });
          render();
          els.overviewPanel.classList.remove("visible");
          scrollPracticeToStart();
        });
        els.overviewGrid.appendChild(button);
      });
    }

    function renderStimulus(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      return text
        .split(/\n{2,}/)
        .map(block => block.trim())
        .filter(Boolean)
        .map(renderStimulusBlock)
        .join("");
    }

    function normalizeTableDataForDisplay(value) {
      const table = asRecord(value);
      const owns = key => Object.prototype.hasOwnProperty.call(table, key);
      if ((owns("headers") && !Array.isArray(table.headers))
        || (owns("columns") && !Array.isArray(table.columns))
        || !Array.isArray(table.rows)) return null;
      const headers = Array.isArray(table.headers) ? table.headers : [];
      const columns = Array.isArray(table.columns) ? table.columns : [];
      const rows = Array.isArray(table.rows) ? table.rows : [];
      const scalar = cell => ["string", "number", "boolean"].includes(typeof cell)
        && (typeof cell !== "number" || Number.isFinite(cell));
      if (headers.length && columns.length && JSON.stringify(headers) !== JSON.stringify(columns)) return null;
      const selectedHeaders = headers.length ? headers : columns;
      if (!selectedHeaders.length || !rows.length || !selectedHeaders.every(scalar)) return null;
      if (!rows.every(row => Array.isArray(row) && row.length === selectedHeaders.length && row.every(scalar))) return null;
      if (table.title !== undefined && typeof table.title !== "string") return null;
      return { title: String(table.title || ""), headers: selectedHeaders, rows };
    }

    function renderTableData(value) {
      const table = normalizeTableDataForDisplay(value);
      if (!table) {
        console.error("[sat visual] malformed table_data rejected");
        return '<div class="visual-render-error" role="alert" data-visual-error="table">表格数据无法安全显示，本题已停止渲染该表格，请反馈给教师。</div>';
      }
      const head = "<thead><tr>" + table.headers.map(cell => "<th scope=\"col\">" + escapeHtml(String(cell)) + "</th>").join("") + "</tr></thead>";
      const body = "<tbody>" + table.rows.map(row => "<tr>" + row.map(cell => "<td>" + escapeHtml(String(cell)) + "</td>").join("") + "</tr>").join("") + "</tbody>";
      const caption = table.title ? "<caption>" + escapeHtml(table.title) + "</caption>" : "";
      return "<table class=\"data-table\">" + caption + head + body + "</table>";
    }

    function visualDimensionAttributes(asset) {
      const width = Number(asset && asset.width);
      const height = Number(asset && asset.height);
      return Number.isInteger(width) && width > 0 && Number.isInteger(height) && height > 0
        ? ` width="${width}" height="${height}"`
        : "";
    }

    function visualAltText(asset, fallback) {
      return String(asset && (asset.alt_text || asset.title) || fallback || "").trim().slice(0, 300);
    }

    function renderVisualAssets(question) {
      const assets = Array.isArray(question.visual_assets) ? question.visual_assets : [];
      if (!assets.length && !question.table_data && !question.chart_image_data_uri) return "";
      const parts = [];
      // Structured tables are the primary representation. Malformed shapes are
      // rejected visibly instead of silently dropping headers or truncating rows.
      if (question.table_data) parts.push(renderTableData(question.table_data));
      // Visual assets: chart/graph get compact crop; table gets optional collapsible reference
      for (const asset of assets) {
        let compactSrc = asset.image_data_uri || "";
        let fullSrc = asset.material_panel_crop_data_uri || asset.image_data_uri || "";
        let isTable = asset.type === "table";
        let isChart = asset.type === "graph" || asset.type === "chart";
        const dimensions = visualDimensionAttributes(asset);
        // Use compact crop for charts, full panel only as collapsible
        if (compactSrc) {
          parts.push("<div class=\"visual-asset-wrap\">");
          if (isChart) {
            // Chart: compact display with max-height, click to zoom
            const alt = visualAltText(asset, "题目图表");
            parts.push("<div class=\"chart-image-wrap\"><img class=\"chart-image visual-asset\" loading=\"lazy\" decoding=\"async\"" + dimensions + " src=\"" + escapeHtml(compactSrc) + "\" alt=\"" + escapeHtml(alt) + "\" aria-label=\"" + escapeHtml(alt + "，按回车键打开大图") + "\" role=\"button\" style=\"max-height:400px;max-width:100%;width:auto;object-fit:contain;cursor:pointer;\" onclick=\"openChartLightbox(this)\" tabindex=\"0\"></div>");
            // If full panel crop available, show as collapsible
            if (fullSrc && fullSrc !== compactSrc) {
              parts.push("<details style=\"margin-top:8px\"><summary style=\"cursor:pointer;font-size:13px;color:var(--sat-text-muted)\">Show full stimulus panel</summary>");
              parts.push("<img class=\"visual-asset\" loading=\"lazy\" decoding=\"async\" src=\"" + escapeHtml(fullSrc) + "\" alt=\"完整题目材料面板\" aria-label=\"完整题目材料面板，按回车键打开大图\" role=\"button\" style=\"max-height:600px;max-width:100%;width:auto;object-fit:contain;margin-top:8px\" onclick=\"openChartLightbox(this)\" tabindex=\"0\">");
              parts.push("</details>");
            }
          } else if (isTable) {
            // Table: show as collapsible reference crop (primary display is HTML table from table_data)
            parts.push("<details style=\"margin-top:8px\"><summary style=\"cursor:pointer;font-size:13px;color:var(--sat-text-muted)\">Show original table image</summary>");
            parts.push("<img class=\"visual-asset\" loading=\"lazy\" decoding=\"async\"" + dimensions + " src=\"" + escapeHtml(fullSrc) + "\" alt=\"原始表格图像\" aria-label=\"原始表格图像，按回车键打开大图\" role=\"button\" style=\"max-height:500px;max-width:100%;width:auto;object-fit:contain;margin-top:8px\" onclick=\"openChartLightbox(this)\" tabindex=\"0\">");
            parts.push("</details>");
          } else {
            // Figure or other: show normally with max-height
            const alt = visualAltText(asset, "题目视觉材料");
            parts.push("<img class=\"visual-asset\" loading=\"lazy\" decoding=\"async\"" + dimensions + " src=\"" + escapeHtml(compactSrc) + "\" alt=\"" + escapeHtml(alt) + "\" aria-label=\"" + escapeHtml(alt + "，按回车键打开大图") + "\" role=\"button\" style=\"max-height:400px;max-width:100%;width:auto;object-fit:contain;cursor:pointer;\" onclick=\"openChartLightbox(this)\" tabindex=\"0\">");
          }
          if (asset.title && !isTable) parts.push("<p class=\"asset-caption\" style=\"font-size:12px;color:var(--sat-text-muted);margin-top:4px\">" + escapeHtml(asset.title) + "</p>");
          parts.push("</div>");
        }
      }
      return parts.join("");
    }

    function renderChartImage(question) {
      if (!question.chart_image || !question.chart_image_data_uri) return "";
      const width = Number(question.chart_image_width || 0);
      const height = Number(question.chart_image_height || 0);
      const dimensions = width > 0 && height > 0 ? ` width="${width}" height="${height}"` : "";
      const alt = String(question.chart_alt_text || question.public_visual_alt_text || `SAT 第 ${question.question_number || ""} 题图表，具体数据见图中标签`).trim();
      return `<div class="chart-image-wrap"><img class="chart-image visual-asset" loading="lazy" decoding="async"${dimensions} src="${escapeHtml(question.chart_image_data_uri)}" alt="${escapeHtml(alt)}" aria-label="${escapeHtml(alt + "，按回车键打开大图")}" role="button" style="max-height:400px;max-width:100%;width:auto;object-fit:contain;cursor:pointer;" onclick="openChartLightbox(this)" tabindex="0"></div>`;
    }

    let chartLightboxReturnTarget = null;
    function openChartLightbox(image) {
      chartLightboxReturnTarget = image instanceof HTMLElement ? image : null;
      els.chartLightboxImage.src = image.src;
      els.chartLightboxImage.alt = image.alt || "题目图表大图";
      els.chartLightbox.classList.add("visible");
      els.chartLightbox.setAttribute("aria-hidden", "false");
      els.chartLightboxClose.focus();
    }

    function closeChartLightbox() {
      els.chartLightbox.classList.remove("visible");
      els.chartLightbox.setAttribute("aria-hidden", "true");
      els.chartLightboxImage.src = "";
      if (chartLightboxReturnTarget && document.contains(chartLightboxReturnTarget)) chartLightboxReturnTarget.focus();
      chartLightboxReturnTarget = null;
    }

    function renderStimulusBlock(block) {
      const lines = block.split(/\n/).map(line => line.trim()).filter(Boolean);
      if (!lines.length) return "";
      if (lines.length === 1 && /^Text [12]\b/.test(lines[0])) {
        return `<p class="text-heading"><strong>${escapeHtml(lines[0])}</strong></p>`;
      }
      if (lines.every(line => line.startsWith("• "))) {
        const items = lines
          .map(line => `<li>${formatStimulusInline(line.slice(2))}</li>`)
          .join("");
        return `<ul>${items}</ul>`;
      }
      if (lines.length > 1 && lines.every(line => line.includes("|"))) {
        return renderDataTable(lines);
      }
      return `<p>${lines.map(formatStimulusInline).join("<br>")}</p>`;
    }

    function renderDataTable(lines) {
      const rows = lines.map((line, rowIndex) => {
        const cells = line.split("|").map(cell => cell.trim());
        const tag = rowIndex === 0 ? "th" : "td";
        return `<tr>${cells.map(cell => `<${tag}>${formatStimulusInline(cell)}</${tag}>`).join("")}</tr>`;
      }).join("");
      return `<table class="data-table">${rows}</table>`;
    }

    function formatStimulusInline(value) {
      return escapeHtml(value)
        .replace(/_{4,}/g, match => `<span class="blank">${match}</span>`)
        .replace(/\[u\]([\s\S]*?)\[\/u\]/g, '<span class="underline">$1</span>')
        .replace(/\[i\]([\s\S]*?)\[\/i\]/g, '<em class="italic">$1</em>')
        .replace(/\[b\]([\s\S]*?)\[\/b\]/g, '<strong>$1</strong>');
    }

    function renderReflection(qs) {
      if (redoMode) return;
      document.querySelectorAll('input[name="confidence"]').forEach(input => {
        input.checked = input.value === qs.confidence;
        input.disabled = qs.submitted;
      });
      els.errorTagsRow.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.checked = (qs.errorTags || []).includes(input.value);
        input.disabled = !qs.submitted || qs.correct;
      });
      if (els.noteInput.value !== (qs.note || "")) els.noteInput.value = qs.note || "";
      els.reflectionHint.textContent = qs.submitted && !qs.correct
        ? "请选择主要错因；需要看答案时再点击“查看答案与解析”。"
        : "信心、笔记和正文标注会保存到统一复习中心。";
    }

    function applyHighlights(snippets) {
      const values = uniqueStrings(snippets).filter(value => value.length >= 2);
      if (!values.length) return;
      const walker = document.createTreeWalker(els.stimulus, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        if (node.parentElement?.closest("mark,button,summary")) continue;
        let html = escapeHtml(node.nodeValue || "");
        let changed = false;
        for (const snippet of values) {
          const escaped = escapeHtml(snippet);
          if (!escaped || !html.includes(escaped)) continue;
          html = html.replaceAll(escaped, `<mark class="highlight-mark">${escaped}</mark>`);
          changed = true;
        }
        if (!changed) continue;
        const span = document.createElement("span");
        span.innerHTML = html;
        node.replaceWith(...span.childNodes);
      }
    }

    function addSelectionHighlight() {
      if (redoMode) return;
      const selection = window.getSelection();
      const text = String(selection || "").trim().replace(/\s+/g, " ");
      if (!text || text.length < 2 || text.length > 500 || !els.stimulus.contains(selection.anchorNode)) {
        els.reflectionHint.textContent = "请先在左侧正文中选择一段不超过 500 字符的文本。";
        return;
      }
      const qs = qState(currentQuestion());
      qs.highlights = uniqueStrings([...(qs.highlights || []), text]);
      qs.updatedAt = nowIso();
      selection.removeAllRanges();
      saveState();
      render();
    }

    function addDays(iso, days) {
      const date = new Date(iso || Date.now());
      date.setDate(date.getDate() + days);
      return date.toISOString();
    }

    function updateReviewSchedule(qs, isRedo, attemptCorrect = qs.correct) {
      if (!isRedo) {
        if (!attemptCorrect || ["unsure", "guess"].includes(qs.confidence)) {
          qs.mastered = false;
          qs.masteredAt = null;
          qs.reviewStage = 0;
          qs.nextDueAt = addDays(nowIso(), 1);
        }
        return;
      }
      if (!attemptCorrect) {
        qs.mastered = false;
        qs.masteredAt = null;
        qs.reviewStage = 0;
        qs.nextDueAt = addDays(nowIso(), 1);
        return;
      }
      if (qs.nextDueAt && timeOf(qs.nextDueAt) > Date.now()) return;
      const nextStage = Math.min(3, Number(qs.reviewStage || 0) + 1);
      qs.reviewStage = nextStage;
      qs.mastered = nextStage >= 3;
      qs.masteredAt = qs.mastered ? nowIso() : null;
      qs.nextDueAt = qs.mastered ? null : addDays(nowIso(), [3, 7][nextStage - 1]);
    }

    function createAttempt(question, qs, mode) {
      const attempt = {
        attemptId: `sat-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        questionId: question.question_id,
        pageId: PAGE_ID,
        mode,
        selected: qs.selected,
        correct: qs.correct,
        confidence: qs.confidence || "",
        submittedAt: qs.submittedAt,
        revealed: false,
        revealedAt: null,
        skill: question.classification?.skill || "",
        subtype: question.classification?.subtype || "未细分",
        sourceSet: question._source_set || question.source_set || "",
        reviewStage: Number(qs.reviewStage || 0),
        nextDueAt: qs.nextDueAt || null,
        mastered: Boolean(qs.mastered),
        masteredAt: qs.masteredAt || null,
        contentVersion: "sat-learning-v2",
        gradingRevision: question.gradingRevision || ""
      };
      globalState.attempts = compactAttempts([
        ...(Array.isArray(globalState.attempts) ? globalState.attempts : []),
        attempt
      ]);
      return attempt;
    }

    function upsertAttemptOutboxBestEffort(attempt) {
      try {
        const outbox = loadAttemptOutbox();
        const pending = outbox.find(item => item.attemptId === attempt.attemptId);
        if (pending) Object.assign(pending, attempt);
        else outbox.push({ ...attempt });
        if (!writeLocalJson(OUTBOX_KEY, outbox)) {
          const volatilePending = volatileAttemptOutbox.find(item => item.attemptId === attempt.attemptId);
          if (volatilePending) Object.assign(volatilePending, attempt);
          else volatileAttemptOutbox.push({ ...attempt });
          setSyncStatus("作答结果已显示，保存将在稍后重试", "error");
          return false;
        }
        volatileAttemptOutbox = [];
        return true;
      } catch (error) {
        console.warn("[sat learning] attempt outbox persistence deferred", error);
        const volatilePending = volatileAttemptOutbox.find(item => item.attemptId === attempt.attemptId);
        if (volatilePending) Object.assign(volatilePending, attempt);
        else volatileAttemptOutbox.push({ ...attempt });
        setSyncStatus("作答结果已显示，保存将在稍后重试", "error");
        return false;
      }
    }

    function checkQuestion(question) {
      const qs = activeState(question);
      if (!qs.selected || qs.submitted) return false;
      const submittedAt = nowIso();
      qs.checked = true;
      qs.submitted = true;
      qs.revealed = false;
      qs.revealedAt = null;
      qs.gradingRevision = question.gradingRevision || "";
      qs.correct = qs.selected === question.correct_answer;
      qs.submittedAt = submittedAt;
      qs.lastAttemptAt = submittedAt;
      qs.updatedAt = submittedAt;
      qs.attemptCount = Number(qs.attemptCount || 0) + 1;
      if (!qs.correct && !qs.firstWrongAt) qs.firstWrongAt = submittedAt;
      if (redoMode) {
        const historical = normalizeQuestionState(globalState.questions[question.question_id], question);
        historical.lastRedoCorrect = qs.correct;
        historical.redoCount = Number(historical.redoCount || 0) + 1;
        historical.lastAttemptAt = submittedAt;
        historical.updatedAt = submittedAt;
        updateReviewSchedule(historical, true, qs.correct);
        globalState.questions[question.question_id] = historical;
        qs.reviewStage = historical.reviewStage;
        qs.nextDueAt = historical.nextDueAt;
        qs.mastered = historical.mastered;
      } else {
        updateReviewSchedule(qs, false);
        globalState.questions[question.question_id] = mergeQuestionState(globalState.questions[question.question_id], qs);
      }
      const attempt = createAttempt(question, qs, redoMode ? "blank_redo" : "practice");
      qs.lastAttemptId = attempt.attemptId;
      return attempt;
    }

    function reviewItems() {
      const items = [];
      QUESTIONS.forEach((question, index) => {
        const qs = state.answers[question.question_id]
          ? normalizeQuestionState(state.answers[question.question_id])
          : defaultQuestionState();
        const tags = [];
        if (qs.submitted && !qs.correct) tags.push("wrong");
        if (qs.starred) tags.push("starred");
        if (qs.note) tags.push("note");
        if (!tags.length) return;
        const explanation = question.explanation || {};
        const tableData = question.table_data ? normalizeTableDataForDisplay(question.table_data) : null;
        const visualAssets = (Array.isArray(question.visual_assets) ? question.visual_assets : []).map(asset => {
          const value = asRecord(asset);
          const copy = {
            type: ["graph", "chart", "table", "figure"].includes(value.type) ? value.type : "figure",
            alt_text: visualAltText(value, "题目视觉材料"),
            image_data_uri: typeof value.image_data_uri === "string" ? value.image_data_uri : "",
            width: Number.isInteger(Number(value.width)) && Number(value.width) > 0 ? Number(value.width) : null,
            height: Number.isInteger(Number(value.height)) && Number(value.height) > 0 ? Number(value.height) : null
          };
          if (typeof value.material_panel_crop_data_uri === "string" && value.material_panel_crop_data_uri) {
            copy.material_panel_crop_data_uri = value.material_panel_crop_data_uri;
          }
          return copy;
        }).filter(asset => asset.image_data_uri);
        items.push({
          question_id: question.question_id,
          question_number: question.question_number ?? index + 1,
          tags,
          student_answer: qs.selected || "",
          revealed: Boolean(qs.submitted && qs.revealed),
          correct_answer: qs.submitted && qs.revealed ? question.correct_answer || "" : "",
          passage: question.passage || "",
          prompt: question.prompt || "",
          choices: question.choices || [],
          ...(tableData ? { table_data: tableData } : {}),
          ...(question.chart_image && typeof question.chart_image_data_uri === "string" ? {
            chart_image: true,
            chart_image_data_uri: question.chart_image_data_uri,
            chart_image_width: Number(question.chart_image_width || 0),
            chart_image_height: Number(question.chart_image_height || 0),
            chart_alt_text: String(question.chart_alt_text || question.public_visual_alt_text || `SAT 第 ${question.question_number || index + 1} 题图表，具体数据见图中标签`)
          } : {}),
          ...(visualAssets.length ? { visual_assets: visualAssets } : {}),
          explanation: qs.submitted && qs.revealed ? explanation.detailed || explanation.short || "" : "",
          choice_analysis: qs.submitted && qs.revealed ? explanation.choice_analysis || {} : {},
          confidence: qs.confidence || "",
          error_tags: qs.errorTags || [],
          note: qs.note || "",
          skills_tested: question.skills_tested || [],
          difficulty_estimate: question.difficulty_estimate || ""
        });
      });
      return items;
    }

    function exportJson() {
      const payload = {
        export_type: "sat_practice_review_items",
        section: SECTION,
        title: SECTION_TITLE,
        generated_at: new Date().toISOString(),
        items: reviewItems()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      const safeTitle = SECTION_TITLE
        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_")
        .replace(/\s+/g, " ")
        .trim();
      link.download = `${safeTitle || SECTION}_review_items.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function renderPrintItem(item) {

      const tags = item.tags.map(tag => `<span class="tag ${tag}">${escapeHtml(tag)}</span>`).join("");

    function loadTodaySession() {
      if (!activeSessionId) return null;
      const session = loadJson(SESSION_KEY, null);
      return session && session.id === activeSessionId && Array.isArray(session.questions) ? session : null;
    }

    function restorePracticeSession() {
      practiceSession = loadTodaySession();
      if (!practiceSession) return;
      practiceSession.answers = asRecord(practiceSession.answers);
      const question = currentQuestion();
      if (!question || !practiceSession.questions.some(item => item.questionId === question.question_id)) return;
      redoMode = true;
      redoQuestionId = question.question_id;
      redoSession = normalizeQuestionState(practiceSession.answers[redoQuestionId], question);
      practiceSession.answers[redoQuestionId] = redoSession;
    }

    function navigateSession(direction) {
      const session = loadTodaySession();
      const question = currentQuestion();
      if (!session || !question) return false;
      const index = session.questions.findIndex(item => item.questionId === question.question_id);
      const next = session.questions[index + direction];
      if (!next) return true;
      location.href = `../${next.route}?session=${encodeURIComponent(session.id)}&focus=${encodeURIComponent(next.questionId)}`;
      return true;
    }

    function setSyncStatus(message, kind = "") {
      els.syncStatus.textContent = CLOUD_LOCAL_ONLY
        ? message + " · 云端题号待核验"
        : message;
      els.syncStatus.dataset.kind = kind;
    }

    function queueCloudSave() {
      if (CLOUD_LOCAL_ONLY || !cloudSession) return;
      if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(() => {
        cloudSaveTimer = null;
        void saveCloudState();
      }, 700);
    }

    function mergeRemotePage(remote) {
      if (CLOUD_LOCAL_ONLY) return;
      const value = asRecord(remote);
      if (timeOf(value.resetAt) > timeOf(state.resetAt)) {
        state.resetAt = value.resetAt;
        for (const [questionId, answer] of Object.entries(asRecord(state.answers))) {
          if (!locallyChangedQuestionIds.has(questionId) && timeOf(answer?.updatedAt) <= timeOf(state.resetAt)) {
            delete state.answers[questionId];
          }
        }
      }
      const remoteAnswers = {};
      for (const [legacyId, answer] of Object.entries(asRecord(value.answers))) {
        const questionId = canonicalQuestionId(legacyId);
        remoteAnswers[questionId] = mergeQuestionState(remoteAnswers[questionId], answer);
      }
      for (const question of QUESTIONS) {
        if (locallyChangedQuestionIds.has(question.question_id)) continue;
        const incoming = remoteAnswers[question.question_id];
        if (!incoming) continue;
        if (timeOf(incoming.updatedAt) <= timeOf(state.resetAt)) continue;
        state.answers[question.question_id] = mergeQuestionState(state.answers[question.question_id], incoming);
        globalState.questions[question.question_id] = mergeQuestionState(globalState.questions[question.question_id], incoming);
      }
      if (!localRevision && !localNavigationRevision && timeOf(value.currentUpdatedAt) > timeOf(state.currentUpdatedAt)) {
        current = Math.min(Math.max(0, Number(value.current || 0)), Math.max(QUESTIONS.length - 1, 0));
      }
    }

    function mergeRemoteOverview(data) {
      if (CLOUD_LOCAL_ONLY) return;
      for (const incoming of Array.isArray(data?.questionStates) ? data.questionStates : []) {
        if (!canMergeSatCloudQuestion(incoming)) continue;
        const questionId = canonicalQuestionId(incoming.questionId, incoming.pageId || "");
        if (locallyChangedQuestionIds.has(questionId)) continue;
        globalState.questions[questionId] = mergeQuestionState(globalState.questions[questionId], incoming);
      }
      for (const page of Array.isArray(data?.pageStates) ? data.pageStates : []) {
        if (!page?.pageId || isUnverifiedSatCloudPage(page.pageId)) continue;
        const local = globalState.pages[page.pageId];
        if (!local || timeOf(page.lastVisitedAt || page.updatedAt) > timeOf(local.lastVisitedAt)) {
          globalState.pages[page.pageId] = page;
        }
      }
      for (const question of QUESTIONS) {
        if (locallyChangedQuestionIds.has(question.question_id)) continue;
        const incoming = globalState.questions[question.question_id];
        if (incoming && timeOf(incoming.updatedAt) > timeOf(state.resetAt)) {
          state.answers[question.question_id] = mergeQuestionState(state.answers[question.question_id], incoming);
        }
      }
    }

    async function processAttemptOutbox() {
      if (CLOUD_LOCAL_ONLY || !cloudSession) return;
      if (outboxSyncPromise) return outboxSyncPromise;
      const scopeToken = learningStorage.token();
      const savingSession = cloudSession;
      outboxSyncPromise = (async () => {
        const outbox = loadAttemptOutbox();
        if (!outbox.length) return;
        // Deferred partial entries stay in the owner-scoped outbox; another
        // page must not silently upload them after navigating away.
        const batch = outbox.filter(canUploadSatCloudAttempt).slice(0, 20);
        const syncedAttemptIds = new Set();
        for (const attempt of batch) {
          if (!learningStorage.isCurrent(scopeToken)) return;
          try {
            await learningStorage.callOwned(savingSession, "saveSatPracticeAttempt", { attempt }, scopeToken);
            if (!learningStorage.isCurrent(scopeToken)) return;
            syncedAttemptIds.add(attempt.attemptId);
            sessionSyncedAttemptIds.add(attempt.attemptId);
          } catch (error) {
            console.warn("[sat learning] attempt sync failed", error);
          }
        }
        if (!learningStorage.isCurrent(scopeToken)) return;
        volatileAttemptOutbox = volatileAttemptOutbox
          .filter(attempt => !syncedAttemptIds.has(attempt?.attemptId));
        const pending = loadAttemptOutbox()
          .filter(attempt => !syncedAttemptIds.has(attempt?.attemptId));
        if (writeLocalJson(OUTBOX_KEY, pending)) {
          volatileAttemptOutbox = [];
          for (const attemptId of syncedAttemptIds) sessionSyncedAttemptIds.delete(attemptId);
        } else {
          const pendingById = new Map(volatileAttemptOutbox.map(item => [item.attemptId, item]));
          for (const attempt of pending) pendingById.set(attempt.attemptId, attempt);
          volatileAttemptOutbox = [...pendingById.values()];
        }
      })().finally(() => { if (learningStorage.isCurrent(scopeToken)) outboxSyncPromise = null; });
      return outboxSyncPromise;
    }

    async function saveCurrentReflection() {
      if (CLOUD_LOCAL_ONLY || !cloudSession) return;
      const savingSession = cloudSession;
      const scopeToken = learningStorage.token();
      const question = currentQuestion();
      const qs = activeState(question);
      if (redoMode && !qs.revealed) return;
      const reflection = redoMode ? {
        revealed: true, revealedAt: qs.revealedAt, updatedAt: qs.updatedAt,
        skill: question.classification?.skill || "",
        subtype: question.classification?.subtype || "未细分",
        sourceSet: question._source_set || question.source_set || ""
      } : {
        starred: qs.starred, confidence: qs.confidence,
        errorTags: qs.errorTags, note: qs.note, highlights: qs.highlights,
        revealed: qs.revealed, revealedAt: qs.revealedAt, updatedAt: qs.updatedAt,
        skill: question.classification?.skill || "",
        subtype: question.classification?.subtype || "未细分",
        sourceSet: question._source_set || question.source_set || ""
      };
      if (!learningStorage.isCurrent(scopeToken)) return;
      await learningStorage.callOwned(savingSession, "saveSatQuestionReflection", {
        questionId: question.question_id,
        pageId: PAGE_ID,
        reflection
      }, scopeToken);
    }

    async function saveCurrentReflectionBestEffort() {
      try {
        await saveCurrentReflection();
        return true;
      } catch (error) {
        console.warn("[sat learning] reflection sync deferred", error);
        return false;
      }
    }

    async function saveCloudState() {
      if (CLOUD_LOCAL_ONLY || !cloudSession) return;
      if (cloudSaveInFlight) {
        cloudSavePending = true;
        return cloudSaveInFlight;
      }
      const scopeToken = learningStorage.token();
      const savingSession = cloudSession;
      cloudSaveInFlight = (async () => {
        while (true) {
          if (!learningStorage.isCurrent(scopeToken)) return;
          cloudSavePending = false;
          const savingRevision = localRevision;
          const snapshot = JSON.parse(JSON.stringify(state));
          setSyncStatus("正在同步");
          try {
            await learningStorage.callOwned(savingSession, "saveSatPracticeState", { pageId: PAGE_ID, state: snapshot }, scopeToken);
            if (!learningStorage.isCurrent(scopeToken)) return;
          } catch (error) {
            if (!learningStorage.isCurrent(scopeToken)) return;
            console.warn("[sat learning] practice state sync failed", error);
            setSyncStatus("同步失败，本机已保留", "error");
            return;
          }
          void processAttemptOutbox();
          void saveCurrentReflectionBestEffort();
          if (!cloudSavePending && localRevision === savingRevision) {
            setSyncStatus("进度已同步");
            break;
          }
        }
        setSyncStatus("进度已同步");
      })().finally(() => {
        if (learningStorage.isCurrent(scopeToken)) cloudSaveInFlight = null;
      });
      return cloudSaveInFlight;
    }

    function refreshAfterRemoteMerge(beforeSignature) {
      if (visibleStateSignature() !== beforeSignature) {
        render();
      } else {
        renderOverview();
      }
    }

    async function syncOverviewInBackground() {
      if (CLOUD_LOCAL_ONLY) return;
      const scopeToken = learningStorage.token();
      const readingSession = cloudSession;
      if (!readingSession) return;
      try {
        const overviewData = await learningStorage.callOwned(readingSession, "getSatLearningOverview", {}, scopeToken);
        if (!learningStorage.isCurrent(scopeToken)) return;
        const beforeSignature = visibleStateSignature();
        mergeRemoteOverview(overviewData || {});
        persistLocalState({ deferGlobal: true, touchCurrent: false, updateSyncStatus: false });
        refreshAfterRemoteMerge(beforeSignature);
      } catch (error) {
        console.warn("[sat learning] overview sync deferred", error);
      }
    }

    function bindLearningIdentity(session) {
      let changed;
      try { changed = learningStorage.bind(session); }
      catch (error) {
        cloudSession = null;
        for (const timer of [cloudSaveTimer, reflectionTimer, globalPersistTimer, examTimer]) if (timer) clearTimeout(timer);
        cloudSaveTimer = reflectionTimer = globalPersistTimer = examTimer = null;
        cloudSaveInFlight = cloudBootstrapPromise = outboxSyncPromise = null;
        volatileAttemptOutbox = [];
        practiceSession = examSession = null;
        redoSession = defaultQuestionState();
        state = { current: 0, answers: {} };
        globalState = { questions: {}, pages: {}, attempts: [] };
        setSyncStatus("无法确认账号归属，已暂停本机记录和云端同步", "error");
        refreshLegacyBackup();
        render();
        return false;
      }
      if (changed) {
        for (const timer of [cloudSaveTimer, reflectionTimer, globalPersistTimer, examTimer]) if (timer) clearTimeout(timer);
        cloudSaveTimer = reflectionTimer = globalPersistTimer = examTimer = null;
        cloudSaveInFlight = cloudBootstrapPromise = outboxSyncPromise = null;
        cloudSavePending = false;
        volatileAttemptOutbox = [];
        sessionSyncedAttemptIds.clear();
        locallyChangedQuestionIds.clear();
        localRevision = 0;
        localNavigationRevision = focusQuestionId ? 1 : 0;
        for (const id of Object.keys(explanationOpen)) delete explanationOpen[id];
        state = loadState();
        globalState = loadGlobalState();
        current = Math.min(Math.max(0, Number(state.current) || 0), Math.max(QUESTIONS.length - 1, 0));
        const focusIndex = QUESTIONS.findIndex(question => question.question_id === focusQuestionId);
        if (focusIndex >= 0) current = focusIndex;
        redoMode = Boolean(redoQuestionId);
        redoSession = redoMode ? defaultQuestionState() : null;
        restorePracticeSession();
        examSession = requestedExamMode && EXAM_CONFIG ? loadExamSession() : null;
        examWriteBlocked = false;
        if (!requestedExamMode) migrateAndMergeLocalState();
        refreshLegacyBackup();
        render();
      }
      return true;
    }

    function bootstrapCloudLearning(session) {
      if (!bindLearningIdentity(session)) return Promise.resolve();
      if (CLOUD_LOCAL_ONLY) {
        cloudSession = null;
        if (els.syncStatus.dataset.kind !== "error") setSyncStatus("仅使用本机记录");
        if (window.satCloudbaseReleaseGate) window.satCloudbaseReleaseGate();
        return Promise.resolve();
      }
      cloudSession = session;
      if (cloudBootstrapPromise) return cloudBootstrapPromise;
      cloudBootstrapPromise = runCloudBootstrap();
      return cloudBootstrapPromise;
    }

    async function runCloudBootstrap() {
      const scopeToken = learningStorage.token();
      const readingSession = cloudSession;
      setSyncStatus("正在同步");
      const gateFailsafe = window.setTimeout(() => {
        if (!learningStorage.isCurrent(scopeToken)) return;
        setSyncStatus("云端同步较慢，本机可继续使用", "error");
        if (window.satCloudbaseReleaseGate) window.satCloudbaseReleaseGate();
      }, CLOUD_GATE_FAILSAFE_MS);
      try {
        const pageData = await learningStorage.callOwned(readingSession, "getSatPracticeState", { pageId: PAGE_ID }, scopeToken);
        if (!learningStorage.isCurrent(scopeToken)) return;
        const beforeSignature = visibleStateSignature();
        mergeRemotePage(pageData?.state);
        persistLocalState({ deferGlobal: true, touchCurrent: false, updateSyncStatus: false });
        refreshAfterRemoteMerge(beforeSignature);
        window.setTimeout(() => { if (learningStorage.isCurrent(scopeToken) && cloudSession) void syncOverviewInBackground(); }, 800);
        await saveCloudState();
      } catch (error) {
        if (!learningStorage.isCurrent(scopeToken)) return;
        console.warn("[sat learning] bootstrap failed", error);
        setSyncStatus("云端读取失败，本机可继续使用", "error");
      } finally {
        window.clearTimeout(gateFailsafe);
        if (learningStorage.isCurrent(scopeToken) && window.satCloudbaseReleaseGate) window.satCloudbaseReleaseGate();
      }
    }

    function onReflectionChanged() {
      if (redoMode) return;
      const qs = qState(currentQuestion());
      const checkedConfidence = document.querySelector('input[name="confidence"]:checked');
      qs.confidence = checkedConfidence?.value || "";
      qs.errorTags = [...els.errorTagsRow.querySelectorAll('input[type="checkbox"]:checked')].map(input => input.value);
      qs.note = els.noteInput.value;
      qs.updatedAt = nowIso();
      saveState({ deferGlobal: true, touchCurrent: false });
      if (reflectionTimer) clearTimeout(reflectionTimer);
      reflectionTimer = setTimeout(() => { if (cloudSession) void saveCurrentReflectionBestEffort(); }, 900);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    els.overviewBtn.hidden = redoMode;
    els.checkAllBtn.hidden = redoMode;
    els.exportJsonBtn.closest(".export-group").hidden = redoMode;
    els.examModeBtn.addEventListener("click", () => {
      const url = new URL(location.href);
      url.searchParams.delete("redo");
      url.searchParams.delete("focus");
      url.searchParams.delete("session");
      url.searchParams.set("mode", "exam");
      location.assign(url.toString());
    });
    els.overviewBtn.addEventListener("click", () => {
      els.overviewPanel.classList.toggle("visible");
      if (els.overviewPanel.classList.contains("visible")) renderOverview();
    });
    els.checkCurrentBtn.addEventListener("click", () => {
      if (requestedExamMode) return;
      const question = currentQuestion();
      const live = activeState(question);
      const displayed = els.choices.querySelector(".choice.selected")?.dataset.choiceLabel || "";
      if (live.submitted || !live.selected || displayed !== live.selected) {
        render();
        if (!live.submitted) {
          els.checkCurrentBtn.disabled = true;
          els.feedback.textContent = "选项状态已更新，请重新选择后提交。";
        }
        return;
      }
      const attempt = checkQuestion(question);
      if (!attempt) return;
      updateCurrentQuestionView(question, activeState(question));
      saveStateBestEffort();
      upsertAttemptOutboxBestEffort(attempt);
    });
    els.checkAllBtn.addEventListener("click", () => {
      if (requestedExamMode) return;
      const attempts = [];
      QUESTIONS.forEach(question => {
        if (qState(question).selected && !qState(question).submitted) {
          const attempt = checkQuestion(question);
          if (attempt) attempts.push(attempt);
        }
      });
      const question = currentQuestion();
      updateCurrentQuestionView(question, activeState(question));
      renderOverview();
      saveStateBestEffort();
      attempts.forEach(upsertAttemptOutboxBestEffort);
    });
    els.starBtn.addEventListener("click", () => {
      const qs = qState(currentQuestion());
      qs.starred = !qs.starred;
      saveState();
      updateCurrentQuestionView(currentQuestion(), qs);
    });
    els.revealBtn.addEventListener("click", () => {
      if (requestedExamMode) return;
      const question = currentQuestion();
      const qs = activeState(question);
      if (!qs.submitted) return;
      explanationOpen[question.question_id] = !explanationOpen[question.question_id];
      let latestAttempt = null;
      if (explanationOpen[question.question_id] && !qs.revealed) {
        qs.revealed = true;
        qs.revealedAt = nowIso();
        qs.updatedAt = qs.revealedAt;
        const attempts = Array.isArray(globalState.attempts) ? globalState.attempts : [];
        latestAttempt = [...attempts].reverse().find(item => item.questionId === question.question_id && item.mode === (redoMode ? "blank_redo" : "practice"));
        if (latestAttempt) {
          latestAttempt.revealed = true;
          latestAttempt.revealedAt = qs.revealedAt;
        }
        if (!redoMode) globalState.questions[question.question_id] = mergeQuestionState(globalState.questions[question.question_id], qs);
      }
      updateCurrentQuestionView(question, qs);
      saveStateBestEffort();
      if (latestAttempt) upsertAttemptOutboxBestEffort(latestAttempt);
    });
    els.retryBtn.addEventListener("click", () => {
      const question = currentQuestion();
      if (redoMode) {
        redoSession = defaultQuestionState();
        if (practiceSession) {
          practiceSession.answers[question.question_id] = redoSession;
          writeLocalJson(SESSION_KEY, practiceSession);
        }
        explanationOpen[question.question_id] = false;
        render();
        return;
      }
      redoMode = true;
      redoQuestionId = question.question_id;
      redoSession = defaultQuestionState();
      invalidRedoQuestionId = false;
      explanationOpen[question.question_id] = false;
      const url = new URL(location.href);
      url.searchParams.set("redo", question.question_id);
      url.searchParams.delete("focus");
      history.pushState({ satRedo: question.question_id }, "", url);
      render();
    });
    els.returnOriginalBtn.addEventListener("click", () => {
      redoMode = false;
      redoQuestionId = "";
      redoSession = null;
      invalidRedoQuestionId = false;
      explanationOpen[currentQuestion().question_id] = false;
      const url = new URL(location.href);
      url.searchParams.delete("redo");
      history.replaceState({}, "", url);
      render();
      scrollPracticeToStart();
    });
    els.highlightBtn.addEventListener("click", addSelectionHighlight);
    document.querySelectorAll('input[name="confidence"]').forEach(input => input.addEventListener("change", onReflectionChanged));
    els.errorTagsRow.addEventListener("change", onReflectionChanged);
    els.noteInput.addEventListener("input", onReflectionChanged);
    els.prevBtn.addEventListener("click", () => {
      if (navigateSession(-1)) return;
      if (redoMode) els.returnOriginalBtn.click();
      current = Math.max(0, current - 1);
      saveState({ markQuestion: false });
      render();
      scrollPracticeToStart();
    });
    els.nextBtn.addEventListener("click", () => {
      if (navigateSession(1)) return;
      if (redoMode) els.returnOriginalBtn.click();
      current = Math.min(QUESTIONS.length - 1, current + 1);
      saveState({ markQuestion: false });
      render();
      scrollPracticeToStart();
    });
    els.exportJsonBtn.addEventListener("click", exportJson);
    els.exportPdfBtn.addEventListener("click", exportPdf);
    els.stimulus.addEventListener("click", event => {
      const sizeButton = event.target.closest(".chart-size-btn");
      if (sizeButton) {
        const question = currentQuestion();
        const scale = sizeButton.dataset.scale;
        if (scale === "calc") {
          delete chartScaleOverrides[question.question_id];
        } else {
          chartScaleOverrides[question.question_id] = scale;
        }
        render();
        return;
      }
      const openButton = event.target.closest(".chart-open-button");
      if (openButton) {
        const wrap = openButton.closest(".chart-image-wrap");
        const image = wrap ? wrap.querySelector(".chart-image") : els.stimulus.querySelector(".chart-image");
        if (image) openChartLightbox(image);
        return;
      }
      const image = event.target.closest(".chart-image");
      if (!image) return;
      openChartLightbox(image);
    });
    els.chartLightbox.addEventListener("click", event => {
      if (event.target === els.chartLightbox) closeChartLightbox();
    });
    els.chartLightboxClose.addEventListener("click", closeChartLightbox);
    document.addEventListener("keydown", event => {
      if (!els.resetConfirm.hidden) {
        if (event.key === "Escape") { event.preventDefault(); closeResetConfirmation(); }
        else if (event.key === "Tab") {
          event.preventDefault();
          (event.target === els.resetConfirmCancel ? els.resetConfirmApply : els.resetConfirmCancel).focus();
        }
        return;
      }
      const image = event.target.closest && event.target.closest("img.visual-asset[role='button']");
      if (image && ["Enter", " "].includes(event.key)) {
        event.preventDefault();
        openChartLightbox(image);
        return;
      }
      if (event.key === "Escape" && els.chartLightbox.classList.contains("visible")) {
        closeChartLightbox();
        return;
      }
      if (event.key === "Tab" && els.chartLightbox.classList.contains("visible")) {
        event.preventDefault();
        els.chartLightboxClose.focus();
      }
    });
    function closeResetConfirmation() {
      els.resetConfirm.hidden = true;
      els.resetBtn.focus();
    }
    els.resetConfirm.hidden = true;
    els.resetBtn.addEventListener("click", () => {
      els.resetConfirm.hidden = false;
      els.resetConfirmCancel.focus();
    });
    els.resetConfirmCancel.addEventListener("click", closeResetConfirmation);
    els.resetConfirmApply.addEventListener("click", () => {
      closeResetConfirmation();
      state = { current: 0, answers: {}, resetAt: nowIso() };
      current = 0;
      for (const id of Object.keys(explanationOpen)) delete explanationOpen[id];
      persistLocalState();
      queueCloudSave();
      render();
      scrollPracticeToStart();
    });

    window.addEventListener("popstate", () => {
      if (requestedExamMode) return;
      const url = new URL(location.href);
      requestedRedoQuestionId = url.searchParams.get("redo") || "";
      const redoIndex = QUESTIONS.findIndex(question => question.question_id === requestedRedoQuestionId);
      invalidRedoQuestionId = Boolean(requestedRedoQuestionId && redoIndex < 0);
      redoMode = redoIndex >= 0;
      redoQuestionId = redoMode ? requestedRedoQuestionId : "";
      redoSession = redoMode ? defaultQuestionState() : null;
      const focusId = url.searchParams.get("focus") || redoQuestionId;
      const focusIndex = QUESTIONS.findIndex(question => question.question_id === focusId);
      current = focusIndex >= 0 ? focusIndex : Math.min(state.current || 0, Math.max(QUESTIONS.length - 1, 0));
      for (const questionId of Object.keys(explanationOpen)) explanationOpen[questionId] = false;
      saveState({ markQuestion: false });
      render();
      scrollPracticeToStart();
    });

    if (PAGE_META.sourceFamily === "source-edited-unverified") {
      const notice = document.getElementById("sourceNotice");
      notice.textContent = "来源说明：本套为整理练习材料，考试出处尚未认证；部分题目已明确校订。待核实题已隔离，当前仅提供普通练习，不作为完整模考。";
      notice.hidden = false;
    }
    if (CLOUD_LOCAL_ONLY) {
      const notice = document.getElementById("cloudMigrationNotice");
      notice.textContent = "本套使用账号隔离的本机保存。云端旧题号迁移尚未核验，已暂停本套进度、作答和笔记的云端读取与上传；历史云端数据未删除，可在此继续练习。";
      notice.hidden = false;
    }
    if (!learningStorage.ready()) setSyncStatus("正在确认账号记录归属");
    refreshLegacyBackup();
    restorePracticeSession();
    if (!requestedExamMode && learningStorage.ready()) migrateAndMergeLocalState();
    render();
    const onLearningSessionReady = session => {
      if (requestedExamMode) {
        if (bindLearningIdentity(session) && window.satCloudbaseReleaseGate) window.satCloudbaseReleaseGate();
      } else void bootstrapCloudLearning(session);
    };
    window.addEventListener("sat-cloudbase-session-ready", event => onLearningSessionReady(event.detail || window.satCloudbaseSession));
    window.addEventListener("sat-learning-owner-invalid", () => bindLearningIdentity({}));
    if (window.satCloudbaseSession) onLearningSessionReady(window.satCloudbaseSession);
    if (!requestedExamMode) {
      window.addEventListener("online", () => { if (cloudSession) void saveCloudState(); });
    } else if (window.satCloudbaseReleaseGate) {
      window.satCloudbaseReleaseGate();
    }
    document.addEventListener("visibilitychange", () => {
      if (requestedExamMode && document.visibilityState === "visible") {
        const active = activeExamModule();
        if (active && !active.state.submittedAt) updateExamTimer(active);
      }
    });
    window.addEventListener("storage", event => {
      const scopedKey = learningStorage.eventKey(event);
      if (!requestedExamMode && scopedKey === GLOBAL_KEY) {
        const before = visibleStateSignature();
        globalState = learningStorage.mergeGlobal(globalState, value => ({ ...value, attempts: compactAttempts(value.attempts) }), mergeQuestionState);
        for (const question of QUESTIONS) {
          const incoming = globalState.questions[question.question_id];
          if (incoming && timeOf(incoming.updatedAt) > timeOf(state.resetAt)) {
            state.answers[question.question_id] = normalizeQuestionState(mergeQuestionState(state.answers[question.question_id], incoming), question);
          }
        }
        if (visibleStateSignature() !== before) render();
        return;
      }
      if (!requestedExamMode || !examSession || scopedKey !== EXAM_STORAGE_KEY) return;
      try {
        const incoming = event.newValue ? asRecord(JSON.parse(event.newValue)) : null;
        const incomingRevision = Number.isInteger(incoming && incoming.revision) ? incoming.revision : 0;
        const localRevision = Number.isInteger(examSession.revision) ? examSession.revision : 0;
        if (!incoming || incoming.sessionId !== examSession.sessionId
          || (incoming.writerId !== EXAM_TAB_ID && incomingRevision > localRevision)) {
          markExamPersistenceIssue("检测到另一个标签页已更新或重置本次模考。为避免覆盖答案，已停止本页保存。");
        }
      } catch (error) {
        markExamPersistenceIssue("检测到无法验证的外部模考状态变更，已停止本页保存。");
      }
    });
    window.addEventListener("pagehide", () => {
      if (!requestedExamMode) {
        persistLocalState();
        if (cloudSession) void saveCloudState();
      }
    });
  </script>
</body>
</html>
