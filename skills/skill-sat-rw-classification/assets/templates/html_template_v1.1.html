    // The question the stored state was on, found by id first: an older page key
    // (before the page gained questions) numbers its questions differently.
    function restoredIndex(saved) {
      const byId = QUESTIONS.findIndex(question => question.question_id === saved.currentQuestionId);
      if (byId >= 0) return byId;
      return Math.min(Math.max(0, Number(saved.current) || 0), Math.max(QUESTIONS.length - 1, 0));
    }

    function loadState() {
      const candidates = [{ storageKey, aliases: {} }, ...PAGE_MIGRATIONS];
      const next = { current: 0, answers: {} };
      let newestVisit = 0;
      for (const candidate of candidates) {
        try {
          const parsed = JSON.parse(learningStorage.getItem(candidate.storageKey) || "null");
          if (!parsed || typeof parsed !== "object") continue;
          const visited = timeOf(parsed.lastVisitedAt || parsed.currentUpdatedAt);
          if (visited >= newestVisit) {
            newestVisit = visited;
            Object.assign(next, parsed, { answers: next.answers });
            // A migrated page lists its questions differently: where the learner was is a question, not an index.
            if (typeof parsed.currentQuestionId === "string") {
              next.currentQuestionId = String(asRecord(candidate.aliases)[parsed.currentQuestionId] || parsed.currentQuestionId);
            }
          }
          for (const [legacyId, value] of Object.entries(asRecord(parsed.answers))) {
            const questionId = String(asRecord(candidate.aliases)[legacyId] || legacyId);
            next.answers[questionId] = mergeQuestionState(next.answers[questionId], value);
          }
        } catch (error) {
          console.warn("[sat learning] legacy page state migration skipped", error);
        }
      }
      for (const [questionId, value] of Object.entries(asRecord(next.answers))) {
        next.answers[questionId] = normalizeQuestionState(value);
      }
      return next;
    }

    function loadGlobalState() {
      try {
        const parsed = JSON.parse(learningStorage.getItem(GLOBAL_KEY) || "{}");
        const next = { version: SAT_LEARNING_VERSION, questions: {}, pages: {}, attempts: [], ...parsed };
        next.questions = asRecord(next.questions);
        next.pages = asRecord(next.pages);
        next.attempts = compactAttempts(next.attempts);
        for (const [questionId, value] of Object.entries(next.questions)) {
          next.questions[questionId] = normalizeQuestionState(value);
        }
        return next;
      } catch {
        return { version: SAT_LEARNING_VERSION, questions: {}, pages: {}, attempts: [] };
      }
    }

    function loadJson(key, fallback) {
      try {
        const value = JSON.parse(learningStorage.getItem(key) || "null");
        return value === null ? fallback : value;
      } catch { return fallback; }
    }

    function loadAttemptOutbox() {
      let value = [];
      let needsRepair = false;
      try {
        const raw = learningStorage.getItem(OUTBOX_KEY);
        if (raw) {
          value = JSON.parse(raw);
          if (!Array.isArray(value)) {
            value = [];
            needsRepair = true;
          }
        }
      } catch (error) {
        console.warn("[sat learning] malformed attempt outbox repaired", error);
        value = [];
        needsRepair = true;
      }
      const normalized = value.filter(item => {
        return item && typeof item === "object" && !Array.isArray(item) && typeof item.attemptId === "string" && item.attemptId;
      });
      if (normalized.length !== value.length) needsRepair = true;
      const combinedById = new Map();
      for (const item of [...normalized, ...volatileAttemptOutbox]) {
        if (!item || typeof item !== "object" || Array.isArray(item) || typeof item.attemptId !== "string" || !item.attemptId) continue;
        if (sessionSyncedAttemptIds.has(item.attemptId)) continue;
        combinedById.set(item.attemptId, { ...(combinedById.get(item.attemptId) || {}), ...item });
      }
      const combined = [...combinedById.values()];
      if (needsRepair) {
        console.warn("[sat learning] invalid attempt outbox reset");
        if (writeLocalJson(OUTBOX_KEY, combined)) volatileAttemptOutbox = [];
      }
      return combined;
    }

    function compactAttempts(value) {
      const cutoff = Date.now() - 30 * 86400000;
      return (Array.isArray(value) ? value : [])
        .filter(item => !item?.submittedAt || timeOf(item.submittedAt) >= cutoff)
        .slice(-1000);
    }

    function writeLocalJson(key, value) {
      try {
        learningStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (error) {
        console.warn("[sat learning] local storage write failed", { key, error });
        setSyncStatus(CLOUD_LOCAL_ONLY
          ? "本机存储不可用，本套无法云端备份，请勿关闭页面"
          : "本机存储空间不足，请保持联网", "error");
        return false;
      }
    }

    function flushGlobalState() {
      if (globalPersistTimer) clearTimeout(globalPersistTimer);
      globalPersistTimer = null;
      if (!learningStorage.ready()) return false;
      const write = () => {
        globalState = learningStorage.mergeGlobal(globalState, value => ({ ...value, attempts: compactAttempts(value.attempts) }), mergeQuestionState);
        return writeLocalJson(GLOBAL_KEY, globalState);
      };
      void learningStorage.coordinateGlobal(write).catch(error => {
        console.warn("[sat learning] coordinated persistence failed", error);
        setSyncStatus("本机保存尚未完成，请勿关闭页面", "error");
      });
      return true;
    }

    function scheduleGlobalPersist() {
      if (globalPersistTimer) clearTimeout(globalPersistTimer);
      globalPersistTimer = setTimeout(flushGlobalState, 120);
    }

    function migrateAndMergeLocalState() {
      for (const question of QUESTIONS) {
        const pageValue = state.answers[question.question_id];
        const globalValue = globalState.questions[question.question_id];
        if (!pageValue && globalValue && timeOf(globalValue.updatedAt) <= timeOf(state.resetAt)) continue;
        if (!pageValue && !globalValue) continue;
        const merged = normalizeQuestionState(mergeQuestionState(pageValue, globalValue), question);
        state.answers[question.question_id] = merged;
        globalState.questions[question.question_id] = merged;
      }
      persistLocalState({ deferGlobal: true, touchCurrent: false });
    }

    function persistLocalState({ deferGlobal = false, touchCurrent = true, updateSyncStatus = true } = {}) {
      if (!learningStorage.ready()) return;
      const visitedAt = nowIso();
      state.current = current;
      if (touchCurrent) state.currentUpdatedAt = visitedAt;
      state.currentQuestionId = QUESTIONS[current]?.question_id || null;
      // A focus link selects its entry question only once. Keep its URL aligned
      // with explicit navigation so refresh resumes the question now on screen.
      if (touchCurrent && !redoMode && state.currentQuestionId) {
        const url = new URL(location.href);
        if (url.searchParams.has("focus")) {
          url.searchParams.set("focus", state.currentQuestionId);
          history.replaceState(history.state, "", url);
        }
      }
      state.lastVisitedAt = visitedAt;
      const pageStored = writeLocalJson(storageKey, state);
      const submitted = QUESTIONS.filter(question => {
        const value = state.answers[question.question_id];
        return value ? normalizeQuestionState(value).submitted : false;
      }).length;
      globalState.pages[PAGE_ID] = {
        pageId: PAGE_ID, title: document.title, current,
        questionId: QUESTIONS[current]?.question_id || null,
        total: QUESTIONS.length, submitted, href: location.pathname,
        lastVisitedAt: visitedAt
      };
      globalState.version = SAT_LEARNING_VERSION;
      let globalStored = true;
      if (deferGlobal) scheduleGlobalPersist();
      else globalStored = flushGlobalState();
      if (updateSyncStatus && pageStored && globalStored) {
        setSyncStatus(cloudSession ? "等待同步" : "");
      }
    }

    function saveState({ deferGlobal = false, touchCurrent = true, markQuestion = true } = {}) {
      const question = QUESTIONS[current];
      if (practiceSession && redoMode && question?.question_id === redoQuestionId) {
        redoSession.updatedAt = nowIso();
        practiceSession.answers[question.question_id] = redoSession;
        practiceSession.lastQuestionId = question.question_id;
        practiceSession.lastVisitedAt = redoSession.updatedAt;
        writeLocalJson(SESSION_KEY, practiceSession);
      }
      if (!redoMode && question && state.answers[question.question_id]) {
        state.answers[question.question_id].updatedAt = nowIso();
        globalState.questions[question.question_id] = mergeQuestionState(
          globalState.questions[question.question_id], state.answers[question.question_id]
        );
      }
      localRevision += 1;
      if (touchCurrent) localNavigationRevision += 1;
      if (markQuestion && question) locallyChangedQuestionIds.add(question.question_id);
      persistLocalState({ deferGlobal, touchCurrent });
      queueCloudSave();
    }

    function saveStateBestEffort(options = {}) {
      try {
        saveState(options);
        return true;
      } catch (error) {
        console.warn("[sat learning] local state persistence deferred", error);
        setSyncStatus("作答结果已显示，保存将在稍后重试", "error");
        return false;
      }
    }

    function qState(question) {
      if (!state.answers[question.question_id]) {
        const historical = normalizeQuestionState(globalState.questions[question.question_id], question);
        state.answers[question.question_id] = {
          ...defaultQuestionState(), starred: historical.starred, note: historical.note,
          highlights: historical.highlights, firstWrongAt: historical.firstWrongAt,
          attemptCount: historical.attemptCount, redoCount: historical.redoCount,
          lastRedoCorrect: historical.lastRedoCorrect, lastAttemptAt: historical.lastAttemptAt,
          reviewStage: historical.reviewStage, nextDueAt: historical.nextDueAt,
          mastered: historical.mastered, masteredAt: historical.masteredAt,
        };
      }
      const existing = state.answers[question.question_id];
      Object.assign(existing, normalizeQuestionState(existing, question));
      return existing;
    }

    function activeState(question) {
      return redoMode && question.question_id === redoQuestionId ? redoSession : qState(question);
    }

    // Whether the question is in the learner's review list. A session or a blank
    // redo answers on a blank copy, so there the star is read from the lasting record.
    function isStarred(question, qs) {
      return redoMode && question.question_id === redoQuestionId
        ? Boolean(asRecord(globalState.questions[question.question_id]).starred)
        : Boolean(qs.starred);
    }

    function currentQuestion() {
      return QUESTIONS[current];
    }

    function visibleStateSignature() {
      const question = currentQuestion();
      if (!question) return "empty";
      const qs = activeState(question);
      return JSON.stringify({
        current,
        questionId: question.question_id,
        selected: qs.selected,
        submitted: qs.submitted,
        correct: qs.correct,
        starred: qs.starred,
        revealed: qs.revealed,
        confidence: qs.confidence,
        errorTags: qs.errorTags,
        note: qs.note,
        highlights: qs.highlights
      });
    }

    function questionHasChart(question) {
      return Boolean(question && question.chart_image && question.chart_image_data_uri);
    }

    function baseChartScale(question) {
      const scale = Number.parseFloat(question.chart_display_scale);
      return Number.isFinite(scale) && scale > 0 ? scale : 1;
    }

    function effectiveChartScale(question) {
      const override = chartScaleOverrides[question.question_id];
      return override || baseChartScale(question);
    }

    function chartLeftPercent(scale) {
      return 55 + (scale - 1) * 30;
    }

    function applyChartLayout(question) {
      if (!questionHasChart(question)) {
        document.body.classList.remove("chart-question");
        document.body.style.removeProperty("--chart-left-pct");
        document.body.style.removeProperty("--chart-left-ratio");
        return;
      }
      document.body.classList.add("chart-question");
      document.body.style.setProperty("--chart-left-pct", `${chartLeftPercent(effectiveChartScale(question))}%`);
      document.body.style.setProperty("--chart-left-ratio", String(chartLeftPercent(effectiveChartScale(question)) / 100));
    }

    function render() {
      if (requestedExamMode) {
        renderExam();
        return;
      }
      setExamChrome(false);
      els.resetBtn.hidden = redoMode || Boolean(activeSessionId);
      if (activeSessionId && !practiceSession) {
        syncQuestionTimer(null);
        els.progressText.textContent = "今日练习暂不可用";
        els.stimulus.textContent = "请确认登录状态后，从学习首页重新建立今日练习。原作答记录未更改。";
        els.choices.innerHTML = "";
        els.explanation.innerHTML = "";
        els.feedback.textContent = "本次会话不存在或不属于当前账号。";
        els.checkCurrentBtn.disabled = true;
        els.revealBtn.disabled = true;
        return;
      }
      if (!QUESTIONS.length) {
        syncQuestionTimer(null);
        applyChartLayout(null);
        els.progressText.textContent = "No questions available";
        els.stimulus.innerHTML = '<div class="empty-stimulus">No usable questions were included in this section.</div>';
        els.questionNumber.textContent = "";
        els.prompt.textContent = "";
        els.choices.innerHTML = "";
        return;
      }

      const question = currentQuestion();
      applyChartLayout(question);
      const qs = activeState(question);
      const session = loadTodaySession();
      const sessionIndex = session ? session.questions.findIndex(item => item.questionId === question.question_id) : -1;
      els.progressText.textContent = sessionIndex >= 0
        ? `今日练习 ${sessionIndex + 1}/${session.questions.length}`
        : `第 ${current + 1}/${QUESTIONS.length} 题`;
      els.questionNumber.innerHTML = `<span class="exam-visually-hidden">Question </span>${(sessionIndex >= 0 ? sessionIndex : current) + 1}`;
      els.starBtn.textContent = isStarred(question, qs) ? "★ 已加入复习" : "☆ 加入复习";
      els.starBtn.hidden = false;
      els.reflectionPanel.hidden = redoMode;
      els.highlightBtn.hidden = redoMode;
      els.overviewBtn.hidden = false;
      els.checkAllBtn.hidden = redoMode;
      els.exportJsonBtn.closest(".export-group").hidden = redoMode;
      els.returnOriginalBtn.hidden = !redoMode || Boolean(practiceSession);
      // Remember where in the session the learner is, so the learning centre can bring them back here.
      if (practiceSession && sessionIndex >= 0 && practiceSession.lastQuestionId !== question.question_id) {
        practiceSession.lastQuestionId = question.question_id;
        practiceSession.lastVisitedAt = nowIso();
        writeLocalJson(SESSION_KEY, practiceSession);
      }
      const bannerText = invalidRedoQuestionId
        ? `无法定位重做题目 ${requestedRedoQuestionId}，已保留当前页面。请返回学习中心重新进入。`
        : redoMode && !practiceSession ? "空白重做 · 原来的作答和解析已隐藏" : "";
      els.modeBanner.classList.toggle("visible", Boolean(bannerText));
      els.modeBanner.textContent = bannerText;
      els.prompt.innerHTML = formatStimulusInline(question.prompt || "");

      const stimulusParts = [];
      if (question.passage) stimulusParts.push(question.passage);
      if (question.math_metadata && question.math_metadata.diagram_reference) {
        stimulusParts.push("Diagram reference: " + question.math_metadata.diagram_reference);
      }
      let stimulusHtml = renderChartImage(question) + renderVisualAssets(question) + renderStimulus(stimulusParts.join("\n\n"));
            // Convert [vocab] markers to highlighted spans
      stimulusHtml = stimulusHtml.replace(/\[vocab\]/g, '<span class="vocab">').replace(/\[\/vocab\]/g, '</span>');
      els.stimulus.innerHTML = stimulusHtml;
      if (!stimulusHtml.trim()) {
        els.stimulus.innerHTML = '<div class="empty-stimulus">No separate passage, diagram, or stimulus for this question.</div>';
      }
      const visualRenderBlocked = Boolean(els.stimulus.querySelector("[data-visual-error]"));
      if (!redoMode) applyHighlights(qs.highlights || []);
      closeGloss();

      els.choices.innerHTML = "";
      (question.choices || []).forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice" + (qs.selected === choice.label ? " selected" : "");
        button.dataset.choiceLabel = choice.label;
        button.setAttribute("aria-pressed", String(qs.selected === choice.label));
        if (qs.submitted && qs.revealed) {
          if (choice.label === question.correct_answer) button.classList.add("correct");
          else if (qs.selected === choice.label) button.classList.add("incorrect");
        }
        button.disabled = qs.submitted || visualRenderBlocked;
        button.innerHTML = `<span class="label"></span><span class="choice-text"></span>`;
        button.querySelector(".label").textContent = choice.label;
        button.querySelector(".choice-text").innerHTML = formatStimulusInline(choice.text || "");
        button.addEventListener("click", () => {
          // Sync may have replaced the answer object since these buttons were drawn.
          if (currentQuestion() !== question || visualRenderBlocked) return;
          const live = activeState(question);
          if (live.submitted) { render(); return; }
          live.selected = choice.label;
          live.updatedAt = nowIso();
          updateChoiceSelection(live);
          saveState({ deferGlobal: true, touchCurrent: false });
        });
        els.choices.appendChild(button);
      });

      renderFeedback(qs);
      if (visualRenderBlocked) {
        els.feedback.className = "feedback incorrect";
        els.feedback.textContent = "本题视觉材料校验失败，已禁止提交。";
      }
      renderExplanation(question, qs);
      syncGlosses(question, qs);
      renderReflection(qs);
      if (els.overviewPanel.classList.contains("visible")) renderOverview();
      els.checkCurrentBtn.disabled = visualRenderBlocked || qs.submitted || !qs.selected;
      els.revealBtn.disabled = !qs.submitted;
      els.revealBtn.textContent = explanationOpen[question.question_id] ? "收起答案与解析" : "查看答案与解析";
      els.retryBtn.hidden = !qs.submitted;
      els.retryBtn.textContent = redoMode ? "重新空白作答" : "空白再答一次";
      els.returnOriginalBtn.hidden = !redoMode || Boolean(practiceSession);
      els.prevBtn.disabled = sessionIndex >= 0 ? sessionIndex === 0 : current === 0;
      els.nextBtn.disabled = sessionIndex >= 0 ? sessionIndex === session.questions.length - 1 : current === QUESTIONS.length - 1;
      renderQuestionList(qs);
      syncQuestionTimer(question, qs);
    }

    function updateChoiceSelection(qs) {
      els.choices.querySelectorAll(".choice").forEach(button => {
        const selected = button.dataset.choiceLabel === qs.selected;
        button.classList.toggle("selected", selected);
        button.setAttribute("aria-pressed", String(selected));
      });
      renderFeedback(qs);
      els.checkCurrentBtn.disabled = qs.submitted || !qs.selected;
      updateCurrentOverviewButton(qs);
      renderQuestionList(qs);
    }

    function updateCurrentOverviewButton(qs) {
      // The current entry, whichever run of questions the answer sheet shows.
      const overviewButton = els.overviewGrid.querySelector('[aria-current="true"]');
      if (overviewButton) {
        const index = Number(overviewButton.dataset.questionIndex);
        overviewButton.classList.toggle("selected", Boolean(qs.selected) && !qs.checked);
        overviewButton.classList.toggle("correct", Boolean(qs.checked && qs.correct));
        overviewButton.classList.toggle("incorrect", Boolean(qs.checked && !qs.correct));
        overviewButton.innerHTML = `${index + 1}${qs.starred ? '<span class="star">★</span>' : ""}`;
        overviewButton.setAttribute("aria-label", overviewLabel(currentQuestion(), qs, index));
      }
    }

    function updateCurrentQuestionView(question, qs) {
      els.choices.querySelectorAll(".choice").forEach(button => {
        const label = button.dataset.choiceLabel;
        button.disabled = qs.submitted;
        button.classList.toggle("selected", label === qs.selected);
        button.setAttribute("aria-pressed", String(label === qs.selected));
        button.classList.toggle("correct", Boolean(qs.submitted && qs.revealed && label === question.correct_answer));
        button.classList.toggle("incorrect", Boolean(qs.submitted && qs.revealed && label === qs.selected && label !== question.correct_answer));
      });
      renderFeedback(qs);
      renderExplanation(question, qs);
      syncGlosses(question, qs);
      renderReflection(qs);
      updateCurrentOverviewButton(qs);
      renderQuestionList(qs);
      syncQuestionTimer(question, qs);
      els.starBtn.textContent = isStarred(question, qs) ? "★ 已加入复习" : "☆ 加入复习";
      els.checkCurrentBtn.disabled = qs.submitted || !qs.selected;
      els.revealBtn.disabled = !qs.submitted;
      els.revealBtn.textContent = explanationOpen[question.question_id] ? "收起答案与解析" : "查看答案与解析";
      els.retryBtn.hidden = !qs.submitted;
      els.retryBtn.textContent = redoMode ? "重新空白作答" : "空白再答一次";
      els.returnOriginalBtn.hidden = !redoMode || Boolean(practiceSession);
    }

    // 来源、年份和原卷题号只在提交之后出现
    function renderSourceLine(qs) {
      const line = document.getElementById("sourceLine"), question = currentQuestion();
      const source = qs && qs.submitted && question ? describeSatSource(question.source_refs, {
        label: question._source_set || question.source_set, number: question.source_question_number ?? question.question_number, kind: question.source_kind
      }) : null;
      line.hidden = !source;
      line.innerHTML = source ? `来源：${escapeHtml(source.text)}${source.note ? `<span>${escapeHtml(source.note)}</span>` : ""}` : "";
    }
    function renderFeedback(qs) {
      renderSourceLine(qs);
      els.feedback.className = "feedback";
      if (!qs.submitted) {
        els.feedback.textContent = "";
        return;
      }
      if (qs.correct) {
        els.feedback.classList.add("correct");
        els.feedback.textContent = "回答正确";
      } else {
        els.feedback.classList.add("incorrect");
        els.feedback.textContent = "回答错误";
      }
    }

    // 讲解：解题思路、题目逐段、选项逐项，每条先英文后中文。只在提交并查看答案后显示。
    function walkthroughHtml(question) {
      const walk = asRecord(question.walkthrough);
      const segments = (Array.isArray(walk.segments) ? walk.segments : []).filter(item => item && item.excerpt);
      if (!segments.length) return "";
      const both = item => `<p class="walk-en">${escapeHtml(asRecord(item).english || "")}</p><p class="walk-zh" lang="zh-CN">${escapeHtml(asRecord(item).chinese || "")}</p>`;
      const notes = asRecord(walk.choices);
      const choices = (question.choices || []).filter(choice => notes[choice.label]).map(choice => {
        const right = choice.label === question.correct_answer;
        return `<div class="walk-choice${right ? " is-correct" : ""}" data-walk-choice="${escapeHtml(choice.label)}">
          <div class="walk-choice-head"><strong>${escapeHtml(choice.label)}.</strong><span class="walk-choice-text">${formatStimulusInline(choice.text)}</span><span class="walk-mark">${right ? "正确" : "错误"}</span></div>
          ${both(notes[choice.label])}</div>`;
      }).join("");
      return `
        <section class="walk-block" data-walk="approach"><h3 class="walk-title">解题思路</h3>${both(walk.approach)}</section>
        <section class="walk-block" data-walk="segments"><h3 class="walk-title">分段讲解</h3><ol class="walk-segments">${segments.map(item =>
          `<li><blockquote class="walk-excerpt">${item.field === "prompt" ? '<span class="walk-tag">题目</span>' : ""}${formatStimulusInline(item.excerpt)}</blockquote>${both(item)}</li>`).join("")}</ol></section>
        ${choices ? `<section class="walk-block" data-walk="choices"><h3 class="walk-title">选项分析</h3><div class="walk-choices">${choices}</div></section>` : ""}`;
    }

    // What the set files carry of their own: key evidence, the reasoning and a line per choice, in English.
    function writtenExplanationHtml(explanation, { withEvidenceFirst }) {
      const choiceAnalysis = asRecord(explanation.choice_analysis);
      const rows = Object.keys(choiceAnalysis).sort().filter(label => String(choiceAnalysis[label] || "").trim())
        .map(label => `<p><strong>${escapeHtml(label)}.</strong> ${formatStimulusInline(choiceAnalysis[label])}</p>`).join("");
      const keyText = String(explanation.key_evidence || explanation.short || "").trim();
      const reasonText = String((withEvidenceFirst ? explanation.key_evidence && explanation.why_correct : explanation.why_correct)
        ? explanation.why_correct : explanation.detailed || explanation.short || "").trim();
      const block = (title, text) => text ? `<div class="walk-block"><h3 class="walk-title">${title}</h3><p class="walk-en">${formatStimulusInline(text)}</p></div>` : "";
      return { empty: !keyText && !reasonText && !rows,
        html: block("关键证据", keyText) + block("正确思路", reasonText) + detailedExplanationHtml(explanation, reasonText)
          + (rows ? `<div class="walk-block"><h3 class="walk-title">选项分析</h3><div class="choice-analysis" style="font-family:var(--sat-font-reading);font-size:var(--sat-font-size-choice);line-height:var(--sat-line-height-choice);">${rows}</div></div>` : "") };
    }

    // The walkthrough when the question has one, with the set file's own explanation folded beneath it.
    function explanationBodyHtml(question, options) {
      const written = writtenExplanationHtml(asRecord(question.explanation), options), walk = walkthroughHtml(question);
      if (!walk) return written.empty ? `<p class="explanation-empty">这道题暂无解析。</p>` : written.html;
      return walk + (written.empty ? "" : `<details class="explanation-written" data-walk="written"><summary>题库原有解析（英文）</summary>${written.html}</details>`);
    }

    function detailedExplanationHtml(explanation, displayedReason) {
      const normalize = value => String(value || "").trim().replace(/\s+/g, " ");
      const detailed = normalize(explanation.detailed);
      if (!detailed || [displayedReason, explanation.key_evidence].some(value => normalize(value) === detailed)) return "";
      return `<details class="explanation-detail"><summary>展开完整解析</summary><p>${formatStimulusInline(explanation.detailed)}</p></details>`;
    }

    function renderExplanation(question, qs) {
      const isOpen = Boolean(qs.submitted && qs.revealed && explanationOpen[question.question_id]);
      els.explanation.className = "explanation" + (isOpen ? " visible" : "");
      if (!isOpen) {
        els.explanation.innerHTML = "";
        return;
      }
      els.explanation.innerHTML = `
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);background:var(--sat-bg-subtle);border-radius:var(--sat-radius-panel) var(--sat-radius-panel) 0 0;">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);margin-bottom:2px;font-family:var(--sat-font-ui);">正确答案</span><strong style="font-family:var(--sat-font-ui);color:var(--sat-correct-text);">${escapeHtml(question.correct_answer || "")}</strong></div>
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);margin-bottom:2px;font-family:var(--sat-font-ui);">你的答案</span><strong style="font-family:var(--sat-font-ui);">${escapeHtml(qs.selected || "未作答")}</strong></div>
          </div>
        </div>
        ${explanationBodyHtml(question, { withEvidenceFirst: true })}
        ${(question.skills_tested && question.skills_tested.length) ? `<div style="padding:10px 16px;border-top:1px solid var(--sat-explanation-border);"><div style="font-size:12px;font-weight:700;color:var(--sat-text-muted);font-family:var(--sat-font-ui);">Skills: ${escapeHtml(question.skills_tested.join(", "))}</div></div>` : ""}
      `;
    }

    function overviewLabel(question, qs, index) {
      const status = qs.checked ? (qs.correct ? "已答对" : "已答错") : qs.selected ? "已选择未提交" : "未作答";
      return `第 ${index + 1} 题，${status}${qs.starred ? "，已加入复习" : ""}`;
    }

    function scrollPracticeToStart() {
      window.scrollTo(0, 0);
      els.practiceLayout.querySelectorAll(".pane").forEach(pane => { pane.scrollTop = 0; });
    }

    // The questions the learner is moving through, for the question list and
    // the answer sheet: the practice session's when this question belongs to
    // one, otherwise this page's. A blank redo shows its own fresh state, never
    // the earlier answer.
    function navigatorEntries(currentState) {
      const here = currentQuestion();
      if (!here) return [];
      const session = practiceSession && practiceSession.questions.some(item => item.questionId === here.question_id)
        ? practiceSession : null;
      if (session) {
        return session.questions.map((item, index) => {
          const isCurrent = item.questionId === here.question_id;
          const qs = isCurrent ? (currentState || activeState(here)) : asRecord(session.answers[item.questionId]);
          return {
            index, isCurrent, inSession: true, selected: Boolean(qs.selected), checked: qs.checked === true,
            correct: qs.correct === true, starred: Boolean(asRecord(globalState.questions[item.questionId]).starred),
            go() {
              if (isCurrent) return;
              location.href = `../${item.route}?session=${encodeURIComponent(session.id)}&focus=${encodeURIComponent(item.questionId)}`;
            }
          };
        });
      }
      return QUESTIONS.map((question, index) => {
        const isCurrent = index === current;
        const qs = isCurrent && currentState ? currentState
          : redoMode && redoSession && question.question_id === redoQuestionId ? redoSession
          : state.answers[question.question_id] ? normalizeQuestionState(state.answers[question.question_id], question)
          : defaultQuestionState();
        return {
          index, isCurrent, inSession: false, selected: Boolean(qs.selected), checked: Boolean(qs.checked),
          correct: Boolean(qs.correct), starred: isStarred(question, qs),
          go() {
            if (isCurrent) return;
            if (redoMode) els.returnOriginalBtn.click();
            current = index;
            saveState({ markQuestion: false });
            render();
            scrollPracticeToStart();
          }
        };
      });
    }

    function renderOverview() {
      els.overviewGrid.innerHTML = "";
      navigatorEntries().forEach(entry => {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.questionIndex = String(entry.index);
        button.className = "qnav";
        if (entry.isCurrent) button.classList.add("current");
        if (entry.checked) button.classList.add(entry.correct ? "correct" : "incorrect");
        else if (entry.selected) button.classList.add("selected");
        button.setAttribute("aria-label", overviewLabel(null, entry, entry.index));
        if (entry.isCurrent) button.setAttribute("aria-current", "true");
        button.innerHTML = `${entry.index + 1}${entry.starred ? '<span class="star">★</span>' : ""}`;
        button.addEventListener("click", () => {
          els.overviewPanel.classList.remove("visible");
          entry.go();
        });
        els.overviewGrid.appendChild(button);
      });
    }

    const moreMenu = document.getElementById("moreMenu"), morePanel = document.getElementById("morePanel");
    function syncMoreMenu() {
      const usable = button => !button.hidden && (button.parentElement === morePanel || !button.parentElement.hidden);
      moreMenu.hidden = ![...morePanel.querySelectorAll("button")].some(usable);
      if (moreMenu.hidden) moreMenu.open = false;
    }
    new MutationObserver(syncMoreMenu).observe(morePanel, { subtree: true, attributes: true, attributeFilter: ["hidden"] });
    syncMoreMenu();
    morePanel.addEventListener("click", event => { if (event.target.closest("button")) moreMenu.open = false; });
    document.addEventListener("click", event => { if (moreMenu.open && !moreMenu.contains(event.target)) moreMenu.open = false; });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && moreMenu.open) { moreMenu.open = false; moreMenu.querySelector("summary").focus(); }
    });

    /* ---------- 单题计时 ----------
       每道题单独累计作答用时。页面不可见、手动暂停或切到别的题时不计，提交后定格。
       和学习时长一样只存在本机：不进云端 DTO，也不参与合并。空白重做每次从零开始，
       不落盘。模考有自己的模块计时，不用这个。 */
    const QUESTION_TIME_KEY = "sat-learning:question-time:v1";
    const QUESTION_TIME_LIMIT = 6000;
    // questionTimes only caches the stored table for painting. Every change re-reads the
    // table as it is stored now and applies this tab's own change to it, so two open tabs
    // add up instead of writing back each other's stale copy.
    let questionTimes = null, questionTimesOwner = "";
    let timerKey = "", timerStartedAt = 0, timerPaused = false, timerFrozen = false, timerSavedAt = 0;
    // Blank-redo times live in this tab only. Folded time a write has not stored yet waits
    // in timeUnsaved for the owner it was spent under, and is never written for another.
    let redoTimes = {}, timeUnsaved = { token: "", times: {} };

    function storedQuestionTimes() {
      const times = {};
      try {
        const stored = asRecord(JSON.parse(learningStorage.getItem(QUESTION_TIME_KEY) || "null"));
        for (const [key, value] of Object.entries(asRecord(stored.times))) {
          if (value && Number.isFinite(value.ms) && value.ms >= 0) {
            times[key] = { ms: Math.floor(value.ms), at: typeof value.at === "string" ? value.at : "" };
          }
        }
      } catch {}
      return times;
    }

    function readQuestionTimes() {
      const owner = learningStorage.token();
      if (!questionTimes || questionTimesOwner !== owner) {
        questionTimes = storedQuestionTimes();
        questionTimesOwner = owner;
      }
      return questionTimes;
    }

    // Apply `change` to the stored table and write it back; the cache becomes what was written.
    function changeQuestionTimes(change) {
      if (!learningStorage.ready()) return false;
      const owner = learningStorage.token();
      try {
        const times = storedQuestionTimes(), kept = {};
        change(times);
        // Only one practice session exists at a time, so another session's times are stale.
        const session = practiceSession ? `s:${practiceSession.id}:` : "";
        let keys = Object.keys(times).filter(key => !key.startsWith("r:") && (!key.startsWith("s:") || (session && key.startsWith(session))));
        if (keys.length > QUESTION_TIME_LIMIT) {
          keys = keys.sort((left, right) => times[left].at.localeCompare(times[right].at)).slice(-QUESTION_TIME_LIMIT);
        }
        for (const key of keys) kept[key] = times[key];
        learningStorage.setItem(QUESTION_TIME_KEY, JSON.stringify({ version: 1, times: kept }));
        questionTimes = kept;
        questionTimesOwner = owner;
        timerSavedAt = Date.now();
        return true;
      } catch { return false; }
    }

    // Write what is waiting, for its own owner only; keep it for a later try when the write fails.
    function saveQuestionTimes() {
      if (!timeUnsaved.token || !learningStorage.isCurrent(timeUnsaved.token)) { timeUnsaved = { token: "", times: {} }; return false; }
      const waiting = timeUnsaved.times;
      if (!Object.keys(waiting).length) return true;
      const saved = changeQuestionTimes(times => {
        for (const [key, ms] of Object.entries(waiting)) {
          const entry = times[key] || (times[key] = { ms: 0, at: "" });
          entry.ms += ms;
          entry.at = nowIso();
        }
      });
      if (saved) timeUnsaved.times = {};
      return saved;
    }

    function addQuestionTime(key, ms) {
      if (!key || ms <= 0) return;
      if (key.startsWith("r:")) {
        const entry = redoTimes[key] || (redoTimes[key] = { ms: 0, at: "" });
        entry.ms += ms;
        entry.at = nowIso();
        return;
      }
      if (!learningStorage.ready()) return;
      const owner = learningStorage.token();
      if (timeUnsaved.token !== owner) timeUnsaved = { token: owner, times: {} };
      timeUnsaved.times[key] = (timeUnsaved.times[key] || 0) + ms;
    }

    function questionTimerKey(question) {
      if (!question || requestedExamMode) return "";
      const id = question.question_id;
      if (practiceSession && practiceSession.questions.some(item => item.questionId === id)) return `s:${practiceSession.id}:${id}`;
      return redoMode && id === redoQuestionId ? `r:${id}` : `q:${id}`;
    }

    function questionTimerElapsed() {
      if (!timerKey) return 0;
      const stored = timerKey.startsWith("r:") ? redoTimes[timerKey] : readQuestionTimes()[timerKey];
      const waiting = learningStorage.isCurrent(timeUnsaved.token) ? timeUnsaved.times[timerKey] || 0 : 0;
      return (stored ? stored.ms : 0) + waiting + (timerStartedAt ? Math.max(0, Date.now() - timerStartedAt) : 0);
    }

    // Fold the stretch that is running into the question's total.
    function holdQuestionTimer({ save = true } = {}) {
      if (timerKey && timerStartedAt) {
        addQuestionTime(timerKey, Math.max(0, Date.now() - timerStartedAt));
        timerStartedAt = 0;
      }
      if (save) saveQuestionTimes();
    }

    function runQuestionTimer() {
      if (timerKey && !timerFrozen && !timerPaused && !timerStartedAt && document.visibilityState === "visible") {
        timerStartedAt = Date.now();
      }
    }

    function restartQuestionTimer(keys) {
      for (const key of keys) {
        delete redoTimes[key];
        delete timeUnsaved.times[key];
        if (key === timerKey) timerStartedAt = 0;
      }
      saveQuestionTimes();
      changeQuestionTimes(times => { for (const key of keys) delete times[key]; });
    }

    function formatQuestionTime(ms) {
      const total = Math.floor(ms / 1000), pad = value => String(value).padStart(2, "0");
      const hours = Math.floor(total / 3600), clock = `${pad(Math.floor(total % 3600 / 60))}:${pad(total % 60)}`;
      return hours ? `${hours}:${clock}` : clock;
    }

    function paintQuestionTimer() {
      const elapsed = questionTimerElapsed();
      // A question answered before timing existed has nothing to show.
      const shown = Boolean(timerKey) && !(timerFrozen && elapsed < 1000);
      els.questionTimer.hidden = !shown;
      if (!shown) return;
      els.questionTimer.classList.toggle("paused", timerPaused && !timerFrozen);
      els.questionTimer.classList.toggle("done", timerFrozen);
      els.questionTimerValue.textContent = (timerFrozen ? "用时 " : "") + formatQuestionTime(elapsed);
      els.questionTimerToggle.hidden = timerFrozen;
      els.questionTimerToggle.textContent = timerPaused ? "继续" : "暂停";
      els.questionTimerToggle.setAttribute("aria-pressed", String(timerPaused));
    }

    function syncQuestionTimer(question, qs) {
      const key = questionTimerKey(question);
      if (key !== timerKey) {
        holdQuestionTimer();
        timerKey = key;
        timerPaused = false;
      }
      timerFrozen = Boolean(qs && qs.submitted);
      if (timerFrozen) holdQuestionTimer();
      else runQuestionTimer();
      paintQuestionTimer();
    }

    els.questionTimerToggle.addEventListener("click", () => {
      if (timerFrozen) return;
      if (timerPaused) { timerPaused = false; runQuestionTimer(); }
      else { holdQuestionTimer(); timerPaused = true; }
      paintQuestionTimer();
    });
    setInterval(() => {
      if (!timerStartedAt) return;
      if (Date.now() - timerSavedAt > 15000) { holdQuestionTimer(); runQuestionTimer(); }
      paintQuestionTimer();
    }, 1000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") holdQuestionTimer();
      else runQuestionTimer();
      paintQuestionTimer();
    });
    window.addEventListener("pagehide", () => holdQuestionTimer());
    // Before the owner changes: the running stretch is the old owner's. It is written for that
    // owner (or dropped when its identity failed); the next owner's timer starts from its own records.
    learningStorage.onOwnerChange(({ settle }) => {
      if (timerKey && timerStartedAt) addQuestionTime(timerKey, Math.max(0, Date.now() - timerStartedAt));
      timerStartedAt = 0;
      if (settle) saveQuestionTimes();
      timeUnsaved = { token: "", times: {} };
      redoTimes = {};
      questionTimes = null;
    });

    // Whether the list is shown is a per-tab view preference, kept out of the learning store.
    const QUESTION_LIST_VIEW_KEY = "sat-ui:question-list";
    let questionListOpen = true;
    try { questionListOpen = sessionStorage.getItem(QUESTION_LIST_VIEW_KEY) !== "closed"; } catch {}
    function setQuestionListOpen(open) {
      questionListOpen = open;
      try { sessionStorage.setItem(QUESTION_LIST_VIEW_KEY, open ? "open" : "closed"); } catch {}
      renderQuestionList();
    }
    els.questionListBtn.addEventListener("click", () => setQuestionListOpen(!questionListOpen));
    els.questionListCollapse.addEventListener("click", () => {
      setQuestionListOpen(false);
      els.questionListBtn.focus();
    });

    let questionListCurrent = -1, questionListEntries = [];
    function renderQuestionList(currentState) {
      const entries = requestedExamMode || (activeSessionId && !practiceSession) ? [] : navigatorEntries(currentState);
      const available = entries.length > 0;
      const open = available && questionListOpen;
      questionListEntries = entries;
      els.questionListBtn.hidden = !available;
      els.questionListBtn.setAttribute("aria-pressed", String(open));
      els.questionList.hidden = !open;
      els.practiceLayout.classList.toggle("has-question-list", open);
      if (!open) { questionListCurrent = -1; return; }
      if (els.questionListItems.children.length !== entries.length) {
        els.questionListItems.innerHTML = "";
        entries.forEach((entry, index) => {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          button.className = "qlist-item";
          button.dataset.questionListIndex = String(index);
          button.addEventListener("click", () => { if (questionListEntries[index]) questionListEntries[index].go(); });
          item.appendChild(button);
          els.questionListItems.appendChild(item);
        });
        questionListCurrent = -1;
      }
      let answered = 0, active = -1;
      entries.forEach((entry, index) => {
        if (entry.checked || entry.selected) answered += 1;
        if (entry.isCurrent) active = index;
        const button = els.questionListItems.children[index].firstElementChild;
        button.classList.toggle("current", entry.isCurrent);
        button.classList.toggle("selected", entry.selected && !entry.checked);
        button.classList.toggle("correct", entry.checked && entry.correct);
        button.classList.toggle("incorrect", entry.checked && !entry.correct);
        button.innerHTML = `${index + 1}${entry.starred ? '<span class="star" aria-hidden="true">★</span>' : ""}`;
        button.setAttribute("aria-label", overviewLabel(null, entry, index));
        if (entry.isCurrent) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      });
      els.questionListSummary.textContent = `${entries[0].inSession ? "本次练习 · " : ""}已答 ${answered}/${entries.length}`;
      if (questionListCurrent !== active) {
        questionListCurrent = active;
        const list = els.questionList, target = els.questionListItems.children[active];
        if (target && list.scrollHeight > list.clientHeight) {
          const top = target.getBoundingClientRect().top - list.getBoundingClientRect().top + list.scrollTop, bottom = top + target.offsetHeight;
          if (top < list.scrollTop + 80) list.scrollTop = Math.max(0, top - 90);
          else if (bottom > list.scrollTop + list.clientHeight - 12) list.scrollTop = bottom - list.clientHeight + 20;
        }
      }
    }

    function renderStimulus(value) {
      const text = String(value || "").trim();
      if (!text) return "";
      return text
        .split(/\n{2,}/)
        .map(block => block.trim())
        .filter(Boolean)
        .map(renderStimulusBlock)
        .join("");
    }

    function normalizeTableDataForDisplay(value) {
      const table = asRecord(value);
      const owns = key => Object.prototype.hasOwnProperty.call(table, key);
      if ((owns("headers") && !Array.isArray(table.headers))
        || (owns("columns") && !Array.isArray(table.columns))
        || !Array.isArray(table.rows)) return null;
      const headers = Array.isArray(table.headers) ? table.headers : [];
      const columns = Array.isArray(table.columns) ? table.columns : [];
      const rows = Array.isArray(table.rows) ? table.rows : [];
      const scalar = cell => ["string", "number", "boolean"].includes(typeof cell)
        && (typeof cell !== "number" || Number.isFinite(cell));
      if (headers.length && columns.length && JSON.stringify(headers) !== JSON.stringify(columns)) return null;
      const selectedHeaders = headers.length ? headers : columns;
      if (!selectedHeaders.length || !rows.length || !selectedHeaders.every(scalar)) return null;
      if (!rows.every(row => Array.isArray(row) && row.length === selectedHeaders.length && row.every(scalar))) return null;
      if (table.title !== undefined && typeof table.title !== "string") return null;
      return { title: String(table.title || ""), headers: selectedHeaders, rows };
    }

    function renderTableData(value) {
      const table = normalizeTableDataForDisplay(value);
      if (!table) {
        console.error("[sat visual] malformed table_data rejected");
        return '<div class="visual-render-error" role="alert" data-visual-error="table">表格数据无法安全显示，本题已停止渲染该表格，请反馈给教师。</div>';
      }
      const head = "<thead><tr>" + table.headers.map(cell => "<th scope=\"col\">" + escapeHtml(String(cell)) + "</th>").join("") + "</tr></thead>";
      const body = "<tbody>" + table.rows.map(row => "<tr>" + row.map(cell => "<td>" + escapeHtml(String(cell)) + "</td>").join("") + "</tr>").join("") + "</tbody>";
      const caption = table.title ? "<caption>" + escapeHtml(table.title) + "</caption>" : "";
      return "<table class=\"data-table\">" + caption + head + body + "</table>";
    }

    function visualDimensionAttributes(asset) {
      const width = Number(asset && asset.width);
      const height = Number(asset && asset.height);
      return Number.isInteger(width) && width > 0 && Number.isInteger(height) && height > 0
        ? ` width="${width}" height="${height}"`
        : "";
    }

    function visualAltText(asset, fallback) {
      return String(asset && (asset.alt_text || asset.title) || fallback || "").trim().slice(0, 300);
    }

    function renderVisualAssets(question) {
      const assets = Array.isArray(question.visual_assets) ? question.visual_assets : [];
      if (!assets.length && !question.table_data && !question.chart_image_data_uri) return "";
      const parts = [];
      // Structured tables are the primary representation. Malformed shapes are
      // rejected visibly instead of silently dropping headers or truncating rows.
      if (question.table_data) parts.push(renderTableData(question.table_data));
      // Visual assets: chart/graph get compact crop; table gets optional collapsible reference
      for (const asset of assets) {
        let compactSrc = asset.image_data_uri || "";
        let fullSrc = asset.material_panel_crop_data_uri || asset.image_data_uri || "";
        let isTable = asset.type === "table";
        let isChart = asset.type === "graph" || asset.type === "chart";
        const dimensions = visualDimensionAttributes(asset);
        // Use compact crop for charts, full panel only as collapsible
        if (compactSrc) {
          parts.push("<div class=\"visual-asset-wrap\">");
          if (isChart) {
            // Chart: compact display with max-height, click to zoom
            const alt = visualAltText(asset, "题目图表");
            parts.push("<div class=\"chart-image-wrap\"><img class=\"chart-image visual-asset\" loading=\"lazy\" decoding=\"async\"" + dimensions + " src=\"" + escapeHtml(compactSrc) + "\" alt=\"" + escapeHtml(alt) + "\" aria-label=\"" + escapeHtml(alt + "，按回车键打开大图") + "\" role=\"button\" style=\"max-height:400px;max-width:100%;width:auto;object-fit:contain;cursor:pointer;\" onclick=\"openChartLightbox(this)\" tabindex=\"0\"></div>");
            // If full panel crop available, show as collapsible
            if (fullSrc && fullSrc !== compactSrc) {
              parts.push("<details style=\"margin-top:8px\"><summary style=\"cursor:pointer;font-size:13px;color:var(--sat-text-muted)\">Show full stimulus panel</summary>");
              parts.push("<img class=\"visual-asset\" loading=\"lazy\" decoding=\"async\" src=\"" + escapeHtml(fullSrc) + "\" alt=\"完整题目材料面板\" aria-label=\"完整题目材料面板，按回车键打开大图\" role=\"button\" style=\"max-height:600px;max-width:100%;width:auto;object-fit:contain;margin-top:8px\" onclick=\"openChartLightbox(this)\" tabindex=\"0\">");
              parts.push("</details>");
            }
          } else if (isTable) {
            // Table: show as collapsible reference crop (primary display is HTML table from table_data)
            parts.push("<details style=\"margin-top:8px\"><summary style=\"cursor:pointer;font-size:13px;color:var(--sat-text-muted)\">Show original table image</summary>");
            parts.push("<img class=\"visual-asset\" loading=\"lazy\" decoding=\"async\"" + dimensions + " src=\"" + escapeHtml(fullSrc) + "\" alt=\"原始表格图像\" aria-label=\"原始表格图像，按回车键打开大图\" role=\"button\" style=\"max-height:500px;max-width:100%;width:auto;object-fit:contain;margin-top:8px\" onclick=\"openChartLightbox(this)\" tabindex=\"0\">");
            parts.push("</details>");
          } else {
            // Figure or other: show normally with max-height
            const alt = visualAltText(asset, "题目视觉材料");
            parts.push("<img class=\"visual-asset\" loading=\"lazy\" decoding=\"async\"" + dimensions + " src=\"" + escapeHtml(compactSrc) + "\" alt=\"" + escapeHtml(alt) + "\" aria-label=\"" + escapeHtml(alt + "，按回车键打开大图") + "\" role=\"button\" style=\"max-height:400px;max-width:100%;width:auto;object-fit:contain;cursor:pointer;\" onclick=\"openChartLightbox(this)\" tabindex=\"0\">");
          }
          if (asset.title && !isTable) parts.push("<p class=\"asset-caption\" style=\"font-size:12px;color:var(--sat-text-muted);margin-top:4px\">" + escapeHtml(asset.title) + "</p>");
          parts.push("</div>");
        }
      }
      return parts.join("");
    }

    function renderChartImage(question) {
      if (!question.chart_image || !question.chart_image_data_uri) return "";
      const width = Number(question.chart_image_width || 0);
      const height = Number(question.chart_image_height || 0);
      const dimensions = width > 0 && height > 0 ? ` width="${width}" height="${height}"` : "";
      const alt = String(question.chart_alt_text || question.public_visual_alt_text || `SAT 第 ${question.question_number || ""} 题图表，具体数据见图中标签`).trim();
      return `<div class="chart-image-wrap"><img class="chart-image visual-asset" loading="lazy" decoding="async"${dimensions} src="${escapeHtml(question.chart_image_data_uri)}" alt="${escapeHtml(alt)}" aria-label="${escapeHtml(alt + "，按回车键打开大图")}" role="button" style="max-height:400px;max-width:100%;width:auto;object-fit:contain;cursor:pointer;" onclick="openChartLightbox(this)" tabindex="0"></div>`;
    }

    let chartLightboxReturnTarget = null;
    function openChartLightbox(image) {
      chartLightboxReturnTarget = image instanceof HTMLElement ? image : null;
      els.chartLightboxImage.src = image.src;
      els.chartLightboxImage.alt = image.alt || "题目图表大图";
      els.chartLightbox.classList.add("visible");
      els.chartLightbox.setAttribute("aria-hidden", "false");
      els.chartLightboxClose.focus();
    }

    function closeChartLightbox() {
      els.chartLightbox.classList.remove("visible");
      els.chartLightbox.setAttribute("aria-hidden", "true");
      els.chartLightboxImage.src = "";
      if (chartLightboxReturnTarget && document.contains(chartLightboxReturnTarget)) chartLightboxReturnTarget.focus();
      chartLightboxReturnTarget = null;
    }

    function renderStimulusBlock(block) {
      const lines = block.split(/\n/).map(line => line.trim()).filter(Boolean);
      if (!lines.length) return "";
      if (lines.length === 1 && /^Text [12]\b/.test(lines[0])) {
        return `<p class="text-heading"><strong>${escapeHtml(lines[0])}</strong></p>`;
      }
      if (lines.every(line => line.startsWith("• "))) {
        const items = lines
          .map(line => `<li>${formatStimulusInline(line.slice(2))}</li>`)
          .join("");
        return `<ul>${items}</ul>`;
      }
      if (lines.length > 1 && lines.every(line => line.includes("|"))) {
        return renderDataTable(lines);
      }
      return `<p>${lines.map(formatStimulusInline).join("<br>")}</p>`;
    }

    function renderDataTable(lines) {
      const rows = lines.map((line, rowIndex) => {
        const cells = line.split("|").map(cell => cell.trim());
        const tag = rowIndex === 0 ? "th" : "td";
        return `<tr>${cells.map(cell => `<${tag}>${formatStimulusInline(cell)}</${tag}>`).join("")}</tr>`;
      }).join("");
      return `<table class="data-table">${rows}</table>`;
    }

    function formatStimulusInline(value) {
      return escapeHtml(value)
        .replace(/_{4,}/g, match => `<span class="blank">${match}</span>`)
        .replace(/\[u\]([\s\S]*?)\[\/u\]/g, '<span class="underline">$1</span>')
        .replace(/\[i\]([\s\S]*?)\[\/i\]/g, '<em class="italic">$1</em>')
        .replace(/\[b\]([\s\S]*?)\[\/b\]/g, '<strong>$1</strong>');
    }

    function renderReflection(qs) {
      if (redoMode) return;
      els.reflectionPanel.classList.toggle("is-submitted", Boolean(qs.submitted));
      els.reflectionPanel.classList.toggle("is-correct", Boolean(qs.submitted && qs.correct));
      document.querySelectorAll('input[name="confidence"]').forEach(input => {
        input.checked = input.value === qs.confidence;
        input.disabled = qs.submitted;
      });
      els.errorTagsRow.querySelectorAll('input[type="checkbox"]').forEach(input => {
        input.checked = (qs.errorTags || []).includes(input.value);
        input.disabled = !qs.submitted || qs.correct;
      });
      if (els.noteInput.value !== (qs.note || "")) els.noteInput.value = qs.note || "";
      els.reflectionHint.textContent = "";
    }

    /* ---------- 词汇解释与生词本 ---------- */
    // The explanations this page's questions use, written by the builder from content/db.
    function readPageVocabulary() {
      const node = document.getElementById("satPageVocabulary");
      const raw = node ? String(node.textContent || "").trim() : "";
      if (!raw || raw === "__PAGE_" + "VOCABULARY_JSON__") return {};
      try { return asRecord(JSON.parse(raw)); } catch { return {}; }
    }
    const PAGE_VOCABULARY = readPageVocabulary();
    // The same pattern scripts/content_db.py uses to find a question's words.
    const GLOSS_WORD_RE = /[A-Za-z][A-Za-z'’\-]*[A-Za-z]|[A-Za-z]/g;
    let glossAnchor = null, glossPanelOpen = false, vocabularyFlashTimer = null;

    function glossEntry(id) {
      const entry = PAGE_VOCABULARY[id];
      return entry && typeof entry === "object" ? { id, ...entry } : null;
    }

    // surface -> explanation id for the words of one field the learner may open now.
    // The answer choices, and the word a "most nearly mean" question asks about, open after submitting.
    function openGlosses(question, field, qs) {
      const words = new Map();
      for (const link of Array.isArray(question.vocabulary) ? question.vocabulary : []) {
        if (link.field !== field || !glossEntry(link.id)) continue;
        if (link.reveal === "always" || qs.submitted) words.set(link.surface, link.id);
      }
      return words;
    }

    function markGlosses(root, words) {
      if (!words.size) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        if (node.parentElement?.closest(".gloss,button,summary,svg")) continue;
        const text = node.nodeValue || "";
        let last = 0, fragment = null;
        GLOSS_WORD_RE.lastIndex = 0;
        for (let match; (match = GLOSS_WORD_RE.exec(text));) {
          const id = words.get(match[0]);
          if (!id) continue;
          fragment = fragment || document.createDocumentFragment();
          fragment.append(text.slice(last, match.index));
          const span = document.createElement("span");
          span.className = "gloss";
          span.dataset.gloss = id;
          span.setAttribute("role", "button");
          span.setAttribute("aria-haspopup", "dialog");
          span.setAttribute("aria-expanded", "false");
          span.tabIndex = 0;
          span.textContent = match[0];
          fragment.append(span);
          last = match.index + match[0].length;
        }
        if (!fragment) continue;
        fragment.append(text.slice(last));
        node.replaceWith(fragment);
      }
    }

    // English first: the examples are open, the Chinese stays folded until asked for and
    // brings the translation of every example with it. `chinese` opens that layer from the start.
    function glossBodyHtml(entry, { chinese = false } = {}) {
      const examples = (Array.isArray(entry.examples) ? entry.examples : []).map(example =>
        `<li><p class="gloss-example">${escapeHtml(example.english)}</p><p class="gloss-example-zh">${escapeHtml(example.chinese)}</p></li>`).join("");
      return `<div class="gloss-body${chinese ? " zh-open" : ""}">
        <p class="gloss-english">${escapeHtml(entry.english)}</p>
        <details class="gloss-layer" open><summary>例句</summary><ol class="gloss-examples">${examples}</ol></details>
        <details class="gloss-layer gloss-chinese"${chinese ? " open" : ""}><summary>中文解释</summary><p>${escapeHtml(entry.chinese)}</p></details>
        ${satDictionaryLayerHtml(entry.word, escapeHtml, "gloss-layer")}
        <button type="button" class="gloss-save" data-gloss-save="${escapeHtml(entry.id)}" aria-pressed="false">加入生词本</button>
      </div>`;
    }

    // A layer of a word card was opened or folded: show the translations with the Chinese
    // layer, and look the word up when the dictionary layer opens for the first time.
    function onGlossLayerToggle(event) {
      const layer = event.target;
      if (layer.classList?.contains("gloss-chinese")) layer.closest(".gloss-body")?.classList.toggle("zh-open", layer.open);
      if (layer.classList?.contains("sat-dictionary")) satFillDictionaryLayer(layer, escapeHtml).then(placeGloss);
    }

    // The sentence the word stands in, kept with the word in the notebook.
    function glossContext(anchor) {
      const block = anchor.closest("p,li,td,th,blockquote") || anchor.parentElement;
      const text = String(block?.textContent || "").replace(/\s+/g, " ").trim();
      const at = text.indexOf(anchor.textContent || "");
      if (at < 0) return "";
      const before = text.slice(0, at);
      const start = Math.max(before.lastIndexOf(". "), before.lastIndexOf("? "), before.lastIndexOf("! ")) + 1;
      const end = text.slice(at).search(/[.?!](\s|$)/);
      return text.slice(start, end < 0 ? text.length : at + end + 1).trim().slice(0, 400);
    }

    function closeGloss({ restoreFocus = false } = {}) {
      if (els.glossPopover.hidden) return;
      els.glossPopover.hidden = true;
      els.glossPopover.innerHTML = "";
      if (glossAnchor) {
        glossAnchor.setAttribute("aria-expanded", "false");
        if (restoreFocus && glossAnchor.isConnected) glossAnchor.focus();
      }
      glossAnchor = null;
    }

    function placeGloss() {
      if (!glossAnchor || els.glossPopover.hidden) return;
      if (!glossAnchor.isConnected) { closeGloss(); return; }
      const rect = glossAnchor.getBoundingClientRect(), card = els.glossPopover, margin = 12;
      const floor = window.innerHeight - (els.practiceNav.hidden ? 0 : els.practiceNav.offsetHeight) - margin;
      const width = card.offsetWidth, height = card.offsetHeight;
      const left = Math.min(Math.max(margin, rect.left + rect.width / 2 - width / 2), window.innerWidth - width - margin);
      const below = rect.bottom + 8, above = rect.top - height - 8;
      const top = below + height <= floor || above < margin ? below : above;
      card.style.left = `${Math.round(Math.max(margin, left))}px`;
      card.style.top = `${Math.round(Math.max(margin, Math.min(top, floor - height)))}px`;
    }

    function openGloss(anchor) {
      const entry = glossEntry(anchor.dataset.gloss);
      if (!entry) return;
      if (glossAnchor === anchor) { closeGloss(); return; }
      closeGloss();
      glossAnchor = anchor;
      anchor.setAttribute("aria-expanded", "true");
      els.glossPopover.innerHTML = `
        <div class="gloss-head"><strong class="gloss-word">${escapeHtml(entry.word)}</strong><span class="gloss-pos">${escapeHtml(entry.partOfSpeech)}</span><button type="button" class="gloss-close" aria-label="关闭词汇解释">×</button></div>
        ${glossBodyHtml(entry)}`;
      els.glossPopover.dataset.context = glossContext(anchor);
      els.glossPopover.hidden = false;
      refreshGlossSaved();
      placeGloss();
    }

    // Every explained word of the question in reading order: passage, prompt, then the choices.
    function glossReadingOrder(question, qs) {
      const ids = [], fromChoices = new Set();
      [els.stimulus, els.prompt].forEach(root => root.querySelectorAll(".gloss[data-gloss]").forEach(node => {
        if (glossEntry(node.dataset.gloss) && !ids.includes(node.dataset.gloss)) ids.push(node.dataset.gloss);
      }));
      const inChoices = openGlosses(question, "choices", qs);
      for (const choice of question.choices || []) {
        for (const word of String(choice.text || "").replace(/\[\/?[A-Za-z]+\]/g, " ").match(GLOSS_WORD_RE) || []) {
          const id = inChoices.get(word);
          if (!id || ids.includes(id)) continue;
          ids.push(id);
          fromChoices.add(id);
        }
      }
      return { ids, fromChoices };
    }

    // After submitting: one row per word, each opening on its own.
    function renderGlossPanel(question, qs) {
      const { ids, fromChoices } = qs.submitted ? glossReadingOrder(question, qs) : { ids: [], fromChoices: new Set() };
      if (!ids.length) {
        els.glossPanel.hidden = true;
        els.glossPanel.innerHTML = "";
        return;
      }
      const signature = question.question_id + "|" + ids.join(",");
      if (els.glossPanel.dataset.signature === signature && !els.glossPanel.hidden) return;
      els.glossPanel.dataset.signature = signature;
      els.glossPanel.hidden = false;
      els.glossPanel.innerHTML = `<details class="gloss-list"${glossPanelOpen ? " open" : ""}>
        <summary>本题词汇<span class="gloss-count">${ids.length}</span></summary>
        ${ids.map(id => {
          const entry = glossEntry(id);
          return `<details class="gloss-row"><summary><strong>${escapeHtml(entry.word)}</strong><span class="gloss-pos">${escapeHtml(entry.partOfSpeech)}</span>${fromChoices.has(id) ? '<span class="gloss-tag">选项</span>' : ""}</summary>${glossBodyHtml(entry, { chinese: true })}</details>`;
        }).join("")}
        <div class="gloss-list-foot"><a href="../index.html#vocabulary">打开生词本</a></div>
      </details>`;
    }

    function refreshGlossSaved() {
      const saved = new Set(readSatVocabulary(learningStorage).map(item => satVocabularyKey(item.word)));
      const isSaved = id => { const entry = glossEntry(id); return Boolean(entry && saved.has(satVocabularyKey(entry.word))); };
      document.querySelectorAll(".gloss[data-gloss]").forEach(node => node.classList.toggle("is-saved", isSaved(node.dataset.gloss)));
      document.querySelectorAll("[data-gloss-save]").forEach(button => {
        const on = isSaved(button.dataset.glossSave);
        button.classList.toggle("is-saved", on);
        button.setAttribute("aria-pressed", String(on));
        button.textContent = on ? "已在生词本 · 移出" : "加入生词本";
      });
    }

    function syncGlosses(question, qs) {
      markGlosses(els.stimulus, openGlosses(question, "passage", qs));
      markGlosses(els.prompt, openGlosses(question, "prompt", qs));
      renderGlossPanel(question, qs);
      refreshGlossSaved();
    }

    function vocabularyRecord(entry, context) {
      const question = currentQuestion();
      const example = (Array.isArray(entry.examples) && entry.examples[0]) || {};
      return { word: entry.word, partOfSpeech: entry.partOfSpeech, english: entry.english, chinese: entry.chinese,
        example: example.english || "", exampleChinese: example.chinese || "", vocabId: entry.id, context: context || "",
        questionId: question ? question.question_id : "", route: PAGE_ID + ".html", custom: false };
    }

    function toggleGlossWord(id, context) {
      const entry = glossEntry(id);
      if (!entry) return;
      if (hasSatVocabularyWord(learningStorage, entry.word)) removeSatVocabularyWord(learningStorage, entry.word);
      else saveSatVocabularyWord(learningStorage, vocabularyRecord(entry, context));
      refreshGlossSaved();
    }

    function flashVocabularyButton(text) {
      clearTimeout(vocabularyFlashTimer);
      els.vocabularyBtn.textContent = text;
      vocabularyFlashTimer = setTimeout(() => { els.vocabularyBtn.textContent = "加入生词本"; }, 1800);
    }

    // Any word the learner selects can go into the notebook; one that has an
    // explanation open to the learner takes it along.
    function addSelectionToVocabulary() {
      const selection = window.getSelection();
      const text = String(selection || "").replace(/\s+/g, " ").trim();
      const inside = node => Boolean(node) && [els.stimulus, els.prompt, els.choices].some(root => root.contains(node));
      if (!text || text.length > 40 || !/^[A-Za-z][A-Za-z'’\- ]*$/.test(text) || !inside(selection.anchorNode)) {
        flashVocabularyButton("请先选中单词");
        return;
      }
      const question = currentQuestion(), qs = activeState(question);
      const link = (Array.isArray(question.vocabulary) ? question.vocabulary : []).find(item =>
        item.surface === text && glossEntry(item.id) && (item.reveal === "always" || qs.submitted));
      const word = text.slice(1) === text.slice(1).toLowerCase() ? text.toLowerCase() : text;
      const anchorBlock = selection.anchorNode.parentElement;
      const context = anchorBlock ? glossContext({ closest: selector => anchorBlock.closest(selector), parentElement: anchorBlock, textContent: text }) : "";
      const saved = link
        ? saveSatVocabularyWord(learningStorage, vocabularyRecord(glossEntry(link.id), context))
        : saveSatVocabularyWord(learningStorage, { word, context, questionId: question.question_id, route: PAGE_ID + ".html", custom: true });
      selection.removeAllRanges();
      flashVocabularyButton(saved ? `已加入：${link ? glossEntry(link.id).word : word}` : "没有保存成功");
      refreshGlossSaved();
    }

    function applyHighlights(snippets) {
      const values = uniqueStrings(snippets).filter(value => value.length >= 2);
      if (!values.length) return;
      const walker = document.createTreeWalker(els.stimulus, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        if (node.parentElement?.closest("mark,button,summary")) continue;
        let html = escapeHtml(node.nodeValue || "");
        let changed = false;
        for (const snippet of values) {
          const escaped = escapeHtml(snippet);
          if (!escaped || !html.includes(escaped)) continue;
          html = html.replaceAll(escaped, `<mark class="highlight-mark">${escaped}</mark>`);
          changed = true;
        }
        if (!changed) continue;
        const span = document.createElement("span");
        span.innerHTML = html;
        node.replaceWith(...span.childNodes);
      }
    }

    function addSelectionHighlight() {
      if (redoMode) return;
      const selection = window.getSelection();
      const text = String(selection || "").trim().replace(/\s+/g, " ");
      if (!text || text.length < 2 || text.length > 500 || !els.stimulus.contains(selection.anchorNode)) {
        els.reflectionHint.textContent = "请先在左侧正文中选择一段不超过 500 字符的文本。";
        return;
      }
      const qs = qState(currentQuestion());
      qs.highlights = uniqueStrings([...(qs.highlights || []), text]);
      qs.updatedAt = nowIso();
      selection.removeAllRanges();
      saveState();
      render();
    }

    function addDays(iso, days) {
      const date = new Date(iso || Date.now());
      date.setDate(date.getDate() + days);
      return date.toISOString();
    }

    function updateReviewSchedule(qs, isRedo, attemptCorrect = qs.correct) {
      if (!isRedo) {
        if (!attemptCorrect || ["unsure", "guess"].includes(qs.confidence)) {
          qs.mastered = false;
          qs.masteredAt = null;
          qs.reviewStage = 0;
          qs.nextDueAt = addDays(nowIso(), 1);
        }
        return;
      }
      if (!attemptCorrect) {
        qs.mastered = false;
        qs.masteredAt = null;
        qs.reviewStage = 0;
        qs.nextDueAt = addDays(nowIso(), 1);
        return;
      }
      if (qs.nextDueAt && timeOf(qs.nextDueAt) > Date.now()) return;
      const nextStage = Math.min(3, Number(qs.reviewStage || 0) + 1);
      qs.reviewStage = nextStage;
      qs.mastered = nextStage >= 3;
      qs.masteredAt = qs.mastered ? nowIso() : null;
      qs.nextDueAt = qs.mastered ? null : addDays(nowIso(), [3, 7][nextStage - 1]);
    }

    function createAttempt(question, qs, mode) {
      const attempt = {
        attemptId: `sat-${Date.now()}-${Math.random().toString(16).slice(2)}`,
        questionId: question.question_id,
        pageId: PAGE_ID,
        mode,
        selected: qs.selected,
        correct: qs.correct,
        confidence: qs.confidence || "",
        submittedAt: qs.submittedAt,
        revealed: false,
        revealedAt: null,
        skill: question.classification?.skill || "",
        subtype: question.classification?.subtype || "未细分",
        sourceSet: question._source_set || question.source_set || "",
        reviewStage: Number(qs.reviewStage || 0),
        nextDueAt: qs.nextDueAt || null,
        mastered: Boolean(qs.mastered),
        masteredAt: qs.masteredAt || null,
        contentVersion: "sat-learning-v2",
        gradingRevision: question.gradingRevision || ""
      };
      globalState.attempts = compactAttempts([
        ...(Array.isArray(globalState.attempts) ? globalState.attempts : []),
        attempt
      ]);
      return attempt;
    }

    function upsertAttemptOutboxBestEffort(attempt) {
      try {
        const outbox = loadAttemptOutbox();
        const pending = outbox.find(item => item.attemptId === attempt.attemptId);
        if (pending) Object.assign(pending, attempt);
        else outbox.push({ ...attempt });
        if (!writeLocalJson(OUTBOX_KEY, outbox)) {
          const volatilePending = volatileAttemptOutbox.find(item => item.attemptId === attempt.attemptId);
          if (volatilePending) Object.assign(volatilePending, attempt);
          else volatileAttemptOutbox.push({ ...attempt });
          setSyncStatus("作答结果已显示，保存将在稍后重试", "error");
          return false;
        }
        volatileAttemptOutbox = [];
        return true;
      } catch (error) {
        console.warn("[sat learning] attempt outbox persistence deferred", error);
        const volatilePending = volatileAttemptOutbox.find(item => item.attemptId === attempt.attemptId);
        if (volatilePending) Object.assign(volatilePending, attempt);
        else volatileAttemptOutbox.push({ ...attempt });
        setSyncStatus("作答结果已显示，保存将在稍后重试", "error");
        return false;
      }
    }

    function checkQuestion(question) {
      const qs = activeState(question);
      if (!qs.selected || qs.submitted) return false;
      const submittedAt = nowIso();
      qs.checked = true;
      qs.submitted = true;
      qs.revealed = false;
      qs.revealedAt = null;
      qs.gradingRevision = question.gradingRevision || "";
      qs.correct = qs.selected === question.correct_answer;
      qs.submittedAt = submittedAt;
      qs.lastAttemptAt = submittedAt;
      qs.updatedAt = submittedAt;
      qs.attemptCount = Number(qs.attemptCount || 0) + 1;
      if (!qs.correct && !qs.firstWrongAt) qs.firstWrongAt = submittedAt;
      if (redoMode) {
        const historical = normalizeQuestionState(globalState.questions[question.question_id], question);
        // The earlier answer on the question's own page is left alone, but a
        // first wrong answer given here still puts the question in the wrong-answer list.
        if (!qs.correct && !historical.firstWrongAt) historical.firstWrongAt = submittedAt;
        historical.lastRedoCorrect = qs.correct;
        historical.redoCount = Number(historical.redoCount || 0) + 1;
        historical.lastAttemptAt = submittedAt;
        historical.updatedAt = submittedAt;
        updateReviewSchedule(historical, true, qs.correct);
        globalState.questions[question.question_id] = historical;
        qs.reviewStage = historical.reviewStage;
        qs.nextDueAt = historical.nextDueAt;
        qs.mastered = historical.mastered;
      } else {
        updateReviewSchedule(qs, false);
        globalState.questions[question.question_id] = mergeQuestionState(globalState.questions[question.question_id], qs);
      }
      const attempt = createAttempt(question, qs, redoMode ? "blank_redo" : "practice");
      qs.lastAttemptId = attempt.attemptId;
      return attempt;
    }

    function reviewItems() {
      const items = [];
      QUESTIONS.forEach((question, index) => {
        const qs = state.answers[question.question_id]
          ? normalizeQuestionState(state.answers[question.question_id])
          : defaultQuestionState();
        const tags = [];
        if (qs.submitted && !qs.correct) tags.push("wrong");
        if (qs.starred) tags.push("starred");
        if (qs.note) tags.push("note");
        if (!tags.length) return;
        const explanation = question.explanation || {};
        const tableData = question.table_data ? normalizeTableDataForDisplay(question.table_data) : null;
        const visualAssets = (Array.isArray(question.visual_assets) ? question.visual_assets : []).map(asset => {
          const value = asRecord(asset);
          const copy = {
            type: ["graph", "chart", "table", "figure"].includes(value.type) ? value.type : "figure",
            alt_text: visualAltText(value, "题目视觉材料"),
            image_data_uri: typeof value.image_data_uri === "string" ? value.image_data_uri : "",
            width: Number.isInteger(Number(value.width)) && Number(value.width) > 0 ? Number(value.width) : null,
            height: Number.isInteger(Number(value.height)) && Number(value.height) > 0 ? Number(value.height) : null
          };
          if (typeof value.material_panel_crop_data_uri === "string" && value.material_panel_crop_data_uri) {
            copy.material_panel_crop_data_uri = value.material_panel_crop_data_uri;
          }
          return copy;
        }).filter(asset => asset.image_data_uri);
        items.push({
          question_id: question.question_id,
          question_number: question.question_number ?? index + 1,
          tags,
          student_answer: qs.selected || "",
          revealed: Boolean(qs.submitted && qs.revealed),
          correct_answer: qs.submitted && qs.revealed ? question.correct_answer || "" : "",
          passage: question.passage || "",
          prompt: question.prompt || "",
          choices: question.choices || [],
          ...(tableData ? { table_data: tableData } : {}),
          ...(question.chart_image && typeof question.chart_image_data_uri === "string" ? {
            chart_image: true,
            chart_image_data_uri: question.chart_image_data_uri,
            chart_image_width: Number(question.chart_image_width || 0),
            chart_image_height: Number(question.chart_image_height || 0),
            chart_alt_text: String(question.chart_alt_text || question.public_visual_alt_text || `SAT 第 ${question.question_number || index + 1} 题图表，具体数据见图中标签`)
          } : {}),
          ...(visualAssets.length ? { visual_assets: visualAssets } : {}),
          explanation: qs.submitted && qs.revealed ? explanation.detailed || explanation.short || "" : "",
          choice_analysis: qs.submitted && qs.revealed ? explanation.choice_analysis || {} : {},
          confidence: qs.confidence || "",
          error_tags: qs.errorTags || [],
          note: qs.note || "",
          skills_tested: question.skills_tested || [],
          difficulty_estimate: question.difficulty_estimate || ""
        });
      });
      return items;
    }

    function exportJson() {
      const payload = {
        export_type: "sat_practice_review_items",
        section: SECTION,
        title: SECTION_TITLE,
        generated_at: new Date().toISOString(),
        items: reviewItems()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      const safeTitle = SECTION_TITLE
        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "_")
        .replace(/\s+/g, " ")
        .trim();
      link.download = `${safeTitle || SECTION}_review_items.json`;
      link.click();
      URL.revokeObjectURL(url);
    }

      const tags = item.tags.map(tag => `<span class="tag ${tag}">${escapeHtml(tag)}</span>`).join("");
