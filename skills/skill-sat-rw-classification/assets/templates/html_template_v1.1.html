<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__SECTION_TITLE__</title>
  <style>
    .reset-confirm[hidden] { display: none; }
    .reset-confirm { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center; padding: 20px; background: rgba(20, 28, 38, .42); }
    .reset-confirm-card { width: min(420px, 100%); padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 16px 60px rgba(0,0,0,.2); }
    .reset-confirm-card h2 { margin: 0 0 12px; font-size: 20px; }
    .reset-confirm-card p { line-height: 1.7; }
    .reset-confirm-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
    .legacy-backup-notice[hidden] { display: none; }
    .legacy-backup-notice { margin: 12px 20px; padding: 12px 16px; border: 1px solid #d9cba5; border-radius: 10px; background: #fffaf0; font-size: 13px; line-height: 1.6; }
    .legacy-backup-notice p { margin: 6px 0; }
    :root {
      --sat-bg-page: #ffffff;
      --sat-bg-shell: #f6f8fb;
      --sat-bg-panel: #ffffff;
      --sat-bg-subtle: #f3f6fa;
      --sat-bg-control: #eef3f8;

      --sat-text-main: #1e2329;
      --sat-text-muted: #5b6470;
      --sat-text-soft: #737b86;
      --sat-text-inverse: #ffffff;

      --sat-border-light: #d7dde6;
      --sat-border-medium: #aeb7c3;
      --sat-border-strong: #596371;
      --sat-divider: #737880;

      --sat-blue: #2f56c9;
      --sat-blue-hover: #2447af;
      --sat-blue-muted: #e7ecfb;
      --sat-blue-border: #6f86d6;

      --sat-choice-bg: #ffffff;
      --sat-choice-border: #7f8791;
      --sat-choice-hover-bg: #f8fafc;
      --sat-choice-selected-border: #2f56c9;
      --sat-choice-selected-bg: #f7f9ff;
      --sat-choice-disabled-bg: #f5f6f8;
      --sat-choice-disabled-text: #7d858f;

      --sat-correct-bg: #eef8f1;
      --sat-correct-border: #3f8b58;
      --sat-correct-text: #1f5b33;
      --sat-incorrect-bg: #fbf0ef;
      --sat-incorrect-border: #b94d45;
      --sat-incorrect-text: #8a2f29;

      --sat-explanation-bg: #f4f7fa;
      --sat-explanation-border: #c8d2de;
      --sat-explanation-accent: #dfe7f1;

      --sat-font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --sat-font-reading: "Times New Roman", Times, serif;

      --sat-font-size-ui-xs: 12px;
      --sat-font-size-ui-sm: 13px;
      --sat-font-size-ui: 14px;
      --sat-font-size-body: 16.2px;
      --sat-font-size-question: 16px;
      --sat-font-size-choice: 15.8px;
      --sat-font-size-table: 15.5px;

      --sat-line-height-ui: 1.35;
      --sat-line-height-reading: 1.42;
      --sat-line-height-question: 1.42;
      --sat-line-height-choice: 1.38;
      --sat-line-height-table: 1.32;

      --sat-space-1: 4px;
      --sat-space-2: 8px;
      --sat-space-3: 12px;
      --sat-space-4: 16px;
      --sat-space-5: 20px;
      --sat-space-6: 24px;
      --sat-space-7: 32px;
      --sat-space-8: 40px;

      --sat-panel-padding-x: clamp(24px, 4vw, 64px);
      --sat-panel-padding-y: clamp(24px, 4vh, 44px);
      --sat-passage-max-width: 680px;
      --sat-question-max-width: 720px;
      --sat-table-max-width: 680px;

      --sat-radius-choice: 6px;
      --sat-radius-panel: 8px;
      --sat-radius-control: 7px;

      --sat-shadow-none: none;
      --sat-focus-ring: 0 0 0 3px rgba(47, 86, 201, 0.22);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: var(--sat-font-ui);
      background: #ffffff;
      color: var(--sat-text-main);
    }
    button {
      border: 1px solid var(--sat-border-light);
      background: var(--sat-bg-panel);
      color: var(--sat-text-main);
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { border-color: var(--sat-blue); }
    button:disabled { cursor: not-allowed; opacity: .52; border-color: var(--sat-border-light); }
    button.primary { background: var(--sat-blue); border-color: var(--sat-blue); color: var(--sat-text-inverse); }
    button.danger { border-color: var(--sat-incorrect-border); color: var(--sat-incorrect-text); }
    button.ghost { background: transparent; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: #e8eef7;
      border-bottom: 1px solid var(--sat-border-light);
      box-shadow: none;
    }
    .title { flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: var(--sat-text-main); white-space: nowrap; }
    .progress {
      flex: 0 0 auto;
      color: var(--sat-text-main);
      font-size: var(--sat-font-size-ui-sm);
      white-space: nowrap;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tools-group, .export-group {
      display: flex;
      gap: 0;
    }
    .tools-group button, .export-group button {
      padding: 5px 10px;
      font-size: var(--sat-font-size-ui-sm);
      border: 1px solid var(--sat-border-light);
      background: transparent;
      color: var(--sat-text-muted);
      border-radius: 0;
    }
    .tools-group button:first-child, .export-group button:first-child {
      border-radius: 5px 0 0 5px;
    }
    .tools-group button:last-child, .export-group button:last-child {
      border-radius: 0 5px 5px 0;
      border-left: 0;
    }
    .tools-group button:hover, .export-group button:hover {
      background: var(--sat-bg-subtle);
      color: var(--sat-text-main);
    }
    .export-label {
      font-size: var(--sat-font-size-ui-sm);
      color: var(--sat-text-soft);
      margin-right: 2px;
    }
    #resetBtn {
      padding: 5px 10px;
      font-size: var(--sat-font-size-ui-sm);
      border: 1px solid var(--sat-border-light);
      background: transparent;
      color: var(--sat-text-soft);
      border-radius: 5px;
    }
    #resetBtn:hover {
      border-color: var(--sat-incorrect-border);
      color: var(--sat-incorrect-text);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(300px, 1fr);
      gap: 0;
      max-width: none;
      min-height: calc(100vh - 104px);
      margin: 0 0 68px;
      padding: 0;
      position: relative;
    }
    .layout::before {
      content: "";
      position: absolute;
      left: var(--chart-left-pct, 50%);
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--sat-border-medium);
    }
    .pane {
      background: var(--sat-bg-panel);
      padding: 28px 32px;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .stimulus-pane { padding-right: 36px; }
    .question-pane { padding-left: 36px; }
    .stimulus {
      font-family: var(--sat-font-reading);
      font-size: var(--sat-font-size-body);
      line-height: var(--sat-line-height-reading);
      line-height: 1.65;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .stimulus p { margin: 0 0 16px; }
    .stimulus p:last-child { margin-bottom: 0; }
    .stimulus .text-heading {
      margin: 18px 0 8px;
      font-weight: 700;
    }
    .stimulus ul {
      margin: 0 0 16px 22px;
      padding: 0;
    }
    .stimulus li { margin: 5px 0; }
    .chart-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 12px 0 4px;
      cursor: zoom-in;
    }
    .chart-image-wrap {
      width: 100%;
    }
    .chart-size-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      font-size: 0.8rem;
      margin: 4px 0 8px;
      color: var(--sat-text-muted);
    }
    .chart-size-btn {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.78rem;
      line-height: 1.35;
      color: var(--sat-text-muted);
      background: var(--sat-bg-panel);
    }
    .chart-size-btn.active {
      border-color: var(--sat-blue);
      background: var(--sat-blue-muted);
      color: var(--sat-blue);
      font-weight: 700;
    }
    .chart-open-button {
      display: inline;
      margin: -2px 0 16px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--sat-blue);
      font: inherit;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .chart-open-button:hover,
    .chart-open-button:focus-visible {
      text-decoration: underline;
    }
    body.chart-question .layout {
      grid-template-columns: var(--chart-left-pct, 55%) calc(100% - var(--chart-left-pct, 55%));
    }
    .chart-lightbox {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 5vh 2.5vw;
      background: rgba(0, 0, 0, 0.78);
    }
    .chart-lightbox.visible { display: flex; }
    .chart-lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      background: white;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
    }
    .chart-lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      width: 42px;
      height: 42px;
      padding: 0;
      border-color: rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.45);
      color: white;
      font-size: 30px;
      line-height: 1;
    }
    .blank {
      color: var(--sat-blue);
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 2px solid var(--sat-blue);
    }
    .underline {
      text-decoration: underline;
      text-underline-offset: 0.12em;
    }
    .italic { font-style: italic; }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 16px;
      font-size: var(--sat-font-size-table);
      line-height: var(--sat-line-height-table);
    }
    .data-table th,
    .data-table td {
      border: 1px solid var(--sat-border-light);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .data-table th { background: var(--sat-blue-muted); }
    .data-table caption {
      margin-bottom: 8px;
      color: var(--sat-text-main);
      font-weight: 700;
      text-align: left;
    }
    .visual-render-error {
      margin: 12px 0;
      padding: 12px 14px;
      border: 1px solid var(--sat-incorrect-border);
      border-radius: var(--sat-radius-control);
      background: var(--sat-incorrect-bg);
      color: var(--sat-incorrect-text);
      font-family: var(--sat-font-ui);
      font-size: var(--sat-font-size-ui-sm);
    }
    .empty-stimulus {
      color: var(--sat-text-muted);
      border: 1px dashed var(--sat-border-light);
      padding: 18px;
    }
    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .question-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .question-number { margin: 0; font-size: inherit; font-weight: 700; }
    .prompt {
      font-size: var(--sat-font-size-question);
      line-height: var(--sat-line-height-question);
      margin: 0 0 18px;
      white-space: pre-wrap;
    }
    .choices { display: grid; gap: 10px; }
    .choice {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 12px;
    }
    .choice.selected { border-color: var(--sat-choice-selected-border); background: var(--sat-choice-selected-bg); }
    .choice.correct { border-color: var(--sat-correct-border); background: var(--sat-correct-bg); }
    .choice.correct .label { border-color: var(--sat-correct-border); color: var(--sat-correct-text); }
    .choice.incorrect { border-color: var(--sat-incorrect-border); background: var(--sat-incorrect-bg); }
    .choice.incorrect .label { border-color: var(--sat-incorrect-border); color: var(--sat-incorrect-text); }
    .label {
      display: inline-grid; place-items: center; width: 24px; height: 24px;
      border: 1.5px solid var(--sat-choice-border); border-radius: 50%;
      font-family: var(--sat-font-ui); font-size: 12px; font-weight: 600;
      color: var(--sat-text-soft); background: transparent;
    }
    .choice.selected .label { border-color: var(--sat-choice-selected-border); color: var(--sat-blue); }
    .feedback {
      min-height: 36px; margin-top: 12px; margin-bottom: 12px;
      padding: 10px 14px; border-radius: var(--sat-radius-choice);
      font-family: var(--sat-font-ui); font-size: var(--sat-font-size-ui);
      border: 1px solid transparent; color: var(--sat-text-muted); background: var(--sat-bg-subtle);
    }
    .feedback.correct { color: var(--sat-correct-text); background: var(--sat-correct-bg); border-color: var(--sat-correct-border); }
    .feedback.incorrect { color: var(--sat-incorrect-text); background: var(--sat-incorrect-bg); border-color: var(--sat-incorrect-border); }
    .explanation {
      display: none; margin-top: 16px;
      border: 1px solid var(--sat-explanation-border); border-radius: var(--sat-radius-panel);
      background: var(--sat-explanation-bg); line-height: 1.55; overflow: hidden;
    }
    .explanation.visible { display: block; }
    .choice-analysis p { margin: 6px 0; padding: 4px 0; }
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #ffffff;
      border-top: 1px solid var(--sat-border-light);
      backdrop-filter: none;
    }
    .overview {
      position: fixed;
      inset: 72px 18px auto auto;
      width: min(420px, calc(100vw - 36px));
      max-height: calc(100vh - 110px);
      overflow: auto;
      padding: 16px;
      background: var(--sat-bg-panel);
      border: 1px solid var(--sat-border-light);
      box-shadow: var(--sat-shadow-none);
      display: none;
      z-index: 10;
    }
    .overview.visible { display: block; }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      gap: 8px;
    }
    .qnav {
      min-height: 40px;
      padding: 6px;
      font-weight: 700;
    }
    .qnav.current { outline: 2px solid var(--sat-blue); }
    .qnav.selected { background: var(--sat-blue-muted); border-color: var(--sat-blue); }
    .qnav.correct { background: var(--sat-correct-bg); border-color: var(--sat-correct-border); color: var(--sat-correct-text); }
    .qnav.incorrect { background: var(--sat-incorrect-bg); border-color: var(--sat-incorrect-border); color: var(--sat-incorrect-text); }
    .qnav .star { color: #b7791f; margin-left: 2px; }
    .home-link { color: var(--sat-blue); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
    .mode-banner { display: none; padding: 9px 14px; text-align: center; color: #5b4b25; background: #fff6d8; border-bottom: 1px solid #ead6a5; font-size: 13px; font-weight: 700; }
    .mode-banner.visible { display: block; }
    .exam-shell {
      display: none;
      max-width: 1180px;
      margin: 0 auto 76px;
      padding: clamp(18px, 4vw, 40px);
    }
    .exam-shell.visible { display: block; }
    .exam-card {
      max-width: 760px;
      margin: 28px auto;
      padding: clamp(20px, 4vw, 36px);
      border: 1px solid var(--sat-border-light);
      border-radius: var(--sat-radius-panel);
      background: var(--sat-bg-panel);
    }
    .exam-card h1, .exam-card h2 { margin-top: 0; }
    .exam-card p { line-height: 1.6; }
    .exam-note {
      padding: 12px 14px;
      border-left: 4px solid var(--sat-blue-border);
      background: var(--sat-blue-muted);
      color: var(--sat-text-muted);
      line-height: 1.55;
    }
    .exam-persistence-alert {
      max-width: 760px;
      margin: 12px auto;
      padding: 12px 14px;
      border: 1px solid var(--sat-incorrect-border);
      border-radius: var(--sat-radius-control);
      background: var(--sat-incorrect-bg);
      color: var(--sat-incorrect-text);
      font-weight: 700;
    }
    .exam-persistence-alert button { margin-left: 10px; }
    .exam-variants { display: grid; gap: 12px; margin: 20px 0; }
    .exam-variant {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px;
      text-align: left;
    }
    .exam-variant strong, .exam-variant span { display: block; }
    .exam-variant span { margin-top: 4px; color: var(--sat-text-muted); font-size: var(--sat-font-size-ui-sm); }
    .exam-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid var(--sat-border-light);
      border-bottom: 0;
      background: var(--sat-bg-subtle);
    }
    .exam-toolbar-title { flex: 1 1 260px; font-weight: 700; }
    .exam-timer {
      min-width: 96px;
      padding: 7px 10px;
      border: 1px solid var(--sat-border-medium);
      border-radius: var(--sat-radius-control);
      background: white;
      text-align: center;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }
    .exam-timer.urgent { border-color: var(--sat-incorrect-border); color: var(--sat-incorrect-text); }
    .exam-layout { margin-bottom: 0; min-height: auto; border: 1px solid var(--sat-border-light); }
    .exam-question-number { font-weight: 700; }
    .exam-actions {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      border: 1px solid var(--sat-border-light);
      border-top: 0;
      background: white;
    }
    .exam-actions-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .exam-overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 8px;
      margin: 16px 0;
    }
    .exam-overview .qnav.answered { background: var(--sat-blue-muted); border-color: var(--sat-blue); }
    .exam-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }
    .exam-summary-card { padding: 16px; border: 1px solid var(--sat-border-light); border-radius: var(--sat-radius-panel); }
    .exam-summary-card h3 { margin: 0 0 10px; }
    .exam-stats { display: grid; grid-template-columns: repeat(2, minmax(90px, 1fr)); gap: 8px; }
    .exam-stat { padding: 9px; background: var(--sat-bg-subtle); border-radius: var(--sat-radius-control); }
    .exam-stat strong, .exam-stat span { display: block; }
    .exam-stat span { margin-top: 3px; color: var(--sat-text-muted); font-size: var(--sat-font-size-ui-xs); }
    .exam-review-answer { margin: 14px 0 0; }
    .exam-review-answer .choice { cursor: default; }
    .exam-review-explanation { display: block; margin-top: 16px; }
    .explanation-detail { padding: 14px 16px; border-bottom: 1px solid var(--sat-explanation-border); }
    .explanation-detail summary { cursor: pointer; font-size: 13px; font-weight: 700; }
    .explanation-detail p { margin: 10px 0 0; font-family: var(--sat-font-reading); font-size: var(--sat-font-size-body); line-height: var(--sat-line-height-reading); white-space: pre-line; }
    .exam-footer-note { color: var(--sat-text-muted); font-size: var(--sat-font-size-ui-sm); }
    .exam-visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    .sync-status { color: var(--sat-text-muted); font-size: 12px; white-space: normal; overflow-wrap: anywhere; max-width: 100%; min-width: 0; }
    .reflection {
      display: grid; gap: 12px; margin-top: 16px; padding: 14px;
      border: 1px solid var(--sat-border-light); border-radius: 8px; background: var(--sat-bg-subtle);
    }
    .reflection[hidden] { display: none; }
    .reflection-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .reflection-label { min-width: 70px; color: var(--sat-text-muted); font-size: 13px; font-weight: 700; }
    .confidence-option, .error-option {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px;
      border: 1px solid var(--sat-border-light); border-radius: 999px; background: white; font-size: 13px;
    }
    .confidence-option input, .error-option input { accent-color: var(--sat-blue); }
    .note-input { width: 100%; min-height: 76px; resize: vertical; border: 1px solid var(--sat-border-light); border-radius: 6px; padding: 9px 10px; font: inherit; }
    .highlight-mark { background: #fff0a8; border-radius: 2px; padding: 0 1px; }
    .review-hint { color: var(--sat-text-muted); font-size: 12px; }
    .print-root { display: none; }
    @media (max-width: 820px) {
      .topbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;

  <script type="application/json" id="satPageMeta">__PAGE_META_JSON__</script>
  <script>
    __SAT_STORAGE_RUNTIME__
    const learningStorage = createSatLearningStore();
    const SECTION = "__SECTION__";
    const SECTION_TITLE = "__SECTION_TITLE__";
    const QUESTIONS = __QUESTIONS_JSON__;
    const SAT_LEARNING_VERSION = 2;
    const GLOBAL_KEY = "sat-learning:v2";
    const OUTBOX_KEY = "sat-learning:attempt-outbox:v2";
    const SESSION_KEY = "sat-learning:today-session:v2";
    const CLOUD_GATE_FAILSAFE_MS = 12000;
    const PAGE_ID = satPageId();
    const CLOUD_LOCAL_ONLY = isUnverifiedSatCloudPage(PAGE_ID);
    const PAGE_MIGRATIONS = __PAGE_MIGRATIONS_JSON__;
    const QUESTION_ALIASES_BY_PAGE = __QUESTION_ALIASES_BY_PAGE_JSON__;
    const params = new URLSearchParams(location.search);
    const requestedExamMode = params.get("mode") === "exam";
    const PAGE_META = readPageMeta();
    const EXAM_CONFIG = normalizeExamConfig(PAGE_META);
    const EXAM_STORAGE_KEY = "sat-exam:v1:" + PAGE_ID;
    const EXAM_TAB_ID = createExamSessionId();
    let examSession = requestedExamMode && EXAM_CONFIG ? loadExamSession() : null;
    let examTimer = null;
    let examPersistenceMessage = "";
    let examWriteBlocked = false;
    let examStartInProgress = false;
    let requestedRedoQuestionId = params.get("redo") || "";
    const requestedRedoIndex = QUESTIONS.findIndex(question => question.question_id === requestedRedoQuestionId);
    let invalidRedoQuestionId = Boolean(requestedRedoQuestionId && requestedRedoIndex < 0);
    let redoQuestionId = requestedRedoIndex >= 0 ? requestedRedoQuestionId : "";
    const focusQuestionId = params.get("focus") || redoQuestionId;
    const activeSessionId = params.get("session") || "";
    let redoMode = Boolean(redoQuestionId);
    const storageKey = "sat-practice:" + SECTION + ":" + QUESTIONS.map(q => q.question_id).join("|");
    const refreshLegacyBackup = installSatLegacyBackupNotice(learningStorage, () => [
      GLOBAL_KEY, OUTBOX_KEY, SESSION_KEY, EXAM_STORAGE_KEY, storageKey,
      ...PAGE_MIGRATIONS.map(migration => migration.storageKey)
    ], { pageOnly: true });
    let state = loadState();
    let current = Math.min(state.current || 0, Math.max(QUESTIONS.length - 1, 0));
    if (focusQuestionId) {
      const focusIndex = QUESTIONS.findIndex(question => question.question_id === focusQuestionId);
      if (focusIndex >= 0) current = focusIndex;
    }
    let globalState = loadGlobalState();
    let redoSession = redoMode ? defaultQuestionState() : null;
    let practiceSession = null;
    let cloudSession = null;
    let cloudSaveTimer = null;
    let cloudSaveInFlight = null;
    let cloudSavePending = false;
    let cloudBootstrapPromise = null;
    let outboxSyncPromise = null;
    let reflectionTimer = null;
    let globalPersistTimer = null;
    let volatileAttemptOutbox = [];
    const sessionSyncedAttemptIds = new Set();
    let localRevision = 0;
    let localNavigationRevision = focusQuestionId ? 1 : 0;
    const locallyChangedQuestionIds = new Set();
    const chartScaleOverrides = {};
    const explanationOpen = {};

    const els = {
      progressText: document.getElementById("progressText"),
      examModeBtn: document.getElementById("examModeBtn"),
      examShell: document.getElementById("examShell"),
      practiceLayout: document.getElementById("practiceLayout"),
      practiceNav: document.getElementById("practiceNav"),
      overviewBtn: document.getElementById("overviewBtn"),
      overviewPanel: document.getElementById("overviewPanel"),
      overviewGrid: document.getElementById("overviewGrid"),
      checkCurrentBtn: document.getElementById("checkCurrentBtn"),
      checkAllBtn: document.getElementById("checkAllBtn"),
      exportJsonBtn: document.getElementById("exportJsonBtn"),
      exportPdfBtn: document.getElementById("exportPdfBtn"),
      resetBtn: document.getElementById("resetBtn"),
      resetConfirm: document.getElementById("resetConfirm"),
      resetConfirmCancel: document.getElementById("resetConfirmCancel"),
      resetConfirmApply: document.getElementById("resetConfirmApply"),
      syncStatus: document.getElementById("syncStatus"),
      modeBanner: document.getElementById("modeBanner"),
      stimulus: document.getElementById("stimulus"),
      questionNumber: document.getElementById("questionNumber"),
      starBtn: document.getElementById("starBtn"),
      prompt: document.getElementById("prompt"),
      choices: document.getElementById("choices"),
      feedback: document.getElementById("feedback"),
      revealBtn: document.getElementById("revealBtn"),
      retryBtn: document.getElementById("retryBtn"),
      returnOriginalBtn: document.getElementById("returnOriginalBtn"),
      highlightBtn: document.getElementById("highlightBtn"),
      reflectionPanel: document.getElementById("reflectionPanel"),
      errorTagsRow: document.getElementById("errorTagsRow"),
      noteInput: document.getElementById("noteInput"),
      reflectionHint: document.getElementById("reflectionHint"),
      explanation: document.getElementById("explanation"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      chartLightbox: document.getElementById("chartLightbox"),
      chartLightboxImage: document.getElementById("chartLightboxImage"),
      chartLightboxClose: document.getElementById("chartLightboxClose")
    };

    function defaultQuestionState() {
      return {
        selected: "", checked: false, submitted: false, correct: false,
        starred: false, revealed: false, revealedAt: null, confidence: "",
        errorTags: [], note: "", highlights: [], updatedAt: null,
        submittedAt: null, firstWrongAt: null, lastAttemptAt: null,
        lastRedoCorrect: null, attemptCount: 0, redoCount: 0,
        reviewStage: 0, nextDueAt: null, mastered: false, masteredAt: null
      };
    }

    function satPageId() {
      const marker = "/sat-practice/";
      const pathname = location.pathname;
      const relative = pathname.includes(marker)
        ? pathname.slice(pathname.indexOf(marker) + marker.length)
        : pathname.split("/").slice(-2).join("/");
      return decodeURIComponent(relative).replace(/^\/+/, "").replace(/\.html$/, "") || "index";
    }

    function nowIso() { return new Date().toISOString(); }
    function timeOf(value) {
      const time = value ? new Date(value).getTime() : 0;
      return Number.isFinite(time) ? time : 0;
    }
    function asRecord(value) { return value && typeof value === "object" && !Array.isArray(value) ? value : {}; }
    function uniqueStrings(value) { return [...new Set((Array.isArray(value) ? value : []).map(String).filter(Boolean))]; }

    /*
     * Formal exam metadata is deliberately fail-closed. Only this shape is read:
     * {
     *   "examEligible": true,
     *   "moduleSpec": {
     *     "m1": {"label":"Module 1","durationSeconds":1920,"questionIds":["..."]},
     *     "m2_easy": {"label":"Module 2 · Easy","durationSeconds":1920,"questionIds":["..."]},
     *     "m2_hard": {"label":"Module 2 · Hard","durationSeconds":1920,"questionIds":["..."]}
     *   },
     *   "examVariants": [
     *     {"id":"fixed-easy","label":"Fixed Easy","branch":"easy","modules":["m1","m2_easy"]},
     *     {"id":"fixed-hard","label":"Fixed Hard","branch":"hard","modules":["m1","m2_hard"]}
     *   ]
     * }
     * examVariants may contain one explicit fixed branch (including Hard-only
     * source sets) or both Easy and Hard. Unknown fields are ignored; a
     * missing/invalid field disables exam mode.
     */
    function readPageMeta() {
      const node = document.getElementById("satPageMeta");
      const raw = node ? String(node.textContent || "").trim() : "";
      const unresolvedPlaceholder = "__PAGE_" + "META_JSON__";
      if (!raw || raw === unresolvedPlaceholder) return {};
      try { return asRecord(JSON.parse(raw)); }
      catch (error) {
        console.warn("[sat exam] PAGE_META ignored because it is not valid JSON", error);
        return {};
      }
    }

    function safeExamToken(value) {
      const token = typeof value === "string" ? value.trim() : "";
      return token && token.length <= 80 && /^[A-Za-z0-9._:-]+$/.test(token) ? token : "";
    }

    function safeExamLabel(value, fallback) {
      const label = typeof value === "string" ? value.trim() : "";
      return (label || fallback || "").slice(0, 120);
    }

    function normalizeExamConfig(value) {
      const meta = asRecord(value);
      if (meta.examEligible !== true || !QUESTIONS.length) return null;
      const questionById = new Map();
      for (const question of QUESTIONS) {
        const questionId = safeExamToken(question && question.question_id);
        const labels = new Set((Array.isArray(question && question.choices) ? question.choices : []).map(choice => String(choice.label || "")));
        if (!questionId || questionById.has(questionId) || !labels.size || !labels.has(String(question.correct_answer || ""))) return null;
        if (question.table_data && !normalizeTableDataForDisplay(question.table_data)) return null;
        questionById.set(questionId, question);
      }

      const rawModules = asRecord(meta.moduleSpec);
      const modules = {};
      for (const [rawKey, rawModule] of Object.entries(rawModules)) {
        const key = safeExamToken(rawKey);
        const spec = asRecord(rawModule);
        const durationSeconds = Number(spec.durationSeconds);
        const questionIds = Array.isArray(spec.questionIds) ? spec.questionIds.map(safeExamToken) : [];
        if (!key || modules[key] || !Number.isInteger(durationSeconds) || durationSeconds < 60 || durationSeconds > 10800) return null;
        if (!questionIds.length || questionIds.some(questionId => !questionId || !questionById.has(questionId))) return null;
        if (new Set(questionIds).size !== questionIds.length) return null;
        modules[key] = {
          key,
          label: safeExamLabel(spec.label, key),
          durationSeconds,
          questionIds
        };
      }

      const rawVariants = Array.isArray(meta.examVariants) ? meta.examVariants : [];
      const variants = [];
      const seenVariantIds = new Set();
      for (const rawVariant of rawVariants) {
        const variant = asRecord(rawVariant);
        const id = safeExamToken(variant.id);
        const branch = variant.branch === "easy" || variant.branch === "hard" ? variant.branch : "";
        const moduleKeys = Array.isArray(variant.modules) ? variant.modules.map(safeExamToken) : [];
        if (!id || seenVariantIds.has(id) || !branch || moduleKeys.length !== 2 || moduleKeys.some(key => !modules[key])) return null;
        if (moduleKeys[0] === moduleKeys[1]) return null;
        const firstIds = new Set(modules[moduleKeys[0]].questionIds);
        if (modules[moduleKeys[1]].questionIds.some(questionId => firstIds.has(questionId))) return null;
        seenVariantIds.add(id);
        variants.push({
          id,
          label: safeExamLabel(variant.label, `M1 + ${branch === "easy" ? "Easy" : "Hard"}`),
          branch,
          moduleKeys
        });
      }

      const easy = variants.filter(variant => variant.branch === "easy");
      const hard = variants.filter(variant => variant.branch === "hard");
      if (variants.length < 1 || variants.length > 2 || easy.length > 1 || hard.length > 1) return null;
      if (variants.length === 2) {
        if (easy.length !== 1 || hard.length !== 1) return null;
        if (easy[0].moduleKeys[0] !== hard[0].moduleKeys[0]) return null;
        if (easy[0].moduleKeys[1] === hard[0].moduleKeys[1]) return null;
      }

      const config = {
        examEligible: true,
        modules,
        variants: variants.length === 2 ? [easy[0], hard[0]] : [variants[0]]
      };
      config.signature = JSON.stringify(config);
      return config;
    }

    function examVariantById(variantId) {
      return EXAM_CONFIG ? EXAM_CONFIG.variants.find(variant => variant.id === variantId) || null : null;
    }

    function examQuestionById(questionId) {
      return QUESTIONS.find(question => question.question_id === questionId) || null;
    }

    function blankExamModuleState() {
      return { answers: {}, current: 0, startedAt: null, deadlineAt: null, submittedAt: null, submitReason: "" };
    }

    function normalizeExamModuleState(value, moduleSpec) {
      const source = asRecord(value);
      const answers = {};
      const sourceAnswers = asRecord(source.answers);
      for (const questionId of moduleSpec.questionIds) {
        const question = examQuestionById(questionId);
        const selected = typeof sourceAnswers[questionId] === "string" ? sourceAnswers[questionId] : "";
        if ((question.choices || []).some(choice => String(choice.label) === selected)) answers[questionId] = selected;
      }
      const maxIndex = Math.max(moduleSpec.questionIds.length - 1, 0);
      const currentIndex = Number.isInteger(source.current) ? Math.min(Math.max(source.current, 0), maxIndex) : 0;
      const timestamp = key => Number.isFinite(Number(source[key])) && Number(source[key]) > 0 ? Number(source[key]) : null;
      return {
        answers,
        current: currentIndex,
        startedAt: timestamp("startedAt"),
        deadlineAt: timestamp("deadlineAt"),
        submittedAt: timestamp("submittedAt"),
        submitReason: source.submitReason === "timeout" ? "timeout" : source.submitReason === "manual" ? "manual" : ""
      };
    }

    function normalizeExamSession(value) {
      const source = asRecord(value);
      if (source.version !== 1 || source.configSignature !== EXAM_CONFIG.signature) return null;
      const variant = examVariantById(source.variantId);
      if (!variant || !["m1", "m2", "complete", "review"].includes(source.phase)) return null;
      const modules = {};
      for (const moduleKey of variant.moduleKeys) {
        modules[moduleKey] = normalizeExamModuleState(asRecord(source.modules)[moduleKey], EXAM_CONFIG.modules[moduleKey]);
      }
      const first = modules[variant.moduleKeys[0]];
      const second = modules[variant.moduleKeys[1]];
      if (!first.startedAt || !first.deadlineAt) return null;
      if (["m2", "complete", "review"].includes(source.phase) && (!first.submittedAt || !second.startedAt || !second.deadlineAt)) return null;
      if (["complete", "review"].includes(source.phase) && !second.submittedAt) return null;
      const createdAt = Number(source.createdAt);
      return {
        version: 1,
        sessionId: safeExamToken(source.sessionId) || createExamSessionId(),
        configSignature: EXAM_CONFIG.signature,
        variantId: variant.id,
        phase: source.phase,
        modules,
        createdAt: Number.isFinite(createdAt) && createdAt > 0 ? createdAt : first.startedAt,
        completedAt: Number.isFinite(Number(source.completedAt)) ? Number(source.completedAt) : null,
        reviewEnteredAt: Number.isFinite(Number(source.reviewEnteredAt)) ? Number(source.reviewEnteredAt) : null,
        reviewIndex: Number.isInteger(source.reviewIndex) ? Math.max(source.reviewIndex, 0) : 0,
        revision: Number.isInteger(source.revision) && source.revision >= 0 ? source.revision : 0,
        writerId: safeExamToken(source.writerId),
        updatedAt: Number.isFinite(Number(source.updatedAt)) ? Number(source.updatedAt) : null
      };
    }

    function loadExamSession() {
      try {
        const raw = learningStorage.getItem(EXAM_STORAGE_KEY);
        if (!raw) return null;
        return normalizeExamSession(JSON.parse(raw));
      } catch (error) {
        console.warn("[sat exam] saved session ignored", error);
        return null;
      }
    }

    function examStorageProbe() {
      const key = `${EXAM_STORAGE_KEY}:probe:${EXAM_TAB_ID}`;
      const token = `${Date.now()}-${Math.random()}`;
      try {
        learningStorage.setItem(key, token);
        if (learningStorage.getItem(key) !== token) throw new Error("storage readback mismatch");
        learningStorage.removeItem(key);
        return true;
      } catch (error) {
        try { learningStorage.removeItem(key); } catch {}
        console.warn("[sat exam] persistence probe failed", error);
        return false;
      }
    }

    function markExamPersistenceIssue(message, block = true) {
      examPersistenceMessage = message;
      if (block) {
        examWriteBlocked = true;
        clearExamTimer();
      }
      syncExamPersistenceNotice();
    }

    function syncExamPersistenceNotice() {
      els.examShell.querySelector("#examPersistenceNotice")?.remove();
      if (!examPersistenceMessage) return;
      const notice = document.createElement("div");
      notice.id = "examPersistenceNotice";
      notice.className = "exam-persistence-alert";
      notice.setAttribute("role", "alert");
      notice.textContent = examPersistenceMessage;
      if (examWriteBlocked) {
        clearExamTimer();
        const reload = document.createElement("button");
        reload.type = "button";
        reload.textContent = "重新载入最新进度";
        reload.addEventListener("click", () => location.reload());
        notice.appendChild(reload);
        els.examShell.querySelectorAll("[data-exam-start], [data-exam-choice], [data-exam-index], #examPrev, #examNext, #examSubmitModule, #examStartM2, #examEnterReview, #examCompleteReset, #examReviewPrev, #examReviewNext, #examReviewResults")
          .forEach(control => { control.disabled = true; });
      }
      els.examShell.prepend(notice);
    }

    function parseStoredExamEnvelope() {
      const raw = learningStorage.getItem(EXAM_STORAGE_KEY);
      if (!raw) return null;
      return asRecord(JSON.parse(raw));
    }

    function saveExamSession() {
      if (!examSession || examWriteBlocked) return false;
      try {
        const stored = parseStoredExamEnvelope();
        const localRevision = Number.isInteger(examSession.revision) ? examSession.revision : 0;
        const storedRevision = Number.isInteger(stored && stored.revision) ? stored.revision : 0;
        const changedElsewhere = stored && (
          (stored.sessionId && stored.sessionId !== examSession.sessionId)
          || (stored.sessionId === examSession.sessionId && stored.writerId !== EXAM_TAB_ID && storedRevision > localRevision)
        );
        if (changedElsewhere || (!stored && localRevision > 0)) {
          markExamPersistenceIssue("检测到另一个标签页已更新或重置本次模考。为避免覆盖答案，已停止本页保存。");
          return false;
        }
        const snapshot = {
          ...examSession,
          revision: localRevision + 1,
          writerId: EXAM_TAB_ID,
          updatedAt: Date.now()
        };
        const payload = JSON.stringify(snapshot);
        learningStorage.setItem(EXAM_STORAGE_KEY, payload);
        if (learningStorage.getItem(EXAM_STORAGE_KEY) !== payload) throw new Error("storage readback mismatch");
        examSession = snapshot;
        examPersistenceMessage = "";
        return true;
      } catch (error) {
        console.warn("[sat exam] session could not be persisted", error);
        markExamPersistenceIssue("本机存储不可用，模考进度无法安全保存。已停止继续作答，请重新载入后再试。");
        return false;
      }
    }

    function createExamSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
      return `exam-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function fixedBranchLabel(variant) {
      return `固定卷：M1 + ${variant.branch === "easy" ? "Easy" : "Hard"}`;
    }

    function formatExamDuration(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return remainder ? `${minutes} 分 ${remainder} 秒` : `${minutes} 分钟`;
    }

    function createExamSession(variantId) {
      if (examStartInProgress || examSession) return;
      const variant = examVariantById(variantId);
      if (!variant) return;
      if (!examStorageProbe()) {
        markExamPersistenceIssue("本机存储不可用，为避免刷新后丢失答案，未启动模考。", false);
        return;
      }
      try {
        const stored = parseStoredExamEnvelope();
        if (stored) {
          const restorable = normalizeExamSession(stored);
          if (restorable) {
            examSession = restorable;
            examPersistenceMessage = "检测到已有模考进度，已恢复原会话，未创建重复模考。";
            renderExam();
            return;
          }
          learningStorage.removeItem(EXAM_STORAGE_KEY);
          if (learningStorage.getItem(EXAM_STORAGE_KEY) !== null) throw new Error("stale session could not be cleared");
        }
      } catch (error) {
        console.warn("[sat exam] existing session could not be reconciled", error);
        markExamPersistenceIssue("无法校验或替换旧模考记录，未启动新模考。", false);
        return;
      }
      examStartInProgress = true;
      const startedAt = Date.now();
      const modules = {};
      for (const moduleKey of variant.moduleKeys) modules[moduleKey] = blankExamModuleState();
      const firstKey = variant.moduleKeys[0];
      modules[firstKey].startedAt = startedAt;
      modules[firstKey].deadlineAt = startedAt + EXAM_CONFIG.modules[firstKey].durationSeconds * 1000;
      examSession = {
        version: 1,
        sessionId: createExamSessionId(),
        configSignature: EXAM_CONFIG.signature,
        variantId: variant.id,
        phase: "m1",
        modules,
        createdAt: startedAt,
        completedAt: null,
        reviewEnteredAt: null,
        reviewIndex: 0,
        revision: 0,
        writerId: "",
        updatedAt: null
      };
      if (!saveExamSession()) examSession = null;
      examStartInProgress = false;
      renderExam();
    }

    function clearExamTimer() {
      if (examTimer) window.clearInterval(examTimer);
      examTimer = null;
    }

    function activeExamModule() {
      if (!examSession || !["m1", "m2"].includes(examSession.phase)) return null;
      const variant = examVariantById(examSession.variantId);
      const moduleIndex = examSession.phase === "m1" ? 0 : 1;
      const moduleKey = variant.moduleKeys[moduleIndex];
      return { variant, moduleIndex, moduleKey, spec: EXAM_CONFIG.modules[moduleKey], state: examSession.modules[moduleKey] };
    }

    function submitExamModule(reason) {
      const active = activeExamModule();
      if (!active || active.state.submittedAt) return;
      active.state.submittedAt = Date.now();
      active.state.submitReason = reason === "timeout" ? "timeout" : "manual";
      clearExamTimer();
      if (active.moduleIndex === 1) {
        examSession.phase = "complete";
        examSession.completedAt = active.state.submittedAt;
      }
      saveExamSession();
      renderExam();
    }

    function startExamSecondModule() {
      const variant = examVariantById(examSession && examSession.variantId);
      if (!variant || examSession.phase !== "m1") return;
      const first = examSession.modules[variant.moduleKeys[0]];
      if (!first.submittedAt) return;
      const secondKey = variant.moduleKeys[1];
      const second = examSession.modules[secondKey];
      const startedAt = Date.now();
      second.startedAt = startedAt;
      second.deadlineAt = startedAt + EXAM_CONFIG.modules[secondKey].durationSeconds * 1000;
      examSession.phase = "m2";
      saveExamSession();
      renderExam();
    }

    function scoreExamModule(moduleKey) {
      const spec = EXAM_CONFIG.modules[moduleKey];
      const moduleState = examSession.modules[moduleKey];
      let correct = 0;
      let incorrect = 0;
      let blank = 0;
      for (const questionId of spec.questionIds) {
        const selected = moduleState.answers[questionId] || "";
        if (!selected) blank += 1;
        else if (selected === examQuestionById(questionId).correct_answer) correct += 1;
        else incorrect += 1;
      }
      const total = spec.questionIds.length;
      return { correct, incorrect, blank, total, accuracy: total ? Math.round(correct / total * 1000) / 10 : 0 };
    }

    function exitExamMode() {
      const url = new URL(location.href);
      url.searchParams.delete("mode");
      location.assign(url.toString());
    }

    function resetExamSession() {
      if (!confirm("重新开始会清除本次模考的答案和计时，是否继续？")) return;
      clearExamTimer();
      try { learningStorage.removeItem(EXAM_STORAGE_KEY); } catch (error) { console.warn("[sat exam] session could not be cleared", error); }
      examSession = null;
      renderExam();
    }

    function setExamChrome(active) {
      els.examShell.classList.toggle("visible", active);
      els.practiceLayout.hidden = active;
      els.practiceNav.hidden = active;
      els.overviewPanel.classList.remove("visible");
      if (active) els.overviewPanel.hidden = true;
      else els.overviewPanel.hidden = false;
      els.progressText.hidden = active;
      els.overviewBtn.hidden = active || redoMode;
      els.checkAllBtn.hidden = active || redoMode;
      els.exportJsonBtn.closest(".export-group").hidden = active || redoMode;
      document.querySelector(".export-label").hidden = active || redoMode;
      els.resetBtn.hidden = active;
      els.syncStatus.hidden = active;
      els.examModeBtn.hidden = active || !EXAM_CONFIG || redoMode;
      if (!active) els.modeBanner.classList.remove("visible");
    }

    function examShellHeading(title, level) {
      return `<h${level || 1} id="examHeading" tabindex="-1">${escapeHtml(title)}</h${level || 1}>`;
    }

    function focusExamHeading() {
      window.requestAnimationFrame(() => document.getElementById("examHeading")?.focus());
    }

    function renderExamUnavailable() {
      applyChartLayout(null);
      els.examShell.innerHTML = `
        <div class="exam-card">
          ${examShellHeading("此页暂不支持正式模考")}
          <p>页面没有通过模考模块元数据校验。为避免计时、分支或计分错位，已安全降级，不会启动模考会话。</p>
          <button class="primary" id="examUnavailableExit" type="button">返回普通练习</button>
        </div>`;
      document.getElementById("examUnavailableExit").addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    function renderExamStart() {
      applyChartLayout(null);
      const branchSummary = EXAM_CONFIG.variants
        .map(variant => `M1 + ${variant.branch === "easy" ? "Easy" : "Hard"}`)
        .join(" / ");
      const branchPrompt = EXAM_CONFIG.variants.length === 1
        ? "此页仅提供该固定卷，点击下方开始。"
        : "请在开始前选定分支。";
      const variants = EXAM_CONFIG.variants.map(variant => {
        const first = EXAM_CONFIG.modules[variant.moduleKeys[0]];
        const second = EXAM_CONFIG.modules[variant.moduleKeys[1]];
        return `
          <button class="exam-variant" type="button" data-exam-start="${escapeHtml(variant.id)}">
            <span><strong>${escapeHtml(fixedBranchLabel(variant))}</strong><span>${escapeHtml(variant.label)} · ${first.questionIds.length} + ${second.questionIds.length} 题</span></span>
            <strong>开始</strong>
          </button>`;
      }).join("");
      els.examShell.innerHTML = `
        <div class="exam-card">
          ${examShellHeading("SAT 正式模考")}
          <p class="exam-note">这是预先固定的 ${escapeHtml(branchSummary)} 卷，<strong>不会根据 M1 表现自适应切换分支</strong>，也不提供换算分。</p>
          <p>${branchPrompt}每个模块有独立倒计时；刷新页面后会按原截止时间继续。</p>
          <div class="exam-variants">${variants}</div>
          <button id="examStartExit" type="button">返回普通练习</button>
        </div>`;
      els.examShell.querySelectorAll("[data-exam-start]").forEach(button => {
        button.addEventListener("click", () => createExamSession(button.dataset.examStart));
      });
      document.getElementById("examStartExit").addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    function renderExamStimulus(question) {
      const stimulusParts = [];
      if (question.passage) stimulusParts.push(question.passage);
      if (question.math_metadata && question.math_metadata.diagram_reference) stimulusParts.push("Diagram reference: " + question.math_metadata.diagram_reference);
      let html = renderChartImage(question) + renderVisualAssets(question) + renderStimulus(stimulusParts.join("\n\n"));
      html = html.replace(/\[vocab\]/g, '<span class="vocab">').replace(/\[\/vocab\]/g, "</span>");
      return html.trim() ? html : '<div class="empty-stimulus">No separate passage, diagram, or stimulus for this question.</div>';
    }

    function renderExamOverview(active, moduleState) {
      return active.spec.questionIds.map((questionId, index) => {
        const classes = ["qnav"];
        if (index === moduleState.current) classes.push("current");
        if (moduleState.answers[questionId]) classes.push("answered");
        return `<button type="button" class="${classes.join(" ")}" data-exam-index="${index}" aria-label="第 ${index + 1} 题${moduleState.answers[questionId] ? "，已作答" : "，未作答"}">${index + 1}</button>`;
      }).join("");
    }

    function updateExamTimer(active) {
      const timer = document.getElementById("examTimer");
      if (!timer || active.state.submittedAt) return;
      const remainingMs = active.state.deadlineAt - Date.now();
      if (remainingMs <= 0) {
        submitExamModule("timeout");
        return;
      }
      const remainingSeconds = Math.ceil(remainingMs / 1000);
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      timer.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      timer.classList.toggle("urgent", remainingSeconds <= 300);
      timer.setAttribute("aria-label", `剩余 ${minutes} 分 ${seconds} 秒`);
    }

    function startExamTimer(active) {
      clearExamTimer();
      updateExamTimer(active);
      if (!active.state.submittedAt && active.state.deadlineAt > Date.now()) {
        examTimer = window.setInterval(() => updateExamTimer(active), 250);
      }
    }

    function renderExamModule(active) {
      const moduleState = active.state;
      if (moduleState.deadlineAt <= Date.now()) {
        submitExamModule("timeout");
        return;
      }
      const questionId = active.spec.questionIds[moduleState.current];
      const question = examQuestionById(questionId);
      const selected = moduleState.answers[questionId] || "";
      applyChartLayout(question);
      const choices = (question.choices || []).map(choice => `
        <button type="button" class="choice${selected === String(choice.label) ? " selected" : ""}" data-exam-choice="${escapeHtml(choice.label)}" aria-pressed="${selected === String(choice.label)}">
          <span class="label">${escapeHtml(choice.label)}</span><span class="choice-text">${formatStimulusInline(choice.text || "")}</span>
        </button>`).join("");
      els.examShell.innerHTML = `
        <div class="exam-toolbar">
          <div class="exam-toolbar-title">${escapeHtml(fixedBranchLabel(active.variant))} · ${escapeHtml(active.spec.label)}</div>
          <div class="exam-timer" id="examTimer" role="timer" aria-live="off">--:--</div>
          <button id="examQuit" type="button">退出到练习</button>
        </div>
        <div class="exam-overview" aria-label="本模块答题卡">${renderExamOverview(active, moduleState)}</div>
        <main class="layout exam-layout">
          <section class="pane stimulus-pane"><div class="stimulus">${renderExamStimulus(question)}</div></section>
          <section class="pane question-pane">
            ${examShellHeading(`${active.spec.label} · 第 ${moduleState.current + 1}/${active.spec.questionIds.length} 题`, 2)}
            <p class="prompt">${formatStimulusInline(question.prompt || "")}</p>
            <div class="choices">${choices}</div>
            <p class="exam-footer-note">模考进行中不显示正误、正确答案或解析。选择会自动保存。</p>
          </section>
        </main>
        <div class="exam-actions">
          <div class="exam-actions-group">
            <button id="examPrev" type="button"${moduleState.current === 0 ? " disabled" : ""}>上一题</button>
            <button id="examNext" type="button"${moduleState.current === active.spec.questionIds.length - 1 ? " disabled" : ""}>下一题</button>
          </div>
          <button class="primary" id="examSubmitModule" type="button">提交本模块</button>
        </div>`;
      els.examShell.querySelectorAll("[data-exam-choice]").forEach(button => {
        button.addEventListener("click", () => {
          moduleState.answers[questionId] = button.dataset.examChoice;
          saveExamSession();
          els.examShell.querySelectorAll("[data-exam-choice]").forEach(item => {
            const isSelected = item === button;
            item.classList.toggle("selected", isSelected);
            item.setAttribute("aria-pressed", String(isSelected));
          });
          const nav = els.examShell.querySelector(`[data-exam-index="${moduleState.current}"]`);
          if (nav) {
            nav.classList.add("answered");
            nav.setAttribute("aria-label", `第 ${moduleState.current + 1} 题，已作答`);
          }
        });
      });
      els.examShell.querySelectorAll("[data-exam-index]").forEach(button => {
        button.addEventListener("click", () => {
          moduleState.current = Number(button.dataset.examIndex);
          saveExamSession();
          renderExam();
        });
      });
      document.getElementById("examPrev").addEventListener("click", () => {
        moduleState.current = Math.max(0, moduleState.current - 1);
        saveExamSession();
        renderExam();
      });
      document.getElementById("examNext").addEventListener("click", () => {
        moduleState.current = Math.min(active.spec.questionIds.length - 1, moduleState.current + 1);
        saveExamSession();
        renderExam();
      });
      document.getElementById("examSubmitModule").addEventListener("click", () => {
        const answered = Object.keys(moduleState.answers).length;
        const unanswered = active.spec.questionIds.length - answered;
        if (confirm(`本模块已作答 ${answered} 题，未作答 ${unanswered} 题。提交后不能返回，是否继续？`)) submitExamModule("manual");
      });
      document.getElementById("examQuit").addEventListener("click", exitExamMode);
      startExamTimer(active);
      focusExamHeading();
    }

    function renderExamModuleTransition(active) {
      applyChartLayout(null);
      const answered = Object.keys(active.state.answers).length;
      const unanswered = active.spec.questionIds.length - answered;
      els.examShell.innerHTML = `
        <div class="exam-card">
          ${examShellHeading(`${active.spec.label} 已提交`)}
          <p class="exam-note">本阶段只显示作答完成情况，不显示正误、答案或解析。</p>
          <div class="exam-summary-grid">
            <div class="exam-stat"><strong>${answered}</strong><span>已作答</span></div>
            <div class="exam-stat"><strong>${unanswered}</strong><span>未作答</span></div>
          </div>
          ${active.state.submitReason === "timeout" ? "<p><strong>本模块因计时结束已自动提交。</strong></p>" : ""}
          <button class="primary" id="examStartM2" type="button">开始 Module 2</button>
          <button id="examTransitionExit" type="button">退出到练习</button>
        </div>`;
      document.getElementById("examStartM2").addEventListener("click", startExamSecondModule);
      document.getElementById("examTransitionExit").addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    function examStatsHtml(moduleKey) {
      const spec = EXAM_CONFIG.modules[moduleKey];
      const score = scoreExamModule(moduleKey);
      return `
        <article class="exam-summary-card">
          <h3>${escapeHtml(spec.label)}</h3>
          <div class="exam-stats">
            <div class="exam-stat"><strong>${score.correct}</strong><span>正确</span></div>
            <div class="exam-stat"><strong>${score.incorrect}</strong><span>错误</span></div>
            <div class="exam-stat"><strong>${score.blank}</strong><span>空白</span></div>
            <div class="exam-stat"><strong>${score.accuracy}%</strong><span>原始正确率</span></div>
          </div>
        </article>`;
    }

    function renderExamComplete() {
      applyChartLayout(null);
      const variant = examVariantById(examSession.variantId);
      els.examShell.innerHTML = `
        <div class="exam-card">
          ${examShellHeading("整套模考已完成")}
          <p><strong>${escapeHtml(fixedBranchLabel(variant))}</strong></p>
          <p class="exam-note">以下仅为各模块原始作答统计，<strong>不是 SAT 换算分</strong>，也不代表自适应路由结果。</p>
          <div class="exam-summary-grid">${variant.moduleKeys.map(examStatsHtml).join("")}</div>
          <button class="primary" id="examEnterReview" type="button">进入解析复盘</button>
          <button id="examCompleteReset" type="button">重新开始模考</button>
          <button id="examCompleteExit" type="button">返回普通练习</button>
        </div>`;
      document.getElementById("examEnterReview").addEventListener("click", () => {
        examSession.phase = "review";
        examSession.reviewEnteredAt = Date.now();
        examSession.reviewIndex = 0;
        saveExamSession();
        renderExam();
      });
      document.getElementById("examCompleteReset").addEventListener("click", resetExamSession);
      document.getElementById("examCompleteExit").addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    function examExplanationHtml(question, selected) {
      const explanation = asRecord(question.explanation);
      const choiceAnalysis = asRecord(explanation.choice_analysis);
      const rows = Object.keys(choiceAnalysis).sort().map(label => `<p><strong>${escapeHtml(label)}.</strong> ${formatStimulusInline(choiceAnalysis[label])}</p>`).join("");
      return `
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);background:var(--sat-bg-subtle);">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);">正确答案</span><strong style="color:var(--sat-correct-text);">${escapeHtml(question.correct_answer || "")}</strong></div>
            <div style="flex:1;min-width:120px;"><span style="display:block;font-size:11px;font-weight:700;color:var(--sat-text-muted);">你的答案</span><strong>${escapeHtml(selected || "未作答")}</strong></div>
          </div>
        </div>
        <div style="padding:14px 16px;border-bottom:1px solid var(--sat-explanation-border);">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px;">关键证据</div>
          <p>${formatStimulusInline(explanation.key_evidence || explanation.short || "")}</p>
        </div>
        <div style="padding:14px 16px${rows ? ";border-bottom:1px solid var(--sat-explanation-border)" : ""};">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px;">正确思路</div>
          <p>${formatStimulusInline(explanation.why_correct || explanation.detailed || explanation.short || "")}</p>
        </div>
        ${detailedExplanationHtml(explanation, explanation.why_correct || explanation.detailed || explanation.short || "")}
        ${rows ? `<div style="padding:14px 16px;"><div style="font-size:13px;font-weight:700;margin-bottom:8px;">选项分析</div><div class="choice-analysis">${rows}</div></div>` : ""}`;
    }

    function reviewQuestionList(variant) {
      return variant.moduleKeys.flatMap((moduleKey, moduleIndex) => EXAM_CONFIG.modules[moduleKey].questionIds.map((questionId, index) => ({ moduleKey, moduleIndex, index, questionId })));
    }

    function renderExamReview() {
      const variant = examVariantById(examSession.variantId);
      const reviewQuestions = reviewQuestionList(variant);
      examSession.reviewIndex = Math.min(Math.max(examSession.reviewIndex, 0), reviewQuestions.length - 1);
      const item = reviewQuestions[examSession.reviewIndex];
      const spec = EXAM_CONFIG.modules[item.moduleKey];
      const question = examQuestionById(item.questionId);
      const selected = examSession.modules[item.moduleKey].answers[item.questionId] || "";
      applyChartLayout(question);
      const choices = (question.choices || []).map(choice => {
        const label = String(choice.label);
        const classes = ["choice"];
        if (label === selected) classes.push("selected");
        if (label === String(question.correct_answer)) classes.push("correct");
        else if (label === selected) classes.push("incorrect");
        return `<div class="${classes.join(" ")}" aria-label="${escapeHtml(label)}${label === String(question.correct_answer) ? "，正确答案" : label === selected ? "，你的错误答案" : ""}"><span class="label">${escapeHtml(label)}</span><span class="choice-text">${formatStimulusInline(choice.text || "")}</span></div>`;
      }).join("");
      els.examShell.innerHTML = `
        <div class="exam-toolbar">
          <div class="exam-toolbar-title">解析复盘 · ${escapeHtml(fixedBranchLabel(variant))} · ${escapeHtml(spec.label)}</div>
          <button id="examReviewResults" type="button">返回结果</button>
          <button id="examReviewExit" type="button">退出到练习</button>
        </div>
        <main class="layout exam-layout">
          <section class="pane stimulus-pane"><div class="stimulus">${renderExamStimulus(question)}</div></section>
          <section class="pane question-pane">
            ${examShellHeading(`${spec.label} · 第 ${item.index + 1} 题`, 2)}
            <p class="prompt">${formatStimulusInline(question.prompt || "")}</p>
            <div class="choices exam-review-answer">${choices}</div>
            <section class="explanation exam-review-explanation" aria-label="答案与解析">${examExplanationHtml(question, selected)}</section>
          </section>
        </main>
        <div class="exam-actions">
          <div class="exam-actions-group">
            <button id="examReviewPrev" type="button"${examSession.reviewIndex === 0 ? " disabled" : ""}>上一题</button>
            <button id="examReviewNext" type="button"${examSession.reviewIndex === reviewQuestions.length - 1 ? " disabled" : ""}>下一题</button>
          </div>
          <span>${examSession.reviewIndex + 1}/${reviewQuestions.length}</span>
        </div>`;
      document.getElementById("examReviewPrev").addEventListener("click", () => {
        examSession.reviewIndex = Math.max(0, examSession.reviewIndex - 1);
        saveExamSession();
        renderExam();
      });
      document.getElementById("examReviewNext").addEventListener("click", () => {
        examSession.reviewIndex = Math.min(reviewQuestions.length - 1, examSession.reviewIndex + 1);
        saveExamSession();
        renderExam();
      });
      document.getElementById("examReviewResults").addEventListener("click", () => {
        examSession.phase = "complete";
        saveExamSession();
        renderExam();
      });
      document.getElementById("examReviewExit").addEventListener("click", exitExamMode);
      focusExamHeading();
    }

    function renderExam() {
      clearExamTimer();
      setExamChrome(true);
      els.modeBanner.classList.remove("visible");
      if (!EXAM_CONFIG) {
        renderExamUnavailable();
      } else if (!examSession) {
        renderExamStart();
      } else {
        examSession = normalizeExamSession(examSession);
        if (!examSession) {
          renderExamStart();
        } else {
          const active = activeExamModule();
          if (active && active.state.submittedAt && active.moduleIndex === 0) {
            renderExamModuleTransition(active);
          } else if (active) {
            renderExamModule(active);
          } else if (examSession.phase === "complete") {
            renderExamComplete();
          } else {
            renderExamReview();
          }
        }
      }
      syncExamPersistenceNotice();
    }

    function normalizeQuestionState(raw, question = null) {
      const value = asRecord(raw);
      const submitted = Boolean(value.submitted || value.checked);
      const selected = typeof value.selected === "string" ? value.selected : "";
      const revealIsCurrent = Boolean(submitted && value.revealed && timeOf(value.revealedAt)
        && timeOf(value.revealedAt) >= timeOf(value.submittedAt));
      // Stored correctness can become stale after a reviewed answer correction.
      // Preserve the student's selection, notes and attempt history, but grade
      // the current item against its current answer whenever it is available.
      const correct = question && submitted
        ? selected === question.correct_answer
        : submitted && Boolean(value.correct);
      const lostMastery = Boolean(question && submitted && value.correct && !correct);
      return {
        ...defaultQuestionState(), ...value,
        selected,
        checked: Boolean(value.checked || value.submitted),
        submitted,
        correct, starred: Boolean(value.starred),
        revealed: revealIsCurrent,
        revealedAt: revealIsCurrent ? value.revealedAt : null,
        gradingRevision: question?.gradingRevision || value.gradingRevision || "",
        errorTags: uniqueStrings(value.errorTags), highlights: uniqueStrings(value.highlights),
        attemptCount: Math.max(0, Number(value.attemptCount || 0)),
        redoCount: Math.max(0, Number(value.redoCount || 0)),
        reviewStage: lostMastery ? 0 : Math.max(0, Number(value.reviewStage || 0)),
        mastered: lostMastery ? false : Boolean(value.mastered),
        masteredAt: lostMastery ? null : value.masteredAt || null,
        nextDueAt: lostMastery ? nowIso() : value.nextDueAt || null
      };
    }

    function canonicalQuestionId(questionId, pageId = PAGE_ID) {
      // Cloud IDs are canonical. Only loadState's exact storageKey migration
      // may interpret legacy aliases; applying them here can shift an ID twice.
      return String(questionId || "");
    }

    function mergeQuestionState(leftRaw, rightRaw) {
      const left = normalizeQuestionState(leftRaw);
      const right = normalizeQuestionState(rightRaw);
      const latest = timeOf(right.updatedAt) > timeOf(left.updatedAt)
        || (rightRaw && timeOf(right.updatedAt) === timeOf(left.updatedAt)) ? right : left;
      const sameOutcome = left.selected === right.selected && left.submitted === right.submitted && left.submittedAt === right.submittedAt;
      const gradeEvidence = sameOutcome ? (left.gradingRevision ? left : right.gradingRevision ? right : null) : null;
      return normalizeQuestionState({
        ...latest,
        ...(gradeEvidence && !latest.gradingRevision ? { gradingRevision: gradeEvidence.gradingRevision, correct: gradeEvidence.correct } : {}),
        revealed: Boolean(latest.submitted && latest.revealed),
        revealedAt: latest.submitted && latest.revealed ? latest.revealedAt || null : null,
        firstWrongAt: timeOf(left.firstWrongAt) && timeOf(right.firstWrongAt)
          ? (timeOf(left.firstWrongAt) <= timeOf(right.firstWrongAt) ? left.firstWrongAt : right.firstWrongAt)
          : left.firstWrongAt || right.firstWrongAt,
        attemptCount: Math.max(left.attemptCount, right.attemptCount),
        redoCount: Math.max(left.redoCount, right.redoCount)
      });
    }

    function loadState() {
      const candidates = [{ storageKey, aliases: {} }, ...PAGE_MIGRATIONS];
      const next = { current: 0, answers: {} };
      let newestVisit = 0;
      for (const candidate of candidates) {
        try {
          const parsed = JSON.parse(learningStorage.getItem(candidate.storageKey) || "null");
          if (!parsed || typeof parsed !== "object") continue;
          const visited = timeOf(parsed.lastVisitedAt || parsed.currentUpdatedAt);
          if (visited >= newestVisit) {
            newestVisit = visited;
            Object.assign(next, parsed, { answers: next.answers });
          }
          for (const [legacyId, value] of Object.entries(asRecord(parsed.answers))) {
            const questionId = String(asRecord(candidate.aliases)[legacyId] || legacyId);
            next.answers[questionId] = mergeQuestionState(next.answers[questionId], value);
          }
        } catch (error) {
          console.warn("[sat learning] legacy page state migration skipped", error);
        }
      }
      for (const [questionId, value] of Object.entries(asRecord(next.answers))) {
        next.answers[questionId] = normalizeQuestionState(value);
      }
      return next;
    }

    function loadGlobalState() {
      try {
        const parsed = JSON.parse(learningStorage.getItem(GLOBAL_KEY) || "{}");
        const next = { version: SAT_LEARNING_VERSION, questions: {}, pages: {}, attempts: [], ...parsed };
        next.questions = asRecord(next.questions);
        next.pages = asRecord(next.pages);
        next.attempts = compactAttempts(next.attempts);
        for (const [questionId, value] of Object.entries(next.questions)) {
          next.questions[questionId] = normalizeQuestionState(value);
        }
        return next;
      } catch {
        return { version: SAT_LEARNING_VERSION, questions: {}, pages: {}, attempts: [] };
      }
    }

    function loadJson(key, fallback) {
      try {
        const value = JSON.parse(learningStorage.getItem(key) || "null");
        return value === null ? fallback : value;
      } catch { return fallback; }
    }

    function loadAttemptOutbox() {
      let value = [];
      let needsRepair = false;
      try {
        const raw = learningStorage.getItem(OUTBOX_KEY);
        if (raw) {
          value = JSON.parse(raw);
          if (!Array.isArray(value)) {
            value = [];
            needsRepair = true;
          }
        }
      } catch (error) {
        console.warn("[sat learning] malformed attempt outbox repaired", error);
        value = [];
        needsRepair = true;
      }
      const normalized = value.filter(item => {
        return item && typeof item === "object" && !Array.isArray(item) && typeof item.attemptId === "string" && item.attemptId;
      });
      if (normalized.length !== value.length) needsRepair = true;
      const combinedById = new Map();
      for (const item of [...normalized, ...volatileAttemptOutbox]) {
        if (!item || typeof item !== "object" || Array.isArray(item) || typeof item.attemptId !== "string" || !item.attemptId) continue;
        if (sessionSyncedAttemptIds.has(item.attemptId)) continue;
        combinedById.set(item.attemptId, { ...(combinedById.get(item.attemptId) || {}), ...item });
      }
      const combined = [...combinedById.values()];
      if (needsRepair) {
        console.warn("[sat learning] invalid attempt outbox reset");
        if (writeLocalJson(OUTBOX_KEY, combined)) volatileAttemptOutbox = [];
      }
      return combined;
    }

    function compactAttempts(value) {
      const cutoff = Date.now() - 30 * 86400000;
      return (Array.isArray(value) ? value : [])
        .filter(item => !item?.submittedAt || timeOf(item.submittedAt) >= cutoff)
        .slice(-1000);
    }

    function writeLocalJson(key, value) {
      try {
        learningStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (error) {
        console.warn("[sat learning] local storage write failed", { key, error });
        setSyncStatus(CLOUD_LOCAL_ONLY
          ? "本机存储不可用，本套无法云端备份，请勿关闭页面"
          : "本机存储空间不足，请保持联网", "error");
        return false;
      }
    }

    function flushGlobalState() {
      if (globalPersistTimer) clearTimeout(globalPersistTimer);
      globalPersistTimer = null;
      if (!learningStorage.ready()) return false;
      const write = () => {
        globalState = learningStorage.mergeGlobal(globalState, value => ({ ...value, attempts: compactAttempts(value.attempts) }), mergeQuestionState);
        return writeLocalJson(GLOBAL_KEY, globalState);
      };
      void learningStorage.coordinateGlobal(write).catch(error => {
        console.warn("[sat learning] coordinated persistence failed", error);
        setSyncStatus("本机保存尚未完成，请勿关闭页面", "error");
      });
      return true;
    }

    function scheduleGlobalPersist() {
      if (globalPersistTimer) clearTimeout(globalPersistTimer);
      globalPersistTimer = setTimeout(flushGlobalState, 120);
    }

    function migrateAndMergeLocalState() {
      for (const question of QUESTIONS) {
        const pageValue = state.answers[question.question_id];
        const globalValue = globalState.questions[question.question_id];
        if (!pageValue && globalValue && timeOf(globalValue.updatedAt) <= timeOf(state.resetAt)) continue;
        if (!pageValue && !globalValue) continue;
        const merged = normalizeQuestionState(mergeQuestionState(pageValue, globalValue), question);
        state.answers[question.question_id] = merged;
        globalState.questions[question.question_id] = merged;
      }
      persistLocalState({ deferGlobal: true, touchCurrent: false });
    }

    function persistLocalState({ deferGlobal = false, touchCurrent = true, updateSyncStatus = true } = {}) {
      if (!learningStorage.ready()) return;
      const visitedAt = nowIso();
      state.current = current;
      if (touchCurrent) state.currentUpdatedAt = visitedAt;
      state.currentQuestionId = QUESTIONS[current]?.question_id || null;
      // A focus link selects its entry question only once. Keep its URL aligned
      // with explicit navigation so refresh resumes the question now on screen.
      if (touchCurrent && !redoMode && state.currentQuestionId) {
        const url = new URL(location.href);
        if (url.searchParams.has("focus")) {
          url.searchParams.set("focus", state.currentQuestionId);
          history.replaceState(history.state, "", url);
        }
      }
      state.lastVisitedAt = visitedAt;
      const pageStored = writeLocalJson(storageKey, state);
      const submitted = QUESTIONS.filter(question => {
        const value = state.answers[question.question_id];
        return value ? normalizeQuestionState(value).submitted : false;
      }).length;
      globalState.pages[PAGE_ID] = {
        pageId: PAGE_ID, title: document.title, current,
        questionId: QUESTIONS[current]?.question_id || null,
        total: QUESTIONS.length, submitted, href: location.pathname,
        lastVisitedAt: visitedAt
      };
      globalState.version = SAT_LEARNING_VERSION;
      let globalStored = true;
      if (deferGlobal) scheduleGlobalPersist();
      else globalStored = flushGlobalState();
      if (updateSyncStatus && pageStored && globalStored) {
        setSyncStatus(cloudSession ? "等待同步" : "本机已保存");
      }
    }

    function saveState({ deferGlobal = false, touchCurrent = true, markQuestion = true } = {}) {
      const question = QUESTIONS[current];
      if (practiceSession && redoMode && question?.question_id === redoQuestionId) {
        redoSession.updatedAt = nowIso();
        practiceSession.answers[question.question_id] = redoSession;
        writeLocalJson(SESSION_KEY, practiceSession);
      }
      if (!redoMode && question && state.answers[question.question_id]) {
        state.answers[question.question_id].updatedAt = nowIso();
        globalState.questions[question.question_id] = mergeQuestionState(
          globalState.questions[question.question_id], state.answers[question.question_id]
        );
      }
      localRevision += 1;
      if (touchCurrent) localNavigationRevision += 1;
      if (markQuestion && question) locallyChangedQuestionIds.add(question.question_id);
      persistLocalState({ deferGlobal, touchCurrent });
      queueCloudSave();
    }

    function saveStateBestEffort(options = {}) {
      try {
        saveState(options);
        return true;
      } catch (error) {
        console.warn("[sat learning] local state persistence deferred", error);
        setSyncStatus("作答结果已显示，保存将在稍后重试", "error");
        return false;
      }
    }

    function qState(question) {
      if (!state.answers[question.question_id]) {
        const historical = normalizeQuestionState(globalState.questions[question.question_id], question);
        state.answers[question.question_id] = {
          ...defaultQuestionState(), starred: historical.starred, note: historical.note,
          highlights: historical.highlights, firstWrongAt: historical.firstWrongAt,
          attemptCount: historical.attemptCount, redoCount: historical.redoCount,
          lastRedoCorrect: historical.lastRedoCorrect, lastAttemptAt: historical.lastAttemptAt,
          reviewStage: historical.reviewStage, nextDueAt: historical.nextDueAt,
          mastered: historical.mastered, masteredAt: historical.masteredAt,
        };
      }
      const existing = state.answers[question.question_id];
      Object.assign(existing, normalizeQuestionState(existing, question));
      return existing;
    }

    function activeState(question) {
      return redoMode && question.question_id === redoQuestionId ? redoSession : qState(question);
    }

    function currentQuestion() {
      return QUESTIONS[current];
    }

    function visibleStateSignature() {
      const question = currentQuestion();
      if (!question) return "empty";
      const qs = activeState(question);
      return JSON.stringify({
        current,
        questionId: question.question_id,
        selected: qs.selected,
        submitted: qs.submitted,
        correct: qs.correct,
        starred: qs.starred,
        revealed: qs.revealed,
        confidence: qs.confidence,
        errorTags: qs.errorTags,
        note: qs.note,
        highlights: qs.highlights
      });
    }

    function questionHasChart(question) {
      return Boolean(question && question.chart_image && question.chart_image_data_uri);
    }

    function baseChartScale(question) {
      const scale = Number.parseFloat(question.chart_display_scale);
      return Number.isFinite(scale) && scale > 0 ? scale : 1;
    }

    function effectiveChartScale(question) {
      const override = chartScaleOverrides[question.question_id];
      return override || baseChartScale(question);
    }

    function chartLeftPercent(scale) {
      return 55 + (scale - 1) * 30;
    }

    function applyChartLayout(question) {
      if (!questionHasChart(question)) {
        document.body.classList.remove("chart-question");
        document.body.style.removeProperty("--chart-left-pct");
        return;
      }
      document.body.classList.add("chart-question");
      document.body.style.setProperty("--chart-left-pct", `${chartLeftPercent(effectiveChartScale(question))}%`);
    }

    function render() {
      if (requestedExamMode) {
        renderExam();
        return;
      }
      setExamChrome(false);
      els.resetBtn.hidden = redoMode || Boolean(activeSessionId);
      if (activeSessionId && !practiceSession) {
        els.progressText.textContent = "今日练习暂不可用";
        els.stimulus.textContent = "请确认登录状态后，从学习首页重新建立今日练习。原作答记录未更改。";
        els.choices.innerHTML = "";
        els.explanation.innerHTML = "";
