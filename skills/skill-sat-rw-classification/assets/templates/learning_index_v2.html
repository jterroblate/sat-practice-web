<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAT Reading and Writing 学习中心</title>
  <style>
    .legacy-backup-notice[hidden] { display: none; }
    .legacy-backup-notice { margin-top: 12px; padding: 16px 20px; border: 0; border-radius: 18px; background: #fff6e0; color: #5c4400; font-size: 13px; line-height: 1.6; }
    .legacy-backup-notice p { margin: 7px 0; }
    :root {
      --zen-bg: #f5f5f7;
      --zen-surface: #ffffff;
      --zen-ink: #1d1d1f;
      --zen-muted: #6e6e73;
      --zen-primary: #0071e3;
      --zen-primary-dark: #0066cc;
      --zen-primary-hover: #0068d1;
      --zen-sage: #e6f6ea;
      --zen-green: #1d7a34;
      --zen-blue: #e8f2ff;
      --zen-warm: #fff1de;
      --zen-orange: #9a4a00;
      --zen-purple: #6e41c4;
      --zen-teal: #0b7285;
      --zen-fill: rgba(118, 118, 128, .12);
      --zen-fill-hover: rgba(118, 118, 128, .2);
      --zen-line: rgba(0, 0, 0, .08);
      --zen-line-strong: rgba(0, 0, 0, .14);
      --zen-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 28px rgba(0, 0, 0, .05);
      --zen-hover-shadow: 0 2px 4px rgba(0, 0, 0, .05), 0 16px 40px rgba(0, 0, 0, .1);
      --zen-radius-control: 12px;
      --zen-radius-card: 20px;
      --zen-radius-panel: 28px;
      --zen-radius-pill: 980px;
      --zen-glass: saturate(180%) blur(20px);
      --zen-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--zen-ink);
      background: var(--zen-bg);
      font: 16px/1.5 var(--zen-font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    button { color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid rgba(0, 113, 227, .5); outline-offset: 2px; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--zen-line);
      background: rgba(255, 255, 255, .72);
      -webkit-backdrop-filter: var(--zen-glass);
      backdrop-filter: var(--zen-glass);
    }
    .top-row { min-height: 60px; display: flex; align-items: center; gap: 22px; }
    .brand { display: flex; align-items: baseline; gap: 9px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
    .brand strong { font-size: 19px; }
    .brand span { color: var(--zen-muted); font-size: 11px; font-weight: 600; letter-spacing: .08em; }
    .desktop-nav { display: flex; align-items: center; gap: 2px; flex: 1; }
    .desktop-nav a, .mobile-nav a {
      border-radius: var(--zen-radius-pill);
      color: #424245;
      font-size: 14px;
      font-weight: 500;
      transition: color .16s ease, background-color .16s ease;
    }
    .desktop-nav a { padding: 7px 14px; }
    .desktop-nav a:hover, .mobile-nav a:hover { color: var(--zen-ink); background: var(--zen-fill); }
    .desktop-nav a.active, .mobile-nav a.active { color: var(--zen-ink); background: var(--zen-fill); font-weight: 600; }
    .sync-status {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 12px;
      border: 0;
      border-radius: var(--zen-radius-pill);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .sync-status.calm { color: var(--zen-green); background: var(--zen-sage); }
    .sync-status.focus { color: var(--zen-primary-dark); background: var(--zen-blue); }
    .sync-status.pending { color: var(--zen-muted); background: var(--zen-fill); }
    .sync-status.soft-risk { color: var(--zen-orange); background: var(--zen-warm); }
    .menu-button {
      display: none;
      min-height: 40px;
      padding: 8px 16px;
      border: 0;
      border-radius: var(--zen-radius-pill);
      background: var(--zen-fill);
      font-size: 14px;
      font-weight: 600;
    }
    .mobile-nav {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 16px;
      width: min(300px, calc(100vw - 32px));
      padding: 8px;
      border: 1px solid var(--zen-line);
      border-radius: var(--zen-radius-card);
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .18);
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      transform-origin: top right;
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }
    .mobile-nav[hidden] { display: none; }
    .mobile-nav.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
    .mobile-nav a { display: flex; align-items: center; min-height: 44px; padding: 10px 14px; border-radius: 12px; font-size: 16px; }

    main { padding: 24px 0 72px; }
    .panel, .entry-card, .metric-rail, .breathing-card {
      border: 0;
      background: var(--zen-surface);
      box-shadow: var(--zen-shadow);
    }
    .visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    /* 首页：同一组板块，四种排版。板块宽度不固定，靠容器查询自己适应。 */
    .home-wrap { max-width: 1120px; margin-inline: auto; }
    .home { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 330px; grid-template-areas: "today today calendar" "review exam stats" "weekly weekly recent"; }
    .home > * { min-width: 0; margin: 0; }
    .home .panel { margin-top: 0; padding: 24px; }
    .hb-today { grid-area: today; }
    .hb-review { grid-area: review; }
    .hb-exam { grid-area: exam; }
    .hb-calendar { grid-area: calendar; }
    .hb-stats { grid-area: stats; }
    .hb-weekly { grid-area: weekly; }
    .hb-recent { grid-area: recent; }
    .hb-stats, .hb-weekly, .hb-calendar, .entry-card { container-type: inline-size; }
    @container (max-width: 290px) {
      .entry-card h2 { font-size: 24px; }
      .stat-pair span { white-space: nowrap; }
      .stat-pair { grid-template-columns: minmax(0, 1fr); gap: 8px; }
      .stat-pair div { display: flex; flex-direction: row-reverse; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 14px; }
      .stat-pair strong { font-size: 20px; }
      .hero-actions .button { flex: 1 1 100%; }
    }
    @container (max-width: 560px) { .weekly-layout { grid-template-columns: 1fr; } }
    .hb-calendar { display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: var(--zen-radius-panel); background: var(--zen-surface); box-shadow: var(--zen-shadow); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .cal-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .cal-head .segment { min-height: 30px; padding: 4px 12px; font-size: 13px; }
    .cal-names, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
    .cal-names span { color: var(--zen-muted); font-size: 12px; text-align: center; }
    .cal-day { display: grid; align-content: center; justify-items: center; gap: 1px; min-height: 58px; padding: 6px 2px; border-radius: 14px; background: var(--zen-bg); }
    .cal-day strong { font-size: 16px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .cal-day span { color: var(--zen-muted); font-size: 11px; line-height: 1.2; }
    .cal-day.done { background: var(--zen-blue); color: var(--zen-primary-dark); }
    .cal-day.done span { color: var(--zen-primary-dark); }
    .cal-day.today { box-shadow: inset 0 0 0 2px var(--zen-primary); }
    .cal-day.today.done { background: var(--zen-primary); color: #fff; box-shadow: none; }
    .cal-day.today.done span { color: #fff; }
    .cal-day.future { background: transparent; box-shadow: inset 0 0 0 1px var(--zen-line); }
    .cal-day.future strong { color: var(--zen-muted); font-weight: 500; }
    .cal-day.outside { visibility: hidden; }
    .cal-grid.month .cal-day { min-height: 38px; border-radius: 11px; }
    .cal-grid.month .cal-day strong { font-size: 14px; }
    .cal-grid.month .cal-day span { display: none; }
    .hb-calendar .stat-pair div { padding: 12px 14px; }
    .hb-calendar .stat-pair strong { font-size: 24px; }
    @container (min-width: 640px) {
      .cal-body { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 18px; align-items: start; }
      .cal-body .stat-pair { grid-template-columns: 1fr; }
    }
    .cal-body { display: grid; gap: 14px; }
    .cal-main { display: grid; gap: 8px; min-width: 0; }
    .exam-list { display: grid; gap: 10px; }
    .exam-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-radius: 18px; background: var(--zen-bg); }
    .exam-row h3 { margin: 6px 0 2px; font-size: 16px; font-weight: 600; }
    .exam-row p { margin: 2px 0; color: var(--zen-muted); font-size: 13px; }
    .exam-row .score { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .exam-row .score small { color: var(--zen-muted); font-size: 13px; font-weight: 400; }
    .exam-row .actions { flex: 0 0 auto; align-items: center; }
    .exam-row .button { background: var(--zen-surface); }
    .exam-row .button.primary { background: var(--zen-primary); }
    .subhead { margin: 26px 0 12px; font-size: 17px; font-weight: 600; }
    .subhead:first-of-type { margin-top: 4px; }
    .entry-card { display: flex; flex-direction: column; gap: 18px; min-width: 0; padding: 28px; border-radius: var(--zen-radius-panel); }
    /* 同一套淡色点缀：右上角一抹颜色，每个板块换一个色相 */
    .tint { --tint: 0, 113, 227; background: radial-gradient(120% 150% at 100% 0%, rgba(var(--tint), .13) 0%, rgba(var(--tint), 0) 58%), var(--zen-surface); }
    .tint.blue { --tint: 0, 113, 227; }
    .tint.orange { --tint: 255, 149, 0; }
    .tint.purple { --tint: 137, 87, 229; }
    .tint.teal { --tint: 20, 160, 180; }
    .tint.green { --tint: 52, 199, 89; }
    .eyebrow.blue { color: var(--zen-primary-dark); }
    .eyebrow.orange { color: var(--zen-orange); }
    .eyebrow.purple { color: var(--zen-purple); }
    .eyebrow.teal { color: var(--zen-teal); }
    .eyebrow.green { color: var(--zen-green); }
    .entry-card h2 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
    .entry-card .eyebrow { margin-bottom: 6px; }
    .stat-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .stat-pair div { min-width: 0; padding: 14px 16px; border-radius: 16px; background: var(--zen-bg); }
    .entry-card .stat-pair div { background: rgba(255, 255, 255, .8); box-shadow: 0 0 0 1px var(--zen-line); }
    .stat-pair strong { display: block; white-space: nowrap; font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .stat-pair span { color: var(--zen-muted); font-size: 13px; }
    .entry-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .entry-links a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 13px; border-radius: var(--zen-radius-pill); background: var(--zen-fill); color: #424245; font-size: 13px; transition: background-color .16s ease; }
    .entry-links a:hover { background: var(--zen-fill-hover); }
    .entry-links b { color: var(--zen-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .eyebrow { margin: 0 0 8px; color: var(--zen-muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    .hero-actions, .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .button, button.action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 9px 20px;
      border: 0;
      border-radius: var(--zen-radius-pill);
      background: var(--zen-fill);
      font-size: 15px;
      font-weight: 600;
      transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
    }
    .button:hover, button.action:hover { background: var(--zen-fill-hover); }
    .button:active, button.action:active { transform: scale(.97); }
    .button.primary, button.action.primary { color: white; background: var(--zen-primary); }
    .button.primary:hover, button.action.primary:hover { background: var(--zen-primary-hover); }
    .button.ghost, button.action.ghost { color: var(--zen-primary-dark); background: var(--zen-blue); }
    .button.ghost:hover, button.action.ghost:hover { background: #d8e9ff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .section-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .section-title h1, .section-title h2 { margin: 0; font-weight: 700; letter-spacing: -.02em; }
    .section-title h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.15; }
    .section-title h2 { font-size: 24px; line-height: 1.2; }
    .section-title p { margin: 6px 0 0; color: var(--zen-muted); }
    .section-meta { color: var(--zen-muted); font-size: 13px; text-align: right; }
    .status-list { display: grid; gap: 0; overflow: hidden; border-radius: 16px; background: var(--zen-bg); }
    .status-row {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 16px;
      border: 0;
      border-bottom: 1px solid var(--zen-line);
      border-radius: 0;
      background: transparent;
      line-height: 1.35;
      transition: background-color .16s ease;
    }
    .status-row:last-child { border-bottom: 0; }
    .status-row::before { content: ""; flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%; background: #aeaeb2; }
    .status-row > span:first-of-type { flex: 1 1 auto; min-width: 0; }
    a.status-row::after { content: "›"; flex: 0 0 auto; margin: -3px 0 0 -4px; color: #aeaeb2; font-size: 22px; line-height: 1; }
    a.status-row:hover { background: rgba(0, 0, 0, .04); }
    .status-row strong { font-size: 15px; font-weight: 600; }
    .status-row span { color: var(--zen-muted); font-size: 13px; }
    .status-row .count { color: var(--zen-ink); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .status-row.calm::before { background: #34c759; }
    .status-row.focus::before { background: #0071e3; }
    .status-row.pending::before { background: #aeaeb2; }
    .status-row.soft-risk::before { background: #ff9f0a; }

    .metric-rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-radius: var(--zen-radius-card); overflow: hidden; }
    .metric { min-width: 0; padding: 18px 20px; box-shadow: 0 0 0 .5px var(--zen-line-strong); }
    .metric strong { display: block; font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .metric span { color: var(--zen-muted); font-size: 13px; }
    .metric span::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: rgb(var(--dot, 174, 174, 178)); vertical-align: 1px; }
    .metric:nth-child(1) { --dot: 0, 113, 227; }
    .metric:nth-child(2) { --dot: 20, 160, 180; }
    .metric:nth-child(3) { --dot: 137, 87, 229; }
    .metric:nth-child(4) { --dot: 52, 199, 89; }
    .metric:nth-child(5) { --dot: 255, 149, 0; }

    .quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
    .breathing-card { position: relative; padding: 20px 44px 20px 22px; border-radius: var(--zen-radius-card); transition: transform .16s ease, box-shadow .16s ease; }
    .breathing-card::after { content: "›"; position: absolute; top: 14px; right: 20px; color: #aeaeb2; font-size: 24px; line-height: 1; }
    .breathing-card:hover { transform: translateY(-2px); box-shadow: var(--zen-hover-shadow); }
    .breathing-card strong { display: block; margin-bottom: 4px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .breathing-card span { color: var(--zen-muted); font-size: 14px; }

    .panel { margin-top: 16px; padding: 28px; border-radius: var(--zen-radius-panel); }
    .weekly-layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, .6fr); gap: 16px; }
    .recommendation { padding: 22px; border-radius: var(--zen-radius-card); background: #eef5ff; }
    .recommendation strong { display: block; margin-bottom: 7px; font-size: 17px; font-weight: 600; }
    .recommendation p { margin: 0; color: var(--zen-muted); }
    .recommendation p.eyebrow { margin-bottom: 8px; }
    .recent-list { display: grid; gap: 8px; }
    .recent-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 60px; padding: 11px 16px; border: 0; border-radius: 16px; background: var(--zen-bg); transition: background-color .16s ease; }
    .recent-row:hover { background: #ececf0; }
    .recent-row p { margin: 2px 0 0; color: var(--zen-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .recent-row time { color: var(--zen-muted); font-size: 12px; }

    .segment-group, .tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 0; border-radius: 12px; background: var(--zen-fill); }
    .tabs { width: fit-content; max-width: 100%; }
    .segment, .tabs button {
      min-height: 36px;
      padding: 6px 14px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--zen-ink);
      font-size: 14px;
      font-weight: 500;
      transition: background-color .16s ease, box-shadow .16s ease;
    }
    .segment:hover, .tabs button:hover { background: rgba(255, 255, 255, .5); }
    .segment.active, .tabs button.active { background: var(--zen-surface); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .04); }
    .resource-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .resource-card { padding: 18px 20px; border: 0; border-radius: 18px; background: var(--zen-bg); box-shadow: none; transition: transform .16s ease, background-color .16s ease; }
    .resource-card:hover { transform: translateY(-2px); background: #ececf0; }
    .resource-card h3 { min-height: 48px; margin: 0 0 5px; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
    .resource-card.category-card h3 { min-height: 24px; margin-bottom: 3px; }
    .resource-card.collection-card h3 { min-height: 24px; margin-bottom: 6px; }
    .resource-card-subtitle { display: block; min-height: 38px; margin-bottom: 8px; color: var(--zen-muted); font-size: 13px; line-height: 1.45; }
    .resource-card p { margin: 0; color: var(--zen-muted); font-size: 13px; }
    .progress-track { height: 5px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: rgba(0, 0, 0, .08); }
    .progress-track i { display: block; height: 100%; border-radius: inherit; background: var(--zen-primary); }
    .expand-row { display: flex; justify-content: center; margin-top: 16px; }

    .review-list { display: grid; gap: 10px; }
    .review-card { padding: 18px 20px; border: 0; border-radius: 18px; background: var(--zen-bg); box-shadow: none; }
    .review-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .review-card h3 { margin: 8px 0 4px; font-size: 16px; font-weight: 600; }
    .review-card p { margin: 4px 0; color: var(--zen-muted); }
    .review-card .source-line { font-size: 13px; }
    .source-line span { display: inline-block; margin-left: 8px; padding: 0 9px; border-radius: var(--zen-radius-pill); background: var(--zen-surface); font-size: 12px; white-space: nowrap; }
    .review-card .button, .review-card button.action { background: var(--zen-surface); }
    .review-card .button:hover, .review-card button.action:hover { background: #fafafc; box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
    .review-card .button.primary, .review-card button.action.primary { background: var(--zen-primary); }
    .review-card .button.primary:hover, .review-card button.action.primary:hover { background: var(--zen-primary-hover); box-shadow: none; }
    .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .pill.calm { color: var(--zen-green); background: var(--zen-sage); }
    .pill.focus { color: var(--zen-primary-dark); background: var(--zen-blue); }
    .pill.pending { color: var(--zen-muted); background: var(--zen-fill); }
    .pill.soft-risk { color: var(--zen-orange); background: var(--zen-warm); }
    .tabs { margin-bottom: 16px; }

    .diagnosis-wrap { overflow: auto; }
    .diagnosis { width: 100%; border-collapse: collapse; }
    .diagnosis th, .diagnosis td { padding: 13px 10px; border-bottom: 1px solid var(--zen-line); text-align: left; vertical-align: middle; }
    .diagnosis th { color: var(--zen-muted); font-size: 12px; font-weight: 600; letter-spacing: .02em; }
    .diagnosis td { font-variant-numeric: tabular-nums; }

  </aside>
  <main class="shell" id="app"></main>
  <script>
    __SAT_STORAGE_RUNTIME__
    const learningStorage = createSatLearningStore();
    const MANIFEST = __SAT_MANIFEST_JSON__;
    const GLOBAL_KEY = "sat-learning:v2";
    const SESSION_KEY = "sat-learning:today-session:v2";
    const refreshLegacyBackup = installSatLegacyBackupNotice(learningStorage, () => [
      GLOBAL_KEY, SESSION_KEY, "sat-learning:attempt-outbox:v2",
      ...Object.keys(MANIFEST.storageMigrations || {}),
      ...MANIFEST.pages.map(page => "sat-exam:v1:" + page.pageId)
    ]);
    const SAT_SKILL_ZH = {
      "Boundaries": "句子边界",
      "Central Ideas and Details": "主旨与细节",
      "Command of Evidence: Quantitative": "数据证据",
      "Command of Evidence: Textual": "文本证据",
      "Cross-Text Connections": "跨文本关联",
      "Form, Structure, and Sense": "语法形式",
      "Inferences": "推断题",
      "Rhetorical Synthesis": "修辞综合",
      "Text Structure and Purpose": "篇章结构与目的",
      "Transitions": "过渡词",
      "Words in Context": "词汇题"
    };
    const questionById = new Map(MANIFEST.questions.map(item => [item.questionId, item]));
    const searchTextById = new Map(MANIFEST.questions.map(question => [question.questionId,
      `${question.passage} ${question.prompt} ${(question.choices || []).map(choice => choice.text).join(" ")} ${question.skill} ${question.subtype} ${question.sourceSet}`.toLowerCase()]));
    const pageById = new Map(MANIFEST.pages.map(item => [item.pageId, item]));
    const questionAliasesByPage = MANIFEST.questionAliasesByPage || {};
    const app = document.getElementById("app");
    const syncStatus = document.getElementById("syncStatus");
    const topbar = document.getElementById("topbar");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const mobileNav = document.getElementById("mobileNav");
    let state = loadState();
    let cloudSession = null;
    let resourceKind = "set";
    let resourcesExpanded = false;
    let disposeSearch = null;

    function nowIso() { return new Date().toISOString(); }
    function timeOf(value) { const time = value ? new Date(value).getTime() : 0; return Number.isFinite(time) ? time : 0; }
    function record(value) { return value && typeof value === "object" && !Array.isArray(value) ? value : {}; }
    function uniq(value) { return [...new Set((Array.isArray(value) ? value : []).map(String).filter(Boolean))]; }
    function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char])); }
    function normalize(raw) {
      const value = record(raw);
      const revealIsCurrent = Boolean((value.submitted || value.checked) && value.revealed
        && timeOf(value.revealedAt) && timeOf(value.revealedAt) >= timeOf(value.submittedAt));
      return {
        selected: typeof value.selected === "string" ? value.selected : "",
        submitted: Boolean(value.submitted || value.checked), checked: Boolean(value.submitted || value.checked),
        correct: Boolean(value.correct), starred: Boolean(value.starred), revealed: revealIsCurrent,
        revealedAt: revealIsCurrent ? value.revealedAt : null, confidence: String(value.confidence || ""),
        gradingRevision: String(value.gradingRevision || ""),
        errorTags: uniq(value.errorTags), note: String(value.note || ""), highlights: uniq(value.highlights),
        updatedAt: value.updatedAt || null, submittedAt: value.submittedAt || null,
        firstWrongAt: value.firstWrongAt || null, lastAttemptAt: value.lastAttemptAt || null,
        lastRedoCorrect: value.lastRedoCorrect ?? null, attemptCount: Number(value.attemptCount || 0),
        redoCount: Number(value.redoCount || 0), reviewStage: Number(value.reviewStage || 0),
        nextDueAt: value.nextDueAt || null, mastered: Boolean(value.mastered), masteredAt: value.masteredAt || null
      };
    }
    function merge(leftRaw, rightRaw) {
      const left = normalize(leftRaw), right = normalize(rightRaw);
      const latest = timeOf(right.updatedAt) > timeOf(left.updatedAt)
        || (rightRaw && timeOf(right.updatedAt) === timeOf(left.updatedAt)) ? right : left;
      const sameOutcome = left.selected === right.selected && left.submitted === right.submitted && left.submittedAt === right.submittedAt;
      const gradeEvidence = sameOutcome ? (left.gradingRevision ? left : right.gradingRevision ? right : null) : null;
      return normalize({
        ...latest,
        ...(gradeEvidence && !latest.gradingRevision ? { gradingRevision: gradeEvidence.gradingRevision, correct: gradeEvidence.correct } : {}),
        revealed: Boolean(latest.submitted && latest.revealed),
        revealedAt: latest.submitted && latest.revealed ? latest.revealedAt || null : null,
        firstWrongAt: timeOf(left.firstWrongAt) && timeOf(right.firstWrongAt)
          ? (timeOf(left.firstWrongAt) <= timeOf(right.firstWrongAt) ? left.firstWrongAt : right.firstWrongAt)
          : left.firstWrongAt || right.firstWrongAt,
        attemptCount: Math.max(left.attemptCount, right.attemptCount),
        redoCount: Math.max(left.redoCount, right.redoCount)
      });
    }
    function emptyState() { return { version: 2, questions: {}, pages: {}, attempts: [] }; }
    function normalizeState(raw) {
      const source = record(raw), questions = {}, pages = {};
      for (const [questionId, value] of Object.entries(record(source.questions))) {
        if (questionId) questions[questionId] = normalize(value);
      }
      for (const [pageId, value] of Object.entries(record(source.pages))) {
        if (pageId && Object.keys(record(value)).length) pages[pageId] = record(value);
      }
      const attempts = (Array.isArray(source.attempts) ? source.attempts : [])
        .filter(item => Object.keys(record(item)).length)
        .slice(-1000);
      return { ...source, version: 2, questions, pages, attempts };
    }
    function showStorageFailure(message) {
      console.warn("[sat dashboard] " + message);
      setSync(message, "soft-risk");
      const hint = document.getElementById("builderHint");
      if (hint) {
        hint.setAttribute("role", "alert");
        hint.textContent = message;
      }
    }
    function loadState() {
      try { return normalizeState(JSON.parse(learningStorage.getItem(GLOBAL_KEY) || "{}")); }
      catch (error) {
        showStorageFailure("本机进度损坏或无法读取，已安全重置为空状态。");
        return emptyState();
      }
    }
    function save() {
      if (!learningStorage.ready()) return false;
      try {
        const write = () => {
          state = learningStorage.mergeGlobal(state, normalizeState, merge);
          const payload = JSON.stringify(state);
          learningStorage.setItem(GLOBAL_KEY, payload);
          if (learningStorage.getItem(GLOBAL_KEY) !== payload) throw new Error("storage readback mismatch");
          return true;
        };
        void learningStorage.coordinateGlobal(write).catch(() => showStorageFailure("本机汇总尚未保存，请保持本页打开并重试。"));
        return true;
      } catch (error) {
        showStorageFailure("本机存储不可用，本次进度未保存。");
        return false;
      }
    }
    function migrateLegacy() {
      try {
        for (let index = 0; index < learningStorage.length; index += 1) {
          const key = learningStorage.key(index) || "";
          if (!key.startsWith("sat-practice:")) continue;
          try {
            const legacy = JSON.parse(learningStorage.getItem(key) || "{}");
            const migration = MANIFEST.storageMigrations?.[key];
            if (!migration) continue;
            for (const [questionId, value] of Object.entries(record(legacy.answers))) {
              const canonicalId = String(record(migration.aliases)[questionId] || questionId);
              if (!questionById.has(canonicalId) || timeOf(value?.updatedAt) <= timeOf(legacy.resetAt)) continue;
              const normalized = normalize(value);
              if (!normalized.updatedAt) normalized.updatedAt = normalized.submitted ? "2026-01-01T00:00:00.000Z" : null;
              if (normalized.submitted && !normalized.correct && !normalized.firstWrongAt) normalized.firstWrongAt = normalized.updatedAt;
              state.questions[canonicalId] = merge(state.questions[canonicalId], normalized);
            }
          } catch {}
        }
      } catch (error) {
        showStorageFailure("无法读取旧版本机进度，已跳过迁移。");
      }
      save();
    }
    function qState(questionId) {
      const value = normalize(state.questions[questionId]);
      const revision = questionById.get(questionId)?.gradingRevision;
      const gradingCurrent = Boolean(revision && value.gradingRevision === revision);
      return { ...value, gradingCurrent, needsRecheck: value.submitted && !gradingCurrent };
    }
    function canonicalQuestionId(questionId, pageId = "") {
      return String(questionId || "");
    }
    function route() { const raw = location.hash.replace(/^#/, "") || "home", parts = raw.split("/"); return { root: parts[0], tab: parts[1] || "" }; }
    function setSync(message, tone = "pending") { syncStatus.textContent = message; syncStatus.className = `sync-status ${tone}`; }
    function setMobileMenu(open) {
      mobileNav.hidden = !open;
      mobileNav.classList.toggle("open", open);
      mobileMenuBtn.setAttribute("aria-expanded", String(open));
    }
    function activateNav() {
      const root = route().root;
      document.querySelectorAll(".desktop-nav a, .mobile-nav a").forEach(link => {
        const href = link.getAttribute("href");
        link.classList.toggle("active", href === `#${root}` || (root === "review" && href === "#review/wrong"));
      });
    }
    function metrics() {
      const values = MANIFEST.questions.map(question => qState(question.questionId));
      const submitted = values.filter(item => item.submitted), verified = submitted.filter(item => item.gradingCurrent), correct = verified.filter(item => item.correct);
      const wrong = values.filter(item => item.firstWrongAt && !item.mastered);
      const due = values.filter(item => item.nextDueAt && timeOf(item.nextDueAt) <= Date.now() && !item.mastered);
      return { submitted: submitted.length, correct: correct.length, accuracy: verified.length ? Math.round(correct.length / verified.length * 100) : null, needsRecheck: submitted.length - verified.length, wrong: wrong.length, due: due.length, mastered: values.filter(item => item.mastered).length };
    }
    function lastPage() { return Object.values(record(state.pages)).sort((left, right) => timeOf(right.lastVisitedAt) - timeOf(left.lastVisitedAt))[0] || null; }
    function pageProgress(page) {
      const ids = new Set(page.questionIds || []), items = MANIFEST.questions.filter(question => ids.has(question.questionId));
      const done = items.filter(question => qState(question.questionId).submitted).length;
      return { done, total: page.questionCount || items.length, pct: page.questionCount ? Math.round(done / page.questionCount * 100) : 0 };
    }
    function continueHref(last) {
      const page = pageById.get(last.pageId), pageRoute = page?.route || String(last.href || "").replace(/^.*sat-practice\//, "");
      return `${pageRoute}?focus=${encodeURIComponent(last.questionId || "")}`;
    }
    function formatTime(value) {
      if (!value) return "";
      return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric" }).format(new Date(value));
    }
    function render() {
      if (disposeSearch) { disposeSearch(); disposeSearch = null; }
      activateNav();

      if (currentRoute.root === "review") renderReview(currentRoute.tab || "wrong");
      else if (currentRoute.root === "diagnosis") renderDiagnosis();
      else if (currentRoute.root === "practice") renderBuilder();
      else if (currentRoute.root === "search") renderSearch();
      else if (currentRoute.root === "exam") renderExamCenter();

    function weeklyReport() {
      const attempts = state.attempts || [], now = Date.now();
      const week = attempts.filter(item => timeOf(item.submittedAt) > now - 7 * 86400000);
      const previous = attempts.filter(item => timeOf(item.submittedAt) > now - 14 * 86400000 && timeOf(item.submittedAt) <= now - 7 * 86400000);
      const accuracy = rows => rows.length ? Math.round(rows.filter(item => item.correct).length / rows.length * 100) : 0;
      const currentAccuracy = accuracy(week), delta = previous.length ? currentAccuracy - accuracy(previous) : null;
      const tagLabels = { vocabulary: "词汇", comprehension: "文章理解", evidence: "证据定位", logic: "逻辑推断", grammar: "语法规则", careless: "粗心", time: "时间不足" };
      const tagCounts = {};
      for (const question of MANIFEST.questions) {
        const item = qState(question.questionId);
        if (timeOf(item.updatedAt) <= now - 7 * 86400000) continue;
        for (const tag of item.errorTags) tagCounts[tag] = (tagCounts[tag] || 0) + 1;
      }
      const topTag = Object.entries(tagCounts).sort((left, right) => right[1] - left[1])[0];
      const weak = skillRows().filter(item => item.submitted >= 5).sort((left, right) => left.correct / left.submitted - right.correct / right.submitted)[0];
      return {
        week, currentAccuracy, delta,
        mastered: MANIFEST.questions.filter(question => timeOf(qState(question.questionId).masteredAt) > now - 7 * 86400000).length,
        topError: topTag ? `${tagLabels[topTag[0]] || topTag[0]}（${topTag[1]} 题）` : "暂无",
        recommendation: weak ? `优先训练：${weak.skill}` : "继续积累至少 5 题样本后生成薄弱项建议"
      };
    }
    function recentPractice() {
      return MANIFEST.questions.map(question => ({ question, state: qState(question.questionId) }))
        .filter(item => item.state.lastAttemptAt)
        .sort((left, right) => timeOf(right.state.lastAttemptAt) - timeOf(left.state.lastAttemptAt)).slice(0, 5);
    }
    function unfinishedPages() {
      return MANIFEST.pages.filter(page => page.kind === "set").map(page => ({ page, progress: pageProgress(page) }))
        .filter(item => item.progress.done > 0 && item.progress.done < item.progress.total);
    }
    function examEligiblePages() {
      return MANIFEST.pages.filter(page => page.kind === "set" && page.examEligible === true);
    }
    function examLibrary() {
      const pages = examEligiblePages();
      if (!pages.length) return "";
      return `<section class="panel" id="examLibrary">
        <div class="section-title"><div><p class="eyebrow orange">MOCK EXAM</p><h2>全真模考</h2><p>固定 Hard 分支，不模拟自适应分流，也不提供虚构换算分。</p></div><span class="section-meta">${pages.length} 套</span></div>
        <div class="resource-grid">${pages.map(page => `<article class="resource-card exam-card"><h3>${escapeHtml(page.title)}</h3><span class="resource-card-subtitle">${escapeHtml(examShape(page))}</span><p>普通练习与模考记录相互独立。</p><div class="hero-actions"><a class="button ghost" href="${page.route}">普通练习</a><a class="button primary" href="${page.route}?mode=exam">${examProgress(page) === "active" ? "继续模考" : "开始模考"}</a></div></article>`).join("")}</div>
      </section>`;

    /* ---------- 模考：入口、记录 ----------
       模考本身在练习页里进行（?mode=exam）。这里只读两类本机记录：
       sat-exam:v1:<pageId> 是每套题当前这一场，sat-exam-history:v1 是已完成的全部场次。 */
    function examShape(page) {
      const variant = (page.examVariants || [])[0], modules = page.moduleSpec || {};
      const parts = (variant?.modules || []).map(key => modules[key]).filter(Boolean);
      if (!parts.length) return "两个模块，分别计时";
      return `${parts.map(item => (item.questionIds || []).length).join(" + ")} 题 · ${parts.map(item => Math.round((item.durationSeconds || 0) / 60)).join(" + ")} 分钟`;
    }
    function examProgress(page) {
      try {
        const raw = JSON.parse(learningStorage.getItem("sat-exam:v1:" + page.pageId) || "null");
        return raw && ["m1", "m2"].includes(raw.phase) ? "active" : raw && ["complete", "review"].includes(raw.phase) ? "done" : "";
      } catch { return ""; }
    }
    function examHistory() {
      try {
        const raw = JSON.parse(learningStorage.getItem("sat-exam-history:v1") || "null");
        return (Array.isArray(raw && raw.records) ? raw.records : [])
          .filter(item => item && typeof item.id === "string" && Array.isArray(item.modules))
          .sort((left, right) => Number(right.completedAt || 0) - Number(left.completedAt || 0));
      } catch { return []; }
    }
    function examRecordScore(record) {
      return record.modules.reduce((sum, module) => ({
        correct: sum.correct + Number(module.score?.correct || 0), total: sum.total + Number(module.score?.total || 0)
      }), { correct: 0, total: 0 });
    }
    function renderExamCenter() {
      const pages = examEligiblePages(), records = examHistory();
      const available = pages.length ? `<div class="exam-list">${pages.map(page => {
        const progress = examProgress(page), taken = records.filter(item => item.pageId === page.pageId).length;
        return `<article class="exam-row"><div>${progress === "active" ? '<span class="pill focus">进行中</span>' : taken ? `<span class="pill calm">已完成 ${taken} 次</span>` : '<span class="pill pending">未开始</span>'}<h3>${escapeHtml(page.title)}</h3><p>${escapeHtml(examShape(page))} · 固定卷，不自适应分流</p></div><div class="actions"><a class="button primary" href="${page.route}?mode=exam">${progress === "active" ? "继续模考" : progress === "done" ? "查看本次成绩" : "开始模考"}</a></div></article>`;
      }).join("")}</div>` : renderEmpty("题库里暂时没有可以完整模考的试卷。");
      const history = records.length ? `<div class="exam-list">${records.map(record => {
        const page = pageById.get(record.pageId), score = examRecordScore(record);
        const detail = record.modules.map(module => `${escapeHtml(module.label || "Module")} ${Number(module.score?.correct || 0)}/${Number(module.score?.total || 0)}`).join(" · ");
        return `<article class="exam-row"><div><span class="pill pending">${escapeHtml(formatTime(new Date(Number(record.completedAt || 0)).toISOString()))}</span><h3>${escapeHtml(page?.title || record.title || "模考")}</h3><p>${detail}</p></div><div class="actions"><span class="score">${score.correct}<small> / ${score.total}</small></span>${page ? `<a class="button primary" href="${page.route}?mode=exam&history=${encodeURIComponent(record.id)}">查看答案与解析</a>` : ""}</div></article>`;
      }).join("")}</div>` : renderEmpty("完成一场模考后，这里会保存每一次的成绩和作答，可以单独回看。");
      app.innerHTML = `<section class="panel" style="margin-top:0"><div class="section-title"><div><p class="eyebrow orange">MOCK EXAM</p><h1>模考中心</h1><p>按考试的模块和计时完整做一套，全部交卷之后再看答案和解析。</p></div><span class="section-meta">${pages.length} 套可用 · ${records.length} 条记录</span></div>
        <h2 class="subhead">可用模考</h2>${available}

    }

    /* ---------- 首页 ---------- */
    let calendarMode = "week";
    function practiceDayKeys() {
      const days = new Set(Object.keys(readSatStudyDays(learningStorage)));
      for (const item of state.attempts || []) if (timeOf(item.submittedAt)) days.add(satStudyDayKey(new Date(item.submittedAt)));
      return days;
    }
    function practiceStreak(days, now = new Date()) {
      const cursor = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      // 今天还没练时，从昨天往前数，连续天数不会在当天清零
      if (!days.has(satStudyDayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
      let count = 0;
      while (days.has(satStudyDayKey(cursor))) { count += 1; cursor.setDate(cursor.getDate() - 1); }
      return count;
    }
    function calendarBlock() {
      const days = practiceDayKeys(), now = new Date(), todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const offset = (todayStart.getDay() + 6) % 7, monday = new Date(todayStart.getFullYear(), todayStart.getMonth(), todayStart.getDate() - offset);
      const dayAt = (base, shift) => new Date(base.getFullYear(), base.getMonth(), base.getDate() + shift);
      const cell = (date, outside = false) => {
        const done = days.has(satStudyDayKey(date)), isToday = date.getTime() === todayStart.getTime(), future = date.getTime() > todayStart.getTime();
        const label = isToday ? "今天" : future ? "" : done ? "已练" : "未练";
        return `<div class="cal-day${done ? " done" : ""}${isToday ? " today" : ""}${future ? " future" : ""}${outside ? " outside" : ""}" role="listitem" aria-label="${date.getMonth() + 1} 月 ${date.getDate()} 日${done ? "，已练习" : future ? "" : "，未练习"}"><strong>${date.getDate()}</strong><span>${label}</span></div>`;
      };
      const week = Array.from({ length: 7 }, (_, index) => dayAt(monday, index));
      let cells = week.map(date => cell(date)).join("");
      if (calendarMode === "month") {
        const first = new Date(now.getFullYear(), now.getMonth(), 1), start = dayAt(first, -((first.getDay() + 6) % 7));
        const last = new Date(now.getFullYear(), now.getMonth() + 1, 0), total = Math.ceil((((first.getDay() + 6) % 7) + last.getDate()) / 7) * 7;
        cells = Array.from({ length: total }, (_, index) => { const date = dayAt(start, index); return cell(date, date.getMonth() !== now.getMonth()); }).join("");
      }
      const weekDone = week.filter(date => days.has(satStudyDayKey(date))).length;
      return `<section class="hb-calendar" aria-label="练习日历">
        <div class="cal-head"><h2>练习日历</h2><div class="segment-group" role="tablist" aria-label="日历范围">
          <button class="segment ${calendarMode === "week" ? "active" : ""}" data-calendar-mode="week" role="tab" aria-selected="${calendarMode === "week"}">本周</button>
          <button class="segment ${calendarMode === "month" ? "active" : ""}" data-calendar-mode="month" role="tab" aria-selected="${calendarMode === "month"}">${now.getMonth() + 1} 月</button>
        </div></div>
        <div class="cal-body"><div class="cal-main">
          <div class="cal-names" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="cal-grid ${calendarMode}" role="list">${cells}</div>
        </div>
        <div class="stat-pair"><div><strong>${practiceStreak(days, now)}</strong><span>连续学习天数</span></div><div><strong>${weekDone}/7</strong><span>本周已练</span></div></div></div>
      </section>`;
    }

          <article class="entry-card hb-exam tint purple">

              <div><strong>${lastExamScore ? `${lastExamScore.correct}/${lastExamScore.total}` : "—"}</strong><span>${lastExamScore ? "上次成绩" : `已完成 ${examRecords.length} 次`}</span></div>

          </article>
          <section class="metric-rail hb-stats" aria-label="学习概览">

            <div class="metric"><strong>${formatSatStudyTime(study.week)}</strong><span>近 7 天学习时长</span></div>

                <div class="status-row focus"><span><strong>本周正确率</strong><br><span>${report.delta === null ? "等待上周数据" : `较上周 ${report.delta >= 0 ? "+" : ""}${report.delta}%`}</span></span><span class="count">${report.currentAccuracy}%</span></div>
                <div class="status-row calm"><span><strong>新掌握错题</strong><br><span>完成三个到期阶段</span></span><span class="count">${report.mastered}</span></div>

              </div>

                <span><strong>${escapeHtml(SAT_SKILL_ZH[question.skill] || question.skill)}</strong><p>${escapeHtml(question.prompt.slice(0, 120))}${question.prompt.length > 120 ? "…" : ""}</p></span>

    function resourceLibrary() {

      const hasCollections = MANIFEST.pages.some(page => page.kind === "collection");
      return `<section class="panel" id="resourceLibrary">
        <div class="section-title"><div><p class="eyebrow green">QUESTION LIBRARY</p><h2>题库入口</h2></div>

    function skillRows() {
      const groups = new Map();
      for (const question of MANIFEST.questions) {
        const key = question.skill || "未分类", row = groups.get(key) || { skill: key, total: 0, submitted: 0, correct: 0, wrong: 0, due: 0, subtypes: new Set() };

        const item = qState(question.questionId);
        if (item.submitted && item.gradingCurrent) { row.submitted += 1; if (item.correct) row.correct += 1; }
        if (item.firstWrongAt && !item.mastered) row.wrong += 1;
        if (item.nextDueAt && timeOf(item.nextDueAt) <= Date.now() && !item.mastered) row.due += 1;
        groups.set(key, row);

      return [...groups.values()].sort((left, right) => (left.submitted ? left.correct / left.submitted : 1) - (right.submitted ? right.correct / right.submitted : 1));
    }
    function subtypeRows(skill) {
      const groups = new Map();

      const form = document.getElementById("builderForm");

    function buildSession() {

      const session = {
        id: `session-${Date.now()}`, createdAt: nowIso(),

        filters: { subject: filters.subject, kinds: [...filters.kinds], domains: [...filters.domains], skills: [...filters.skills], genres: [...filters.genres], statuses: [...filters.statuses], difficulties: [...filters.levels], count },
        answers: {}, questions: selected.map(question => ({ questionId: question.questionId, route: question.route }))
      };

        const payload = JSON.stringify(session);
        learningStorage.setItem(SESSION_KEY, payload);

    }

    function renderSearch() {
      app.innerHTML = `<section class="panel" style="margin-top:0"><div class="section-title"><div><p class="eyebrow teal">QUESTION SEARCH</p><h1>全库搜索</h1><p>搜索文章、题干、选项、题型和来源套题。</p></div><span class="section-meta">${MANIFEST.uniqueQuestionCount} 道唯一题</span></div><div class="search-shell"><div class="search-controls"><input id="searchInput" type="search" placeholder="输入关键词" aria-label="搜索题目" aria-controls="searchResults" aria-describedby="searchStatus"><select id="skillFilter" aria-label="按题型筛选" aria-controls="searchResults"><option value="">全部题型</option>${skillRows().map(row => `<option>${escapeHtml(row.skill)}</option>`).join("")}</select><button class="action ghost" id="clearSearch" type="button">清空</button></div><p class="search-status" id="searchStatus" role="status" aria-live="polite" aria-atomic="true"></p></div><div class="review-list" id="searchResults" aria-busy="false" style="margin-top:14px">${renderEmpty("输入关键词或选择题型开始搜索。")}</div></section>`;
      const input = document.getElementById("searchInput"), filter = document.getElementById("skillFilter"), results = document.getElementById("searchResults"), status = document.getElementById("searchStatus");
      let searchTimer, composing = false, active = true;
      const isCurrentView = () => active && route().root === "search" && document.getElementById("searchInput") === input;
      const cancelPending = () => { clearTimeout(searchTimer); searchTimer = null; };
      const report = (message, busy = false) => {
        if (!isCurrentView()) return;
        results.setAttribute("aria-busy", String(busy));
        status.textContent = message;
      };
      disposeSearch = () => { active = false; cancelPending(); };
      const update = () => {
        cancelPending();
        if (!isCurrentView()) return;
        const term = input.value.trim().toLowerCase(), skill = filter.value;
        if (!term && !skill) { results.innerHTML = renderEmpty("输入关键词或选择题型开始搜索。"); report(""); return; }
        const found = [];
        for (const question of MANIFEST.questions) {
          if ((!skill || question.skill === skill) && (!term || searchTextById.get(question.questionId).includes(term))) found.push(question);
          if (found.length === 100) break;
        }
        results.innerHTML = found.length ? found.map(reviewCard).join("") : renderEmpty("没有匹配题目，试试更短的关键词或其他题型。");
        report(found.length ? `显示 ${found.length} 条结果${found.length === 100 ? "（最多显示 100 条，可缩小关键词）" : ""}。` : "没有匹配题目，试试更短的关键词或其他题型。");
      };
      const schedule = () => { cancelPending(); if (!isCurrentView()) return; report("正在筛选…", true); searchTimer = setTimeout(update, 120); };
      input.addEventListener("compositionstart", () => { composing = true; cancelPending(); report("输入中，完成后更新结果。"); });
      input.addEventListener("compositionend", () => { composing = false; schedule(); });
      input.addEventListener("input", event => { if (composing || event.isComposing) { cancelPending(); report("输入中，完成后更新结果。"); return; } schedule(); });
      filter.addEventListener("change", () => { cancelPending(); if (!composing) update(); });
      document.getElementById("clearSearch").addEventListener("click", () => { composing = false; cancelPending(); input.value = ""; filter.value = ""; update(); input.focus(); });
    }

    function mergeCloud(data) {
      for (const incoming of Array.isArray(data?.questionStates) ? data.questionStates : []) {
        if (!canMergeSatCloudQuestion(incoming)) continue;
        const questionId = canonicalQuestionId(incoming.questionId, incoming.pageId || "");
        state.questions[questionId] = merge(state.questions[questionId], incoming);
      }
      for (const page of Array.isArray(data?.pageStates) ? data.pageStates : []) if (page?.pageId && !isUnverifiedSatCloudPage(page.pageId)) { const local = state.pages[page.pageId]; if (!local || timeOf(page.lastVisitedAt || page.updatedAt) > timeOf(local.lastVisitedAt)) state.pages[page.pageId] = page; }
      save();
    }
    async function bootstrapCloud(session) {
      try {
        if (learningStorage.bind(session)) { state = loadState(); migrateLegacy(); render(); }
        refreshLegacyBackup();
      } catch (error) {
        cloudSession = null; state = emptyState(); render();
        refreshLegacyBackup();
        setSync("账号归属无法确认，已暂停同步", "soft-risk");
        return;
      }
      const scopeToken = learningStorage.token();
      cloudSession = session; setSync("正在同步", "focus");
      try { const data = await learningStorage.callOwned(session, "getSatLearningOverview", {}, scopeToken); if (!learningStorage.isCurrent(scopeToken)) return; mergeCloud(data || {}); setSync("进度已同步", "calm"); render(); }
      catch (error) { if (!learningStorage.isCurrent(scopeToken)) return; console.warn("[sat dashboard] sync failed", error); setSync("本机已保留", "soft-risk"); }
    }

    mobileMenuBtn.addEventListener("click", event => { event.stopPropagation(); setMobileMenu(mobileMenuBtn.getAttribute("aria-expanded") !== "true"); });
    mobileNav.addEventListener("click", event => { if (event.target.closest("a")) setMobileMenu(false); });
    document.addEventListener("click", event => { if (!topbar.contains(event.target)) setMobileMenu(false); });
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape" || event.defaultPrevented || mobileNav.hidden || mobileMenuBtn.getAttribute("aria-expanded") !== "true") return;
      event.preventDefault();
      setMobileMenu(false);
      if (window.innerWidth <= 860 && mobileMenuBtn.getClientRects().length) mobileMenuBtn.focus();
    });
    window.addEventListener("resize", () => { if (window.innerWidth > 860) setMobileMenu(false); });
    window.addEventListener("hashchange", () => { setMobileMenu(false); render(); });
    window.addEventListener("sat-cloudbase-session-ready", event => void bootstrapCloud(event.detail || window.satCloudbaseSession));
    window.addEventListener("sat-learning-owner-invalid", () => void bootstrapCloud({}));
    window.addEventListener("storage", event => {
      const scopedKey = learningStorage.eventKey(event);
      if (scopedKey === SAT_STUDY_TIME_KEY) { if (route().root === "home") render(); return; }
      if (scopedKey !== GLOBAL_KEY) return;
      state = learningStorage.mergeGlobal(state, normalizeState, merge);
      render();
    });
    refreshLegacyBackup();
    if (learningStorage.ready()) migrateLegacy();
    if (window.satCloudbaseSession) void bootstrapCloud(window.satCloudbaseSession);
    render();
  </script>
</body>
</html>
