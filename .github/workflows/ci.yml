name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python3 scripts/check-repository-scope.py --tracked
      # build/site: what sat-release.json releases (the reviewed baseline while every switch is off).
      - run: python3 scripts/build-site.py
      # build/site-preview: every release feature on, for review before the owner switches one on.
      - run: python3 scripts/build-site.py --preview-all
      - run: python3 scripts/build-demo.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/skill-sat-rw-classification/tests -p 'test_*.py'
      - run: python3 scripts/content_db.py check
      - run: python3 scripts/exam_modules.py --check
      - name: Real browser regression with synthetic learning records (every feature on)
        run: node scripts/verify-sat-learning-browser.mjs --root build/site-preview --expected-unique 4054 --expected-pages 118 --report build/reports/browser.json
        env:
          CHROME_PATH: google-chrome
      - name: Release switches, owner isolation, timers and page-state migration
        run: node scripts/verify-sat-release-and-isolation.mjs --release-root build/site --preview-root build/site-preview --report build/reports/release-isolation.json
        env:
          CHROME_PATH: google-chrome
