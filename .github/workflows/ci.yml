name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python3 scripts/check-repository-scope.py --tracked
      - run: python3 scripts/build-site.py
      - run: python3 scripts/build-demo.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/skill-sat-rw-classification/tests -p 'test_*.py'
      - name: Real browser regression with synthetic learning records
        run: node scripts/verify-sat-learning-browser.mjs --expected-unique 4054 --expected-pages 118 --report build/reports/browser.json
        env:
          CHROME_PATH: google-chrome
